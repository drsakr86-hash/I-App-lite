<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07121b"><title>I App — شاشة نداء المرضى</title><style>html,body{margin:0;height:100%;background:#07121b;color:#fff;font-family:Tahoma,'Segoe UI',Arial,sans-serif}*{box-sizing:border-box}body{overflow:auto}.wrap{min-height:100%;padding:24px;max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:32px;font-weight:900;color:#08b9f2}.sub{color:#91a2b2;font-size:18px;margin-top:4px}.clock{font-size:26px;font-weight:800}.card{background:#14232c;border:2px solid #263c4a;border-radius:26px;padding:28px;margin-bottom:18px}.current{text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center}.announce{color:#f6c744;font-size:30px;font-weight:900;margin-bottom:20px}.num{font-size:86px;font-weight:900;line-height:1.1}.name{font-size:30px;font-weight:800;margin-top:14px}.doctor{color:#91a2b2;font-size:20px;margin-top:10px}.empty{color:#fff;font-size:36px;font-weight:900}.muted{color:#91a2b2;font-size:18px;margin-top:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stat{text-align:center;padding:20px;border:1px solid #304653;border-radius:18px}.value{font-size:46px;font-weight:900;color:#08b9f2}.waiting .value{color:#f6c744}.label{color:#91a2b2;font-size:18px;margin-top:5px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:14px;padding:14px 20px;font-size:17px;font-weight:800;cursor:pointer;background:#173746;color:#fff}button.on{background:#124d3c;border:2px solid #21d68b;color:#21d68b}.next h2{margin:0 0 12px}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #29404c;font-size:19px}.status{margin-top:10px;color:#91a2b2;font-size:14px}.error{color:#ff7a7a}.pulse{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.025)}}@media(max-width:600px){.wrap{padding:14px}.brand{font-size:25px}.sub{font-size:14px}.clock{font-size:20px}.card{padding:18px;border-radius:20px}.current{min-height:340px}.announce{font-size:25px}.num{font-size:65px}.name{font-size:25px}.empty{font-size:30px}.stats{gap:10px}.value{font-size:38px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">I App 👁</div><div class="sub">شاشة نداء المرضى</div></div><div id="clock" class="clock"></div></header><section id="current" class="card current"><div class="empty">برجاء الانتظار</div><div class="muted">سيظهر المريض عند استدعائه</div></section><section class="card"><div class="stats"><div class="stat waiting"><div id="waitingCount" class="value">0</div><div class="label">في الانتظار</div></div><div class="stat"><div id="inCount" class="value">0</div><div class="label">داخل العيادة</div></div></div><div class="controls"><button id="soundBtn">🔇 تفعيل الصوت</button><button id="testBtn">🔊 تجربة النداء</button><button id="repeatBtn">📣 إعادة نداء المريض</button></div><div id="status" class="status">جاري الاتصال بقاعدة البيانات…</div></section><section class="card next"><h2>⏳ القادمون</h2><div id="nextList" class="muted">لا يوجد مرضى في الانتظار</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL='https://mofdveiwlaymlabvsypu.supabase.co',SB_KEY='sb_publishable_tVZ1mUOyb3vOjRV1jBpq6g_P2u-xIqF';
const sb=window.supabase.createClient(SB_URL,SB_KEY);let soundOn=false,lastKey='';let appointments=[];
const $=id=>document.getElementById(id);
function today(){return new Date().toISOString().slice(0,10)}
function speak(a){if(!soundOn||!a||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const raw=String(a.patient||'').trim();const name=raw.replace(/[،,؛;]+/g,' ').replace(/\s+/g,' ').trim();const text=name?`${name}، برجاء التوجه لغرفة الكشف`:'برجاء التوجه لغرفة الكشف';const u=new SpeechSynthesisUtterance(text);u.lang='ar-EG';u.rate=.72;u.pitch=1;u.volume=1;const voices=speechSynthesis.getVoices();const ar=voices.filter(v=>/^ar/i.test(v.lang));const voice=ar.find(v=>/^ar-EG/i.test(v.lang))||ar.find(v=>/Egypt|مصر/i.test(v.name))||ar.find(v=>/^ar/i.test(v.lang));if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
speechSynthesis?.getVoices?.();
$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').classList.toggle('on',soundOn);$('soundBtn').textContent=soundOn?'🔊 الصوت مفعل':'🔇 تفعيل الصوت';if(soundOn)speak({patient:'محمد علي السيد'})};
$('testBtn').onclick=()=>{const a=appointments.find(x=>x.waitStatus==='called')||appointments.find(x=>x.waitStatus==='in')||{patient:'محمد علي السيد'};soundOn=true;$('soundBtn').classList.add('on');$('soundBtn').textContent='🔊 الصوت مفعل';speak(a)};$('repeatBtn').onclick=()=>{const a=appointments.find(x=>x.waitStatus==='called')||appointments.find(x=>x.waitStatus==='in');if(a){soundOn=true;speak(a)}else{alert('لا يوجد مريض مستدعى حاليًا')}};
function render(){const t=today();const arr=appointments.filter(a=>a.date===t);const called=arr.filter(a=>a.waitStatus==='called').sort((a,b)=>Number(b.calledAt||0)-Number(a.calledAt||0));const inside=arr.filter(a=>a.waitStatus==='in');const waiting=arr.filter(a=>a.waitStatus==='waiting').sort((a,b)=>Number(a.arrivedAt||a.id)-Number(b.arrivedAt||b.id));const current=called[0]||inside[0]||null;$('waitingCount').textContent=waiting.length;$('inCount').textContent=inside.length;if(current){$('current').innerHTML='<div class="announce pulse">📣 يرجى التوجه للعيادة</div><div class="num">'+(current.queueNumber?('#'+current.queueNumber):'')+'</div><div class="name">'+(current.patient||'مريض')+'</div><div class="doctor">'+(current.doctor||'')+'</div>'}else{$('current').innerHTML='<div class="empty">🪑 برجاء الانتظار</div><div class="muted">سيظهر المريض عند استدعائه</div>'}if(waiting.length){$('nextList').innerHTML=waiting.slice(0,6).map((a,i)=>'<div class="row"><span>'+(a.queueNumber?('#'+a.queueNumber+' — '):'')+(a.patient||'مريض')+'</span><span>'+(a.doctor||'')+'</span></div>').join('')}else $('nextList').textContent='لا يوجد مرضى في الانتظار';const key=current?String(current.id)+':'+String(current.calledAt||''):'';if(key&&key!==lastKey){lastKey=key;if(soundOn)setTimeout(()=>speak(current),150)} }
async function load(){try{const {data,error}=await sb.from('iapp_store').select('value').eq('key','iapp_appointments').maybeSingle();if(error)throw error;appointments=data?.value||[];$('status').textContent='✓ متصل · آخر تحديث '+new Date().toLocaleTimeString('ar-EG');render()}catch(e){$('status').innerHTML='<span class="error">تعذر الاتصال بقاعدة البيانات: '+(e.message||e)+'</span>';}}
load();setInterval(load,3000);setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);$('clock').textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
</script></body></html>
