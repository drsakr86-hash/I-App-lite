<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07121b"><title>I App — شاشة نداء المرضى</title>
<style>
html,body{margin:0;height:100%;background:#07121b;color:#fff;font-family:Tahoma,'Segoe UI',Arial,sans-serif}*{box-sizing:border-box}body{overflow:auto}
.wrap{min-height:100%;padding:24px;max-width:1100px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
.brand{font-size:32px;font-weight:900;color:#08b9f2}.sub{color:#91a2b2;font-size:18px;margin-top:4px}
.clock{font-size:26px;font-weight:800}
.card{background:#14232c;border:2px solid #263c4a;border-radius:26px;padding:28px;margin-bottom:18px;transition:opacity .3s}
.current{text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.announce{color:#f6c744;font-size:30px;font-weight:900;margin-bottom:20px}
.num{font-size:96px;font-weight:900;line-height:1.1;color:#08b9f2}
.name{font-size:34px;font-weight:800;margin-top:14px}
.doctor{color:#91a2b2;font-size:20px;margin-top:10px}
.empty{color:#fff;font-size:36px;font-weight:900}.muted{color:#91a2b2;font-size:18px;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{text-align:center;padding:20px;border:1px solid #304653;border-radius:18px}
.value{font-size:46px;font-weight:900;color:#08b9f2}.waiting .value{color:#f6c744}
.label{color:#91a2b2;font-size:18px;margin-top:5px}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:14px;padding:14px 20px;font-size:17px;font-weight:800;cursor:pointer;background:#173746;color:#fff;font-family:inherit}
button.on{background:#124d3c;border:2px solid #21d68b;color:#21d68b}
button.small{padding:8px 14px;font-size:14px}
.next h2{margin:0 0 12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #29404c;font-size:19px}
.row .q{color:#08b9f2;font-weight:900;margin-left:10px}
.recent{margin-top:18px;color:#91a2b2;font-size:16px}
.status{margin-top:10px;color:#91a2b2;font-size:14px}
.offline{display:none;background:#5a1620;border:2px solid #ff7a7a;color:#ffd6d6;border-radius:16px;padding:14px 18px;margin-bottom:18px;font-size:18px;font-weight:800;text-align:center}
body.is-offline .offline{display:block}body.is-offline #current{opacity:.35}
.pulse{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.025)}}
.picker{display:grid;gap:14px;margin-top:10px}.picker button{font-size:22px;padding:22px}
@media(max-width:600px){.wrap{padding:14px}.brand{font-size:25px}.sub{font-size:14px}.clock{font-size:20px}.card{padding:18px;border-radius:20px}.current{min-height:340px}.announce{font-size:25px}.num{font-size:70px}.name{font-size:27px}.empty{font-size:30px}.stats{gap:10px}.value{font-size:38px}}
</style></head>
<body>
<main class="wrap">
  <header class="top">
    <div><div class="brand">I App 👁</div><div class="sub" id="clinicTitle">شاشة نداء المرضى</div></div>
    <div id="clock" class="clock"></div>
  </header>

  <!-- Clinic picker: shown only when the screen has no clinic assigned yet -->
  <section id="pickerCard" class="card" style="display:none">
    <h2 style="margin:0 0 6px">اختر العيادة التي تعمل بها هذه الشاشة</h2>
    <div class="muted">سيتم حفظ الاختيار على هذا الجهاز. ويمكن أيضاً فتح الشاشة برابط مثل <b dir="ltr">?clinic=damanhour</b></div>
    <div id="picker" class="picker"></div>
  </section>

  <div id="app" style="display:none">
    <div class="offline" id="offline">⚠ الشاشة غير متصلة — المعروض قد لا يكون محدّثاً</div>
    <section id="current" class="card current"></section>
    <section class="card">
      <div class="stats">
        <div class="stat waiting"><div id="waitingCount" class="value">0</div><div class="label">في الانتظار</div></div>
        <div class="stat"><div id="inCount" class="value">0</div><div class="label">داخل العيادة</div></div>
      </div>
      <div class="controls">
        <button id="soundBtn">🔇 تفعيل الصوت</button>
        <button id="testBtn">🔊 تجربة النداء</button>
        <button id="repeatBtn">📣 إعادة نداء المريض</button>
        <button id="changeClinic" class="small">🏥 تغيير العيادة</button>
      </div>
      <div id="status" class="status">جاري الاتصال بقاعدة البيانات…</div>
    </section>
    <section class="card next"><h2>⏳ القادمون</h2><div id="nextList" class="muted">لا يوجد مرضى في الانتظار</div></section>
  </div>
</main>

<!-- Pinned version: an unpinned "@2" can change under a running screen -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';

// ── Config ────────────────────────────────────────────────────────
var SB_URL='https://mofdveiwlaymlabvsypu.supabase.co';
var SB_KEY='sb_publishable_tVZ1mUOyb3vOjRV1jBpq6g_P2u-xIqF';
var CLINICS=[
  {v:'دمنهور',slug:'damanhour',l:'عيادة دمنهور'},
  {v:'الرحمانية',slug:'rahmania',l:'عيادة الرحمانية'},
  {v:'مركز دمنهور للعيون',slug:'center',l:'مركز دمنهور للعيون'}
];
var POLL_MS=10000;          // fallback polling (realtime pushes changes instantly)
var OFFLINE_AFTER_MS=25000; // show the offline banner after this long without data
var params=new URLSearchParams(location.search);
var SHOW_FULL_NAME=params.get('full')==='1'; // on-screen text: first name + initial by default (the voice always says the full name)
// Voice: 'online' (default) = same Google Arabic voice on every screen, so all screens sound identical;
// falls back to the device's own Arabic voice. 'device' = device voice only.
var VOICE_MODE=params.get('voice')==='device'?'device':'online';
var CALL_CHANNEL='iapp_queue_calls'; // shared with the doctor/secretary app
// The database is protected by RLS, so the screen signs in with a shared
// account created in Supabase (Authentication → Users), e.g. screen@sakr.clinic.
var KIOSK_EMAIL='screen@sakr.clinic';
var KIOSK_PASSWORD='123456';

var $=function(id){return document.getElementById(id);};
var synth=window.speechSynthesis||null; // never reference the bare global (ReferenceError on TVs/WebViews)

// ── Helpers ───────────────────────────────────────────────────────
function localISO(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e;} // textContent = no HTML injection
function words(n){return String(n||'').replace(/[<>]/g,'').replace(/[،,؛;]+/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);}
function displayName(n){var w=words(n);if(!w.length)return 'مريض';if(SHOW_FULL_NAME)return w.join(' ');return w.length>1?w[0]+' '+w[1].charAt(0)+'.':w[0];}
function spokenName(n){return words(n).slice(0,5).join(' ');} // full name (max 5 parts)
function isActive(a){return a&&!a.cancelled&&a.status!=='cancelled'&&a.waitStatus!=='cancelled';}

// ── Clinic selection ─────────────────────────────────────────────
function resolveClinic(){
  var q=params.get('clinic');
  if(q){var c=CLINICS.find(function(x){return x.slug===q||x.v===q||x.l===q;});if(c){try{localStorage.setItem('queue_clinic',c.v);}catch(e){}return c;}}
  var saved=null;try{saved=localStorage.getItem('queue_clinic');}catch(e){}
  return CLINICS.find(function(x){return x.v===saved;})||null;
}
var clinic=resolveClinic();
function showPicker(){
  $('app').style.display='none';$('pickerCard').style.display='block';
  var p=$('picker');p.textContent='';
  CLINICS.forEach(function(c){var b=el('button',null,'🏥 '+c.l);b.onclick=function(){try{localStorage.setItem('queue_clinic',c.v);}catch(e){}clinic=c;start();};p.appendChild(b);});
}
$('changeClinic').onclick=function(){try{localStorage.removeItem('queue_clinic');}catch(e){}if(params.get('clinic')){params.delete('clinic');history.replaceState(null,'',location.pathname+(params.toString()?'?'+params:''));}clinic=null;showPicker();};

// ── Sound: chime + queued speech (a second call never cuts the first) ──
var soundOn=false,speechQueue=[],speaking=false,audioCtx=null;
function chime(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    [[880,0],[660,0.28]].forEach(function(t){
      var o=audioCtx.createOscillator(),g=audioCtx.createGain(),s=audioCtx.currentTime+t[1];
      o.type='sine';o.frequency.value=t[0];o.connect(g);g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.5,s+0.03);g.gain.exponentialRampToValueAtTime(0.0001,s+0.6);
      o.start(s);o.stop(s+0.65);
    });
  }catch(e){}
}
function arabicVoice(){
  if(!synth)return null;
  var ar=synth.getVoices().filter(function(v){return /^ar/i.test(v.lang);});
  return ar.find(function(v){return /^ar-EG/i.test(v.lang);})||ar.find(function(v){return /Egypt|مصر/i.test(v.name);})||ar[0]||null;
}
var announced={}; // keys already called on this screen (broadcast + data change never double-call)
function callKey(a){return String(a.id)+':'+String(a.calledAt||'')+':'+String(a.repeat||'');}
function announce(a){
  if(!a)return;var k=callKey(a);if(announced[k])return;announced[k]=Date.now();
  if(!soundOn)return;speechQueue.push(a);if(!speaking)nextSpeech();
}
function callText(a){var name=spokenName(a.patient),num=a._q?('رقم '+a._q+'، '):'';return num+(name?name+'، ':'')+'برجاء التوجه لغرفة الكشف';}
function speakDevice(text,done){
  var voice=arabicVoice();
  if(!synth||!voice){done();return false;}
  try{
    var u=new SpeechSynthesisUtterance(text);u.lang='ar-EG';u.rate=.8;u.voice=voice;
    u.onend=done;u.onerror=done;setTimeout(done,15000);synth.speak(u);return true;
  }catch(e){done();return false;}
}
function speakOnline(text,done,fallback){
  var ended=false,fin=function(ok){if(ended)return;ended=true;if(ok)done();else fallback();};
  try{
    var au=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&ttsspeed=0.85&q='+encodeURIComponent(text.slice(0,190)));
    au.onended=function(){fin(true);};au.onerror=function(){fin(false);};
    var p=au.play();if(p&&p.catch)p.catch(function(){fin(false);});
    setTimeout(function(){fin(true);},15000);
  }catch(e){fin(false);}
}
function nextSpeech(){
  var a=speechQueue.shift();if(!a){speaking=false;return;}
  speaking=true;chime();
  var once=false,next=function(){if(once)return;once=true;setTimeout(nextSpeech,700);};
  setTimeout(function(){
    var text=callText(a);
    if(VOICE_MODE==='online')speakOnline(text,next,function(){speakDevice(text,next);});
    else speakDevice(text,next);
  },900);
}
// Tell every other screen to call (or re-call) this patient right now.
function broadcastCall(a){
  if(!callCh)return;
  try{callCh.send({type:'broadcast',event:'call',payload:{id:a.id,calledAt:a.calledAt||'',repeat:a.repeat||'',patient:a.patient||'',clinic:a.clinic||'',doctor:a.doctor||''}});}catch(e){}
}
if(synth){try{synth.getVoices();synth.onvoiceschanged=function(){synth.getVoices();};}catch(e){}}
function setSound(on){soundOn=on;$('soundBtn').classList.toggle('on',on);$('soundBtn').textContent=on?'🔊 الصوت مفعل':'🔇 تفعيل الصوت';}
$('soundBtn').onclick=function(){setSound(!soundOn);if(soundOn){chime();requestWakeLock();}};
$('testBtn').onclick=function(){setSound(true);requestWakeLock();var t=current||{id:'test',patient:'محمد علي السيد',_q:1};announce(Object.assign({},t,{repeat:'test'+Date.now()}));};
$('repeatBtn').onclick=function(){if(!current){alert('لا يوجد مريض مستدعى حالياً');return;}setSound(true);var r=Object.assign({},current,{repeat:Date.now()});announce(r);broadcastCall(r);};

// ── Keep the screen awake ────────────────────────────────────────
var wakeLock=null;
function requestWakeLock(){try{if('wakeLock' in navigator&&!wakeLock)navigator.wakeLock.request('screen').then(function(l){wakeLock=l;l.addEventListener('release',function(){wakeLock=null;});}).catch(function(){});}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){requestWakeLock();load();}});

// ── Data & render ────────────────────────────────────────────────
var appointments=[],current=null,lastKey=null,lastOk=0,started=false,sb=null,callCh=null;

function render(){
  var t=localISO();
  var arr=appointments.filter(function(a){return isActive(a)&&a.date===t&&(a.clinic||'')===clinic.v;});
  // Queue number = order of arrival today at this clinic (stable once assigned).
  arr.filter(function(a){return a.arrivedAt;}).sort(function(a,b){return Number(a.arrivedAt)-Number(b.arrivedAt)||Number(a.id)-Number(b.id);})
     .forEach(function(a,i){a._q=a.queueNumber||i+1;});
  var called=arr.filter(function(a){return a.waitStatus==='called';}).sort(function(a,b){return Number(b.calledAt||0)-Number(a.calledAt||0);});
  var inside=arr.filter(function(a){return a.waitStatus==='in';});
  var waiting=arr.filter(function(a){return a.waitStatus==='waiting';}).sort(function(a,b){return Number(a.arrivedAt||a.id)-Number(b.arrivedAt||b.id);});
  current=called[0]||null; // only a patient actually being called — not one already inside

  $('waitingCount').textContent=waiting.length;$('inCount').textContent=inside.length;

  var box=$('current');box.textContent='';
  if(current){
    box.appendChild(el('div','announce pulse','📣 يرجى التوجه لغرفة الكشف'));
    if(current._q)box.appendChild(el('div','num','#'+current._q));
    box.appendChild(el('div','name',displayName(current.patient)));
    if(current.doctor)box.appendChild(el('div','doctor',current.doctor));
    if(called.length>1){
      var r=el('div','recent','تم نداء أيضاً: ');
      r.appendChild(document.createTextNode(called.slice(1,4).map(function(a){return (a._q?'#'+a._q+' ':'')+displayName(a.patient);}).join(' · ')));
      box.appendChild(r);
    }
  }else{
    box.appendChild(el('div','empty','🪑 برجاء الانتظار'));
    box.appendChild(el('div','muted','سيظهر المريض عند استدعائه'));
  }

  var list=$('nextList');list.textContent='';
  if(waiting.length){
    waiting.slice(0,6).forEach(function(a){
      var row=el('div','row'),left=el('span');
      if(a._q)left.appendChild(el('span','q','#'+a._q));
      left.appendChild(document.createTextNode(displayName(a.patient)));
      row.appendChild(left);row.appendChild(el('span',null,a.doctor||''));list.appendChild(row);
    });
  }else list.textContent='لا يوجد مرضى في الانتظار';

  // Announce every *new* call (new patient or re-call). Nothing is announced
  // for calls that already existed when the screen was opened.
  // Fallback path (if the instant broadcast was missed): announce when the data shows a new call.
  var key=current?callKey(current):'';
  if(lastKey===null){lastKey=key;if(key)announced[key]=Date.now();return;}
  if(key&&key!==lastKey)announce(current);
  lastKey=key;
}

function setData(value){
  appointments=Array.isArray(value)?value:[];
  lastOk=Date.now();document.body.classList.remove('is-offline');
  $('status').textContent='✓ متصل · آخر تحديث '+new Date().toLocaleTimeString('ar-EG');
  render();
}
var authReady=false;
function signIn(){
  if(authReady)return Promise.resolve(true);
  if(!KIOSK_EMAIL||!KIOSK_PASSWORD){
    $('status').innerHTML='<span class="error">لم يتم ضبط حساب الشاشة — أضف KIOSK_EMAIL و KIOSK_PASSWORD في أعلى الملف</span>';
    return Promise.resolve(false);
  }
  return sb.auth.getSession().then(function(r){
    if(r&&r.data&&r.data.session){authReady=true;return true;}
    return sb.auth.signInWithPassword({email:KIOSK_EMAIL,password:KIOSK_PASSWORD}).then(function(res){
      if(res.error){$('status').innerHTML='<span class="error">تعذر تسجيل دخول الشاشة: '+(res.error.message||'')+'</span>';return false;}
      authReady=true;return true;
    });
  }).catch(function(){return false;});
}
function load(){
  if(!sb||!clinic)return;
  if(!authReady){signIn().then(function(ok){if(ok)load();});return;}
  sb.from('iapp_store').select('value').eq('key','iapp_appointments').maybeSingle().then(function(res){
    if(res.error)throw res.error;setData(res.data?res.data.value:[]);
  }).catch(function(e){$('status').textContent='تعذر الاتصال بقاعدة البيانات: '+(e&&e.message||e);});
}
function onBroadcastCall(msg){
  var a=msg&&msg.payload;if(!a||!clinic||(a.clinic||'')!==clinic.v)return;
  // Use today's queue number if the appointment is already loaded.
  var known=appointments.find(function(x){return String(x.id)===String(a.id);});
  if(known&&known._q)a._q=known._q;
  announce(a);
}
function subscribe(){
  try{
    callCh=sb.channel(CALL_CHANNEL,{config:{broadcast:{self:false}}});
    callCh.on('broadcast',{event:'call'},onBroadcastCall).subscribe(function(st){
      if(st==='SUBSCRIBED')$('status').textContent=$('status').textContent.replace(' · النداء الفوري غير متاح','');
    });
  }catch(e){}
  try{
    sb.channel('queue_display_'+Date.now())
      .on('postgres_changes',{event:'*',schema:'public',table:'iapp_store',filter:'key=eq.iapp_appointments'},function(p){if(p&&p.new&&p.new.value!==undefined)setData(p.new.value);})
      .subscribe();
  }catch(e){}
}

function start(){
  $('pickerCard').style.display='none';$('app').style.display='block';
  $('clinicTitle').textContent='شاشة نداء المرضى — '+clinic.l;
  lastKey=null;
  if(!window.supabase){$('status').textContent='تعذر تحميل مكتبة الاتصال — تحقق من الإنترنت ثم أعد تحميل الصفحة';document.body.classList.add('is-offline');return;}
  if(!sb)sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'iapp_queue_auth'}});
  if(!started){
    started=true;signIn().then(function(){subscribe();});setInterval(load,POLL_MS);
    setInterval(function(){if(Date.now()-lastOk>OFFLINE_AFTER_MS)document.body.classList.add('is-offline');},5000);
    window.addEventListener('online',load);
  }
  load();
}

function tick(){$('clock').textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
tick();setInterval(tick,1000);
// Re-render just after midnight so the new day starts clean.
setInterval(function(){if(clinic&&started)render();},60000);

if(clinic)start();else showPicker();
})();
</script>
</body></html>
