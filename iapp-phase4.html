      <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:6,marginBottom:16}}>

    </div>
  );

// ── Main App ──────────────────────────────────────────────────
function SecretaryApp(){
  const [session,setSession]=useState(()=>{
    try { const p=localStorage.getItem("iapp_session"); if(p) return JSON.parse(p); } catch {}
    try { return JSON.parse(sessionStorage.getItem("iapp_session")); } catch { return null; }
  });
  const [tab,setTab]=useState("apts");
  const [apts,setAptsState]=useState([]);
  const [patients,setPatients]=useState([]);
  const [prices,setPrices]=useState([]);
  const [modal,setModal]=useState(null);
  const [collectApt,setCollectApt]=useState(null);
  const [filterDate,setFilterDate]=useState(localISO());
  const [filterClinic,setFilterClinic]=useState("");
  const [search,setSearch]=useState("");
  const [filterFromPatient,setFilterFromPatient]=useState(false);
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const [syncing,setSyncing]=useState(false);
  const today=localISO();

  const loadData=async()=>{
    const [a,p,pr]=await Promise.all([sbGet("iapp_appointments"),sbGet("iapp_patients"),sbGet("iapp_prices")]);
    if(a)setAptsState(a);if(p)setPatients(p);if(pr)setPrices(pr);setLoading(false);
  };
  useEffect(()=>{
    if(!session)return;
    loadData();
    let channel=null;
    try{
      channel=getSB().channel("iapp_store_changes")
        .on("postgres_changes",{event:"*",schema:"public",table:"iapp_store"},payload=>{
          const key=(payload.new&&payload.new.key)||(payload.old&&payload.old.key);
          if(!key||key==="iapp_appointments"||key==="iapp_patients"||key==="iapp_prices"||key==="iapp_visits")loadData();
        })
        .subscribe();
    }catch(e){channel=null;}
    // fallback polling in case realtime isn't enabled on this Supabase project
    const iv=setInterval(loadData,5000);
    return()=>{clearInterval(iv);if(channel){try{getSB().removeChannel(channel);}catch{}}};
  },[session]);

  // Every change is applied to the latest server copy (never to a possibly stale
  // local list), so a patient booking made seconds ago is never overwritten.
  const mutateApts=async(fn,verify,okMsg)=>{
    setSyncing(true);
    const res=await sbMutate("iapp_appointments",fn,verify);
    setSyncing(false);
    if(res.ok){setAptsState(res.data);setToast(okMsg||"تم الحفظ");}
    else if(res.error==="offline"||res.error==="conflict")alert("❌ لم يتم الحفظ — تحقق من الاتصال وحاول مرة أخرى");
    else alert(res.error);
    return res.ok;
  };
  const aptConflict=(list,f)=>list.some(a=>a.id!==f.id&&isActiveApt(a)&&a.doctor===f.doctor&&a.date===f.date&&a.time===f.time);
  const addApt=f=>mutateApts(list=>aptConflict(list,f)?{abort:"⚠ تم حجز نفس الموعد لنفس الطبيب للتو من جهاز آخر"}:[...list,f],list=>list.some(a=>a.id===f.id));
  const editApt=f=>mutateApts(list=>aptConflict(list,f)?{abort:"⚠ تم حجز نفس الموعد لنفس الطبيب للتو من جهاز آخر"}:list.map(a=>a.id===f.id?f:a));
  const deleteApt=async id=>{
    const rec=apts.find(x=>x.id===id);
    await trashPut("iapp_appointments",rec,"موعد");
    logAudit("حذف موعد",(rec&&(rec.date+" "+(rec.time||"")+" · "+(rec.patient||"")))||id);
    return mutateApts(list=>list.filter(x=>x.id!==id),list=>!list.some(x=>x.id===id),"تم الحذف");
  };
  const updateApt=apt=>mutateApts(list=>list.some(a=>a.id===apt.id)?list.map(a=>a.id===apt.id?{...a,...apt}:a):[...list,apt]);

  // Push a payment collection into the shared visits store so it reflects in the doctor app's accounting
  const pushVisitRecord=async(apt,cost,paid)=>{
    const vid="apt-"+apt.id;
    const rec={id:vid,patientId:apt.patientId||null,patient:apt.patient,date:apt.date,type:apt.type||"فحص روتيني",doctor:apt.doctor||"",clinic:apt.clinic||"",complaint:"",result:"",cost:String(cost||0),paid:!!paid,nextVisit:"",notes:"تحصيل من السكرتارية · "+clinicLabel(apt.clinic)};
    await sbMutate("iapp_visits",visits=>visits.some(v=>v.id===vid)?visits.map(v=>v.id===vid?rec:v):[...visits,rec],list=>list.some(v=>v.id===vid));
  };
  const handleSaveCollect=async(cost,paid)=>{
    const apt=collectApt;
    await updateApt({...apt,cost,paid});
    await pushVisitRecord(apt,cost,paid);
    setCollectApt(null);
    logAudit(paid?"تحصيل مبلغ":"تسجيل قيمة كشف",(apt.patient||"")+" · "+cost+" ج.م");
    setToast(paid?"✓ تم تحصيل "+cost+" ج.م":"تم حفظ قيمة الكشف");
  };

  const pendingFromPatient=apts.filter(a=>a.fromPatient&&!a.confirmed).length;
  const waitingCount=apts.filter(a=>a.date===today&&a.waitStatus==="waiting").length;

  const filtered=apts.filter(a=>{
    const dateOk=filterDate?a.date===filterDate:true;
    const searchOk=search?a.patient?.includes(search):true;
    const fromOk=filterFromPatient?a.fromPatient:true;
    const clinicOk=filterClinic?a.clinic===filterClinic:true;
    return dateOk&&searchOk&&fromOk&&clinicOk;
  }).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||""));

  const handleLogin=(u,remember)=>{const s={id:u.id,username:u.username,name:u.name,role:u.role};if(remember){try{localStorage.setItem("iapp_session",JSON.stringify(s));}catch{}}else{try{sessionStorage.setItem("iapp_session",JSON.stringify(s));}catch{}}setSession(s);};
  const handleLogout=()=>{try{localStorage.removeItem("iapp_session");}catch{}try{sessionStorage.removeItem("iapp_session");}catch{}setSession(null);try{if(window.__iappUnifiedLogout)window.__iappUnifiedLogout();}catch{}};
  if(!session)return <LoginScreen onLogin={handleLogin}/>;

  const Btn=({children,onClick,color,active})=>(
    <button onClick={onClick} style={{background:active?`linear-gradient(135deg,${color||C.accent},${C.teal})`:(color?color+"22":"transparent"),border:"1px solid "+(active?"transparent":(color||C.border)),borderRadius:8,padding:"6px 12px",color:active?C.bg:(color||C.muted),fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>{children}</button>
  );

  return(
    <div style={{height:"100%",background:C.bg,direction:"rtl",display:"flex",flexDirection:"column"}}>
      {/* Header */}
      <div style={{background:`linear-gradient(135deg,${C.surface},#0D1929)`,borderBottom:"1px solid "+C.border,padding:"0 16px",display:"flex",alignItems:"center",justifyContent:"space-between",height:60,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:34,height:34,borderRadius:10,background:`linear-gradient(135deg,${C.accent},${C.teal})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>👁</div>
          <div>
            <div style={{color:C.text,fontWeight:700,fontSize:14}}>I App <span style={{color:C.muted,fontWeight:400,fontSize:11}}>· السكرتارية</span></div>
            <div style={{color:C.muted,fontSize:9,display:"flex",alignItems:"center",gap:3}}>
              <span style={{width:5,height:5,borderRadius:"50%",background:syncing?C.gold:C.success,display:"inline-block"}}/>
              {syncing?"جاري المزامنة...":session.name}
            </div>
          </div>
          {pendingFromPatient>0&&<span style={{background:C.gold,color:C.bg,borderRadius:"50%",width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800}}>{pendingFromPatient}</span>}
          {waitingCount>0&&<span style={{background:C.accent+"22",color:C.accent,borderRadius:8,padding:"2px 8px",fontSize:10,fontWeight:700}}>⏳{waitingCount}</span>}
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setModal("add")} style={{background:`linear-gradient(135deg,${C.accent},${C.teal})`,border:"none",borderRadius:10,padding:"8px 12px",color:C.bg,fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>+ جديد</button>
          <button onClick={loadData} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:10,padding:"8px 10px",color:C.muted,fontSize:14,cursor:"pointer"}}>🔄</button>
          <button onClick={handleLogout} title="تسجيل الخروج" style={{background:"transparent",border:"1px solid "+C.border,borderRadius:10,padding:"8px 10px",color:C.danger,fontSize:14,cursor:"pointer"}}>⏻</button>
        </div>
      </div>

      {/* Tabs */}
      <div style={{background:C.surface,borderBottom:"1px solid "+C.border,display:"flex",flexShrink:0}}>
        {[{id:"apts",icon:"📋",label:"المواعيد"},{id:"waiting",icon:"⏳",label:"الانتظار"},{id:"stats",icon:"📊",label:"إحصائيات"}].map(t=>(
          <div key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,textAlign:"center",padding:"9px 4px",cursor:"pointer",borderBottom:tab===t.id?"2px solid "+C.accent:"2px solid transparent",color:tab===t.id?C.accent:C.muted,fontSize:10,fontWeight:tab===t.id?700:400,transition:"all 0.2s"}}>
            <div style={{fontSize:15}}>{t.icon}</div>{t.label}
          </div>
        ))}
      </div>

      {/* APPOINTMENTS TAB */}
      {tab==="apts"&&<>
        <div style={{padding:"8px 16px",background:C.surface,borderBottom:"1px solid "+C.border,flexShrink:0,display:"flex",gap:6,overflowX:"auto"}}>
          <Btn active={filterDate===today&&!filterFromPatient&&!filterClinic} onClick={()=>{setFilterDate(today);setFilterFromPatient(false);setFilterClinic("");}}>📅 اليوم</Btn>
          <Btn active={!filterDate&&!filterFromPatient&&!filterClinic} onClick={()=>{setFilterDate("");setFilterFromPatient(false);setFilterClinic("");}}>📋 الكل</Btn>
          <Btn active={filterFromPatient} color={C.gold} onClick={()=>{setFilterFromPatient(f=>!f);setFilterDate("");}}>⭐ طلبات{pendingFromPatient>0?" ("+pendingFromPatient+")":""}</Btn>
          <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)} style={{...inp(),fontSize:11,padding:"6px 10px",minWidth:130,flex:"0 0 auto"}}/>
        </div>
        <div style={{padding:"6px 16px",background:C.surface,borderBottom:"1px solid "+C.border,flexShrink:0,display:"flex",gap:6,overflowX:"auto"}}>
          {["الكل",...CLINICS_LIST].map(c=>(
            <button key={c} onClick={()=>setFilterClinic(c==="الكل"?"":c)}
              style={{background:((!filterClinic&&c==="الكل")||(filterClinic===c))?C.teal+"33":"transparent",border:"1px solid "+((!filterClinic&&c==="الكل")||(filterClinic===c))?C.teal:C.border,borderRadius:8,padding:"5px 10px",color:((!filterClinic&&c==="الكل")||(filterClinic===c))?C.teal:C.muted,fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
              {c==="الكل"?"🏥 الكل":"📍 "+clinicLabel(c)}
            </button>
          ))}
        </div>
        <div style={{padding:"6px 16px",background:C.surface,borderBottom:"1px solid "+C.border,flexShrink:0}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 بحث بالاسم..." style={{...inp(),fontSize:12,padding:"8px 12px"}}/>
        </div>
        <div style={{padding:"8px 16px",display:"flex",gap:8,flexShrink:0}}>
          {[{l:"اليوم",v:apts.filter(a=>a.date===today).length,c:C.accent},{l:"معروض",v:filtered.length,c:C.teal},{l:"مؤكد",v:filtered.filter(a=>a.confirmed).length,c:C.success},{l:"طلبات",v:pendingFromPatient,c:C.gold}].map((s,i)=>(
            <div key={i} style={{flex:1,background:C.card,borderRadius:10,padding:"8px 4px",textAlign:"center",border:"1px solid "+C.border}}>
              <div style={{color:s.c,fontSize:17,fontWeight:800}}>{s.v}</div>
              <div style={{color:C.muted,fontSize:9}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"0 16px 20px"}}>
          {loading&&<div style={{color:C.muted,textAlign:"center",padding:40}}>⏳ جاري التحميل...</div>}
          {!loading&&filtered.length===0&&<div style={{color:C.muted,textAlign:"center",padding:40,fontSize:13}}>لا توجد مواعيد</div>}
          {filtered.map(a=>(
            <div key={a.id} style={{background:C.card,border:"1px solid "+(a.fromPatient?C.gold:a.confirmed?C.success:C.border),borderRadius:14,padding:"12px 14px",marginBottom:10,borderRight:"4px solid "+(a.confirmed?C.success:a.fromPatient?C.gold:C.accent),animation:"slideUp 0.2s ease"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap",marginBottom:3}}>
                    <span style={{color:C.text,fontWeight:700,fontSize:14}}>{a.patient}</span>
                    {a.fromPatient&&<span style={{background:C.gold+"22",color:C.gold,borderRadius:6,padding:"1px 6px",fontSize:9,fontWeight:700}}>⭐ طلب</span>}
                    {a.waitStatus==="waiting"&&<span style={{background:C.gold+"22",color:C.gold,borderRadius:6,padding:"1px 6px",fontSize:9,fontWeight:700}}>⏳ ينتظر</span>}
                    {a.waitStatus==="in"&&<span style={{background:C.accent+"22",color:C.accent,borderRadius:6,padding:"1px 6px",fontSize:9,fontWeight:700}}>🩺 في العيادة</span>}
                    {a.waitStatus==="done"&&<span style={{background:C.success+"22",color:C.success,borderRadius:6,padding:"1px 6px",fontSize:9,fontWeight:700}}>✓ انتهى</span>}
                    {a.waitStatus==="postponed"&&<span style={{background:C.purple+"22",color:C.purple,borderRadius:6,padding:"1px 6px",fontSize:9,fontWeight:700}}>⏸ مؤجل</span>}
                  </div>
                  <div style={{color:C.muted,fontSize:11}}>{a.type} · {a.doctor}</div>
                  <div style={{display:"flex",gap:10,marginTop:2,flexWrap:"wrap"}}>
                    {a.phone&&<a href={"tel:"+a.phone} style={{color:C.accent,fontSize:11,textDecoration:"none"}}>📞 {a.phone}</a>}
                    {a.clinic&&<span style={{color:C.teal,fontSize:11}}>📍 {clinicLabel(a.clinic)}</span>}
                    {a.date!==today&&<span style={{color:C.gold,fontSize:10}}>📅 {a.date}</span>}
                  </div>
                </div>
                <div style={{background:C.accent+"22",borderRadius:8,padding:"4px 10px",textAlign:"center",flexShrink:0,marginRight:8}}>
                  <div style={{color:C.accent,fontSize:14,fontWeight:800}}>{a.time}</div>
                  <div onClick={()=>setCollectApt(a)} style={{color:a.cost?(a.paid?C.success:C.danger):C.muted,fontSize:9,cursor:"pointer",fontWeight:700,marginTop:2}}>{a.cost?(a.paid?"✓ "+a.cost+"ج":"غير مدفوع"):"💰 تحصيل"}</div>
                </div>
              </div>
              {a.notes&&<div style={{color:C.muted,fontSize:11,marginBottom:8}}>📝 {a.notes}</div>}
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                <div onClick={()=>updateApt({...a,confirmed:!a.confirmed})}
                  style={{flex:"1 1 60px",background:a.confirmed?C.success+"33":"transparent",border:"1px solid "+(a.confirmed?C.success:C.border),borderRadius:8,padding:"7px 0",color:a.confirmed?C.success:C.muted,fontSize:11,fontWeight:700,cursor:"pointer",textAlign:"center"}}>
                  {a.confirmed?"✓ مؤكد":"تأكيد"}
                </div>
                {a.date===today && !["waiting","called","in","done"].includes(a.waitStatus) && <div onClick={()=>updateApt({...a,waitStatus:"waiting",arrivedAt:Date.now()})}
                  style={{flex:"1 1 70px",background:C.gold+"22",border:"1px solid "+C.gold+"44",borderRadius:8,padding:"7px 0",color:C.gold,fontSize:11,fontWeight:700,cursor:"pointer",textAlign:"center"}}>
                  وصل ✓
                </div>}
                {a.phone&&<a href={"https://wa.me/2"+a.phone.replace(/^0/,"")+"?text="+encodeURIComponent("تذكير بموعدك في "+clinicLabel(a.clinic)+" يوم "+a.date+" الساعة "+a.time)} target="_blank"
                  style={{background:"#25D36622",border:"1px solid #25D36633",borderRadius:8,padding:"7px 12px",color:"#25D366",fontSize:14,textDecoration:"none",display:"flex",alignItems:"center",justifyContent:"center"}}>💬</a>}
                {a.phone&&<a href={"tel:"+a.phone}
                  style={{background:C.teal+"22",border:"1px solid "+C.teal+"33",borderRadius:8,padding:"7px 12px",color:C.teal,fontSize:14,textDecoration:"none",display:"flex",alignItems:"center",justifyContent:"center"}}>📞</a>}
                <div onClick={()=>setModal({edit:a})} style={{background:C.accent+"22",border:"1px solid "+C.accent+"33",borderRadius:8,padding:"7px 12px",color:C.accent,fontSize:14,cursor:"pointer"}}>✏️</div>
                {session.role==="admin"&&<div onClick={()=>{if(window.confirm("حذف موعد "+a.patient+"؟"))deleteApt(a.id);}}
                  style={{background:C.danger+"22",border:"1px solid "+C.danger+"33",borderRadius:8,padding:"7px 12px",color:C.danger,fontSize:14,cursor:"pointer"}}>🗑️</div>}
              </div>
            </div>
          ))}
        </div>
      </>}

      {/* WAITING ROOM TAB */}
      {tab==="waiting"&&<div style={{flex:1,overflowY:"auto"}}><WaitingRoom apts={apts} today={today} onUpdateApt={updateApt} onCollect={setCollectApt} doctorNames={[...new Set(apts.filter(a=>a.date===today&&a.doctor).map(a=>a.doctor))]}/></div>}

      {/* STATS TAB */}
      {tab==="stats"&&<div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
        <div style={{color:C.text,fontWeight:700,fontSize:16,marginBottom:16}}>📊 إحصائيات</div>
        <div style={{background:`linear-gradient(135deg,${C.success}22,${C.card})`,border:"1px solid "+C.success+"44",borderRadius:14,padding:14,marginBottom:16,textAlign:"center"}}>
          <div style={{color:C.muted,fontSize:11,marginBottom:4}}>💰 المحصّل اليوم</div>
          <div style={{color:C.success,fontWeight:800,fontSize:24}}>{apts.filter(a=>a.date===today&&a.paid).reduce((s,a)=>s+Number(a.cost||0),0).toLocaleString()} ج.م</div>
          <div style={{color:C.muted,fontSize:10,marginTop:2}}>غير محصّل: {apts.filter(a=>a.date===today&&!a.paid&&a.cost).length} حالة</div>
        </div>
        <div style={{color:C.muted,fontSize:11,fontWeight:700,marginBottom:10}}>حسب العيادة</div>
        {CLINICS_LIST.map(c=>{
          const cnt=apts.filter(a=>a.clinic===c).length;
          const todayCnt=apts.filter(a=>a.clinic===c&&a.date===today).length;
          if(!cnt&&!todayCnt)return null;
          return(
            <div key={c} style={{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:"12px 14px",marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{color:C.text,fontWeight:700,fontSize:13}}>📍 {clinicLabel(c)}</span>
                <div style={{display:"flex",gap:10}}>
                  <span style={{color:C.teal,fontWeight:700,fontSize:13}}>{todayCnt} اليوم</span>
                  <span style={{color:C.muted,fontSize:12}}>{cnt} إجمالي</span>
                </div>
              </div>
              <div style={{background:C.bg,borderRadius:6,height:6,overflow:"hidden"}}>
                <div style={{width:(cnt/Math.max(apts.length,1)*100)+"%",height:"100%",background:`linear-gradient(90deg,${C.accent},${C.teal})`,borderRadius:6}}/>
              </div>
            </div>
          );
        })}
        <div style={{color:C.muted,fontSize:11,fontWeight:700,marginBottom:10,marginTop:16}}>حسب نوع الموعد</div>
        {["فحص روتيني","متابعة","استشارة","قياس نظر","فحص شبكية","عملية"].map(t=>{
          const cnt=apts.filter(a=>a.type===t).length;
          if(!cnt)return null;
          return <div key={t} style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"10px 14px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{color:C.text,fontSize:13}}>{t}</span>
            <span style={{color:C.teal,fontWeight:700,fontSize:15}}>{cnt}</span>
          </div>;
        })}
        <div style={{background:C.gold+"11",border:"1px solid "+C.gold+"33",borderRadius:14,padding:14,marginTop:16}}>
          <div style={{color:C.gold,fontWeight:700,fontSize:13,marginBottom:4}}>⭐ طلبات المرضى المعلقة</div>
          <div style={{color:C.text,fontSize:28,fontWeight:800}}>{pendingFromPatient}</div>
          <div style={{color:C.muted,fontSize:11}}>بحاجة للتأكيد</div>
        </div>
      </div>}

      {modal==="add"&&<Modal title="موعد جديد" onClose={()=>setModal(null)}><SecretaryAptForm patients={patients} appointments={apts} prices={prices} onSave={async f=>{if(await addApt(f))setModal(null);}} onClose={()=>setModal(null)}/></Modal>}
      {modal?.edit&&<Modal title="تعديل الموعد" onClose={()=>setModal(null)}><SecretaryAptForm patients={patients} appointments={apts} prices={prices} initial={modal.edit} onSave={async f=>{if(await editApt(f))setModal(null);}} onClose={()=>setModal(null)}/></Modal>}
      {collectApt&&<Modal title="💰 تحصيل مبلغ الكشف" onClose={()=>setCollectApt(null)}><CollectModal apt={collectApt} prices={prices} onSave={handleSaveCollect} onClose={()=>setCollectApt(null)}/></Modal>}
      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}


// ── Unified authentication / routing ───────────────────────────
function UnifiedLogin({onLogin}){
  const [mode,setMode]=useState("staff");
  const [username,setUsername]=useState("");
  const [password,setPassword]=useState("");
  const [code,setCode]=useState("");
  const [name,setName]=useState("");
  const [remember,setRemember]=useState(true);
  const [showPass,setShowPass]=useState(false);
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);

  const choose=m=>{setMode(m);setError("");};

  const submit=async e=>{
    if(e&&e.preventDefault)e.preventDefault();
    setError("");
    if(loading)return;
    if(mode==="staff"){
      if(!username.trim()||!password){setError("❌ أدخل اسم المستخدم وكلمة المرور");return;}
      setLoading(true);
      const r=await authenticateStaff(username,password);
      setLoading(false);
      if(!r.user){setError(r.error);return;}
      setPassword("");
      onLogin({kind:"staff",user:r.user},remember);
    }else if(mode==="patient"){
      if(!code.trim()||!name.trim()){setError("❌ أدخل رقم الملف والاسم الكامل");return;}
      const pkey="patient:"+code.trim().toUpperCase();
      const wait=lockRemaining(pkey);
      if(wait){setError("⏳ محاولات خاطئة كثيرة — حاول بعد "+fmtWait(wait));return;}
      setLoading(true);
      const patients=await sbGet("iapp_patients");
      setLoading(false);
      if(!Array.isArray(patients)){setError("❌ تعذر الاتصال بقاعدة البيانات");return;}
      const codeKey=code.trim().toUpperCase().replace(/^P-?/,"").replace(/^0+/,"");
      const p=patients.find(x=>String(x.patientCode||"").toUpperCase().replace(/^P-?/,"").replace(/^0+/,"")===codeKey&&normArabic(x.name)===normArabic(name));
      if(!p){const w=registerLoginFail(pkey);setError(w?"⏳ تم إيقاف الدخول مؤقتاً — حاول بعد "+fmtWait(w):"❌ رقم الملف أو الاسم غير صحيح");return;}
      clearLoginFails(pkey);
      // Keep only what the portal needs in the stored session (no medical history on disk).
      onLogin({kind:"patient",patient:{id:p.id,name:p.name,patientCode:p.patientCode,phone:p.phone||""}},remember);
    }else{
      onLogin({kind:"patient",patient:{id:null,name:"زائر",patientCode:null,isGuest:true}},remember);
    }
  };

  return (
    <div style={{minHeight:"100vh",background:"#060d1a",display:"flex",alignItems:"center",justifyContent:"center",direction:"rtl",fontFamily:"'Segoe UI','Tahoma',Arial,sans-serif",padding:"24px 20px",overflowY:"auto"}}>
      <div style={{width:"100%",maxWidth:430}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{width:82,height:82,borderRadius:24,background:`linear-gradient(135deg,${C.accent},${C.teal})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:38,margin:"0 auto 14px",boxShadow:`0 0 28px ${C.accent}55`}}>👁</div>
          <div style={{color:C.accent,fontWeight:900,fontSize:28,letterSpacing:1}}>I App</div>
          <div style={{color:C.text,fontSize:14,fontWeight:600,marginTop:4}}>نظام إدارة عيادة العيون</div>
          <div style={{color:C.muted,fontSize:11,marginTop:5}}>تسجيل دخول موحّد — د. عبدالستار صقر</div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
          <button onClick={()=>choose("staff")} style={{background:mode==="staff"?C.accent+"22":C.card,border:"1px solid "+(mode==="staff"?C.accent:C.border),borderRadius:12,padding:"11px 8px",color:mode==="staff"?C.accent:C.muted,fontWeight:800,fontFamily:"inherit",cursor:"pointer"}}>👨‍⚕️ الفريق</button>
          <button onClick={()=>choose("patient")} style={{background:mode!=="staff"?C.teal+"22":C.card,border:"1px solid "+(mode!=="staff"?C.teal:C.border),borderRadius:12,padding:"11px 8px",color:mode!=="staff"?C.teal:C.muted,fontWeight:800,fontFamily:"inherit",cursor:"pointer"}}>👤 المريض</button>
        </div>

        <div style={{background:"linear-gradient(135deg,#141E30,#101a2a)",border:"1px solid "+C.border,borderRadius:20,padding:"20px 18px",boxShadow:"0 20px 60px #0008"}}>
          {mode==="staff" ? (
            <form onSubmit={submit} style={{display:"flex",flexDirection:"column",gap:12}}>
              <div style={{color:C.text,fontWeight:800,fontSize:15,marginBottom:2}}>دخول الطبيب / السكرتارية</div>
              <Field label="اسم المستخدم"><input autoFocus style={{...inp(),background:"#0a1220"}} value={username} onChange={e=>{setUsername(e.target.value);setError("");}} placeholder="username"/></Field>
              <Field label="كلمة المرور">
                <div style={{position:"relative"}}>
                  <input style={{...inp(),background:"#0a1220",paddingLeft:40,direction:"ltr",textAlign:"center"}} type={showPass?"text":"password"} value={password} onChange={e=>{setPassword(e.target.value);setError("");}} placeholder="••••••••"/>
                  <span onClick={()=>setShowPass(v=>!v)} style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",cursor:"pointer",color:C.muted}}>{showPass?"🙈":"👁"}</span>
                </div>
              </Field>
              <div onClick={()=>setRemember(v=>!v)} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
                <div style={{width:18,height:18,borderRadius:5,background:remember?C.accent:C.bg,border:"2px solid "+(remember?C.accent:C.border),display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:C.bg,fontWeight:700}}>{remember?"✓":""}</div>
                <span style={{color:C.muted,fontSize:12}}>تذكرني على هذا الجهاز</span>
              </div>
              {error&&<div style={{background:C.danger+"22",border:"1px solid "+C.danger+"44",borderRadius:10,padding:"9px 12px",color:C.danger,fontSize:12,textAlign:"center"}}>{error}</div>}
              <button type="submit" disabled={loading} style={{background:`linear-gradient(135deg,${C.accent},${C.teal})`,border:"none",borderRadius:11,padding:13,color:C.bg,fontWeight:800,fontSize:14,cursor:"pointer",fontFamily:"inherit",opacity:loading?.7:1}}>{loading?"⏳ جاري التحقق...":"تسجيل الدخول ←"}</button>
            </form>
          ) : (
            <form onSubmit={submit} style={{display:"flex",flexDirection:"column",gap:12}}>
              <div style={{color:C.text,fontWeight:800,fontSize:15,marginBottom:2}}>دخول المريض</div>
              <Field label="رقم الملف"><input autoFocus style={{...inp(),background:"#0a1220",direction:"ltr",textAlign:"center"}} value={code} onChange={e=>{setCode(e.target.value);setError("");}} placeholder="P-0001"/></Field>
              <Field label="الاسم الكامل"><input style={{...inp(),background:"#0a1220"}} value={name} onChange={e=>{setName(e.target.value);setError("");}} placeholder="كما هو مسجل في الملف"/></Field>
              {error&&<div style={{background:C.danger+"22",border:"1px solid "+C.danger+"44",borderRadius:10,padding:"9px 12px",color:C.danger,fontSize:12,textAlign:"center"}}>{error}</div>}
              <button type="submit" disabled={loading} style={{background:`linear-gradient(135deg,${C.teal},${C.accent})`,border:"none",borderRadius:11,padding:13,color:C.bg,fontWeight:800,fontSize:14,cursor:"pointer",fontFamily:"inherit",opacity:loading?.7:1}}>{loading?"⏳ جاري التحقق...":"دخول المريض ←"}</button>
              <button type="button" onClick={()=>{setMode("guest");setError("");}} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:11,padding:11,color:C.muted,fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>🆕 مريض جديد — حجز بدون حساب</button>
            </form>
          )}
          {mode==="guest"&&(
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div style={{color:C.text,fontWeight:800,fontSize:15}}>مريض جديد</div>
              <div style={{color:C.muted,fontSize:12,lineHeight:1.7}}>يمكنك حجز موعد دون تسجيل ملف مسبق. ستُطلب بياناتك أثناء الحجز.</div>
              <button onClick={submit} disabled={loading} style={{background:`linear-gradient(135deg,${C.teal},${C.accent})`,border:"none",borderRadius:11,padding:13,color:C.bg,fontWeight:800,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>متابعة للحجز ←</button>
              <button onClick={()=>choose("patient")} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:11,padding:11,color:C.muted,fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>رجوع لدخول المريض</button>
            </div>
          )}
        </div>
        <div style={{textAlign:"center",color:"#40536b",fontSize:10,marginTop:14}}>صلاحيات كل مستخدم تحدد الواجهة المتاحة له</div>
      </div>
    </div>
  );
}

const SESSION_TTL_REMEMBER=30*24*3600*1000;   // "تذكرني": 30 days
const SESSION_TTL_TEMP=12*3600*1000;            // otherwise: 12 hours (and closes with the tab)
const STAFF_ROLES=["admin","doctor","secretary","employee"];

function clearAllSessions(){
  ["iapp_unified_session","iapp_session"].forEach(k=>{
    try{localStorage.removeItem(k);}catch{}
    try{sessionStorage.removeItem(k);}catch{}
  });
}
// Reads the session and re-validates it against the current user list,
// so a deleted user or a changed role takes effect immediately.
function loadValidSession(){
  let s=null,store=null;
  try{
    const l=localStorage.getItem("iapp_unified_session");
    const t=sessionStorage.getItem("iapp_unified_session");
    if(l){s=JSON.parse(l);store=localStorage;}else if(t){s=JSON.parse(t);store=sessionStorage;}
  }catch{s=null;}
  if(!s)return null;
  if(!s.exp||Date.now()>s.exp){clearAllSessions();return null;}
  if(s.kind==="staff"){
    const u=getUsers().find(x=>x.id===s.id);
    if(!u||!STAFF_ROLES.includes(u.role)){clearAllSessions();return null;}
    const fresh={...s,...publicUser(u),kind:"staff"};
    if(fresh.role!==s.role||fresh.name!==s.name||fresh.username!==s.username||fresh.mustChange!==s.mustChange){
      try{
        store.setItem("iapp_unified_session",JSON.stringify(fresh));
        store.setItem("iapp_session",JSON.stringify({id:fresh.id,username:fresh.username,name:fresh.name,role:fresh.role}));
      }catch{}
    }
    return fresh;
  }
  if(s.kind==="patient"&&s.patient)return s;
  clearAllSessions();return null;
}

function ForcePasswordChange({user,onDone,onLogout}){
  const [p1,setP1]=useState("");const [p2,setP2]=useState("");
  const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  const save=async e=>{
    if(e&&e.preventDefault)e.preventDefault();
    if(busy)return;
    if(p1.length<MIN_PW_LEN){setErr("❌ كلمة المرور يجب ألا تقل عن "+MIN_PW_LEN+" أحرف");return;}
    if(p1===DEFAULT_ADMIN_PW||p1.toLowerCase()===String(user.username).toLowerCase()){setErr("❌ اختر كلمة مرور غير الافتراضية وغير اسم المستخدم");return;}
    if(p1!==p2){setErr("❌ كلمتا المرور غير متطابقتين");return;}
    setBusy(true);
    const pw=await hashPassword(p1);
    saveUsers(getUsers().map(u=>{if(u.id!==user.id)return u;const {password:_x,...r}=u;return {...r,pw,mustChange:false};}));
    setBusy(false);onDone();
  };
  return (
    <div style={{minHeight:"100vh",background:"#060d1a",display:"flex",alignItems:"center",justifyContent:"center",direction:"rtl",fontFamily:"'Segoe UI','Tahoma',Arial,sans-serif",padding:"24px 20px"}}>
      <form onSubmit={save} style={{width:"100%",maxWidth:380,background:C.card,border:"1px solid "+C.border,borderRadius:20,padding:"22px 18px",display:"flex",flexDirection:"column",gap:12}}>
        <div style={{color:C.gold,fontWeight:800,fontSize:16}}>🔒 تغيير كلمة المرور مطلوب</div>
        <div style={{color:C.muted,fontSize:12,lineHeight:1.8}}>مرحباً {user.name}. الحساب يستخدم كلمة مرور افتراضية أو ضعيفة. اختر كلمة مرور جديدة قبل المتابعة لحماية بيانات المرضى.</div>
        <Field label={"كلمة المرور الجديدة ("+MIN_PW_LEN+" أحرف على الأقل)"}><input autoFocus type="password" style={{...inp(),direction:"ltr",textAlign:"center"}} value={p1} onChange={e=>{setP1(e.target.value);setErr("");}}/></Field>
        <Field label="تأكيد كلمة المرور"><input type="password" style={{...inp(),direction:"ltr",textAlign:"center"}} value={p2} onChange={e=>{setP2(e.target.value);setErr("");}}/></Field>
        {err&&<div style={{background:C.danger+"22",border:"1px solid "+C.danger+"44",borderRadius:10,padding:"9px 12px",color:C.danger,fontSize:12,textAlign:"center"}}>{err}</div>}
        <button type="submit" disabled={busy} style={{background:`linear-gradient(135deg,${C.accent},${C.teal})`,border:"none",borderRadius:11,padding:13,color:C.bg,fontWeight:800,fontSize:14,cursor:"pointer",fontFamily:"inherit",opacity:busy?.7:1}}>{busy?"⏳ جاري الحفظ...":"حفظ والمتابعة"}</button>
        <button type="button" onClick={onLogout} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:11,padding:10,color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>تسجيل الخروج</button>
      </form>
    </div>
  );
}

function UnifiedRouter(){
  const [ready,setReady]=useState(false);
  const [session,setSession]=useState(null);

  // Hash any legacy plaintext passwords before any screen can read the user list.
  useEffect(()=>{
    Promise.race([pullUsers(),new Promise(r=>setTimeout(()=>r(false),6000))]).catch(()=>{})
      .then(()=>migrateUsers()).then(()=>{ if(_usersSynced) pushUsers(getUsers()); })
      .catch(e=>console.warn("user migration failed",e)).finally(()=>{
      setSession(loadValidSession());setReady(true);
    });
  },[]);

  const logout=useCallback(()=>{clearAllSessions();setSession(null);},[]);
  useEffect(()=>{window.__iappUnifiedLogout=logout;return()=>{try{delete window.__iappUnifiedLogout}catch{}}},[logout]);

  // One automatic daily backup, taken by the first staff device that opens the app.
  useEffect(()=>{
    if(!ready||!session||session.kind!=="staff")return;
    const t=setTimeout(()=>{maybeDailyBackup();},4000);
    return()=>clearTimeout(t);
  },[ready,session&&session.id]);

  // Re-check every minute and whenever the app returns to the foreground
  // (expiry, deleted account, role change, logout from another tab).
  useEffect(()=>{
    if(!ready)return undefined;
    const check=()=>setSession(prev=>{
      const next=loadValidSession();
      if(!next)return null;
      return JSON.stringify(next)===JSON.stringify(prev)?prev:next;
    });
    const iv=setInterval(check,60000);
    const onVis=()=>{if(document.visibilityState==="visible")check();};
    document.addEventListener("visibilitychange",onVis);
    window.addEventListener("storage",check);
    return()=>{clearInterval(iv);document.removeEventListener("visibilitychange",onVis);window.removeEventListener("storage",check);};
  },[ready]);

  const login=(payload,remember)=>{
    if(payload.kind==="staff"){CURRENT_USER=publicUser(payload.user);logAudit("تسجيل دخول",payload.user.username||"");}
    const store=remember?localStorage:sessionStorage;
    const exp=Date.now()+(remember?SESSION_TTL_REMEMBER:SESSION_TTL_TEMP);
    clearAllSessions();
    let s;
    if(payload.kind==="staff"){
      const u=publicUser(payload.user);
      s={kind:"staff",...u,exp};
      try{store.setItem("iapp_session",JSON.stringify({id:u.id,username:u.username,name:u.name,role:u.role}));}catch{}
    }else{
      s={kind:"patient",patient:payload.patient,exp};
    }
    try{store.setItem("iapp_unified_session",JSON.stringify(s));}catch{}
    setSession(s);
  };

  const invalidRole=!!session&&session.kind==="staff"&&!STAFF_ROLES.includes(session.role);
  // Side effects never run during render.
  useEffect(()=>{if(invalidRole)logout();},[invalidRole,logout]);

  if(!ready)return <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontFamily:"'Segoe UI','Tahoma',Arial,sans-serif"}}>⏳</div>;
  if(!session)return <UnifiedLogin onLogin={login}/>;
  CURRENT_USER=session.kind==="staff"?session:null;
  if(session.kind==="patient")return <PatientApp patient={session.patient} onLogout={logout}/>;
  if(invalidRole)return null;
  if(session.mustChange)return <ForcePasswordChange user={session} onLogout={logout} onDone={()=>setSession(loadValidSession())}/>;
  // Explicit staff-role routing: unknown roles never get the doctor/admin UI.
  if(session.role==="secretary"||session.role==="employee")return <SecretaryApp key={"sec-"+session.id+"-"+session.role}/>;
  return <App key={"doc-"+session.id+"-"+session.role}/>;
}

// ── Unified root ─────────────────────────────────────────────────
class UnifiedErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(e){return {error:e};}
  componentDidCatch(e,info){console.error("I App render error:",e,info);}
  render(){
    if(this.state.error)return <div style={{position:"fixed",inset:0,background:C.bg,color:C.danger,fontFamily:"monospace",fontSize:12,padding:24,overflow:"auto",direction:"ltr",whiteSpace:"pre-wrap"}}>⚠ I App — Render Error:\n\n{this.state.error.message}\n\n{this.state.error.stack||""}</div>;
    return this.props.children;
  }
}


const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<UnifiedErrorBoundary><UnifiedRouter/></UnifiedErrorBoundary>);
</script>
