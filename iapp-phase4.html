*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0A0F1E;overflow:hidden}
#root{height:100%}
input,select,textarea,button{font-family:'Segoe UI',Tahoma,Arial,sans-serif}
::-webkit-scrollbar{display:none}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px #00C2FF44,0 0 40px #00C2FF22}50%{box-shadow:0 0 30px #00C2FF88,0 0 60px #00C2FF44}}
@keyframes orb{0%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-15px) scale(1.05)}66%{transform:translate(-10px,10px) scale(.95)}100%{transform:translate(0,0) scale(1)}}

// Local calendar date (YYYY-MM-DD). toISOString() is UTC, which in Egypt
// returns *yesterday* between midnight and 02:00/03:00 local time.
function localISO(d){
  d=d||new Date();
  const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return z.toISOString().slice(0,10);
}

// HTML escaping for every print template (patient names/notes are user input).
function escHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escDeep(v,depth){
  depth=depth||0;
  if(typeof v==="string")return escHTML(v);
  if(v===null||typeof v!=="object"||depth>8)return v;
  if(Array.isArray(v))return v.map(x=>escDeep(x,depth+1));
  const o={};for(const k in v){if(Object.prototype.hasOwnProperty.call(v,k))o[k]=escDeep(v[k],depth+1);}
  return o;
}
// Wraps an HTML-template builder so all of its data arguments are escaped first.
const safeTemplate=fn=>(...args)=>fn(...args.map(a=>escDeep(a)));

// Arabic-aware normalisation for name matching (أ/إ/آ→ا، ى→ي، ة→ه، spaces).
function normArabic(s){
  return String(s||"").trim()
    .replace(/[ً-ْـ]/g,"")
    .replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
    .replace(/\s+/g," ").toLowerCase();
}
const normPhone=s=>String(s||"").replace(/\D/g,"").replace(/^(20|0020)/,"0");

const GUARD_KEY="iapp_login_guard";
// Per-account lockout: one person mistyping never locks the other users out.
// 6 wrong tries → 30s, then doubles up to 5 minutes. A correct login clears it.
function _guards(){try{const g=JSON.parse(localStorage.getItem(GUARD_KEY));return g&&typeof g==="object"&&!("fails" in g)?g:{};}catch{return{};}}
function _gkey(k){return String(k||"_").trim().toLowerCase();}
function lockRemaining(k){const g=_guards()[_gkey(k)];return g?Math.max(0,Math.ceil((g.until-Date.now())/1000)):0;}
function registerLoginFail(k){
  const all=_guards(),key=_gkey(k),g=all[key]||{fails:0,until:0};
  g.fails++; if(g.fails>=6) g.until=Date.now()+Math.min(300,30*Math.pow(2,g.fails-6))*1000;
  all[key]=g; try{localStorage.setItem(GUARD_KEY,JSON.stringify(all));}catch{}
  return lockRemaining(k);
}
function clearLoginFails(k){const all=_guards();delete all[_gkey(k)];try{localStorage.setItem(GUARD_KEY,JSON.stringify(all));}catch{}}
const fmtWait=s=>s>=60?Math.ceil(s/60)+" دقيقة":s+" ثانية";

// Single staff-authentication path used by every login screen.
async function authenticateStaff(username,password){
  const uname=String(username||"").trim().toLowerCase();
  const wait=lockRemaining(uname);
  if(wait)return {error:"⏳ محاولات خاطئة كثيرة لهذا الحساب — حاول مرة أخرى بعد "+fmtWait(wait)};
  // Always check against the latest accounts (a password may have been changed on another device).
  await Promise.race([pullUsers().catch(()=>false),new Promise(r=>setTimeout(()=>r(false),4000))]);
  const users=getUsers();
  const u=users.find(x=>String(x.username||"").trim().toLowerCase()===uname);
  const ok=u?await verifyPassword(u,password):false;
  if(!ok){
    const w=registerLoginFail(uname);
    if(w)return {error:"⏳ تم إيقاف الدخول لهذا الحساب مؤقتاً — حاول بعد "+fmtWait(w)};
    if(!u&&!_usersSynced)return {error:"❌ الحساب غير موجود على هذا الجهاز — تأكد من اتصال الإنترنت ثم حاول مرة أخرى"};
    return {error:"❌ اسم المستخدم أو كلمة المرور غير صحيحة"};
  }
  clearLoginFails(uname);
  let fresh=u;
  if(typeof u.password==="string"||!u.pw){
    const {password:_legacy,...rest}=u;
    fresh={...rest,pw:await hashPassword(password),mustChange:!!u.mustChange||password===DEFAULT_ADMIN_PW||password.length<MIN_PW_LEN};
    saveUsers(users.map(x=>x.id===u.id?fresh:x));
  }else if(password===DEFAULT_ADMIN_PW&&!u.mustChange){
    fresh={...u,mustChange:true};
    saveUsers(users.map(x=>x.id===u.id?fresh:x));
  }
  return {user:publicUser(fresh)};
}

// ── Safe read-modify-write on a shared Supabase dataset ─────────
// Every dataset is one JSON array row, so two devices writing at the same
// moment can overwrite each other. sbMutate always starts from the *latest*
// server copy, applies the change, writes, then re-reads to verify the change
// survived; if another device overwrote it, it retries on top of theirs.
// mutator(list) returns the new array, or {abort:"reason"} to cancel.
async function sbMutate(key,mutator,verify){
  for(let attempt=0;attempt<4;attempt++){
    const cur=await sbGet(key);
    if(cur===undefined)return {ok:false,error:"offline"};
    const base=Array.isArray(cur)?cur:[];
    const next=mutator(base);
    if(next&&!Array.isArray(next)&&next.abort)return {ok:false,error:next.abort,data:base};
    if(!(await sbSet(key,next)))return {ok:false,error:"offline"};
    try{localStorage.setItem(key,JSON.stringify(next));}catch{}
    if(!verify)return {ok:true,data:next};
    const check=await sbGet(key);
    if(Array.isArray(check)&&verify(check)){try{localStorage.setItem(key,JSON.stringify(check));}catch{}return {ok:true,data:check};}
    await new Promise(r=>setTimeout(r,200+Math.random()*500));
  }
  return {ok:false,error:"conflict"};
}

async function trashPut(storeKey,items,label){
  const arr=(Array.isArray(items)?items:[items]).filter(Boolean);
  if(!arr.length) return false;
  const cutoff=Date.now()-TRASH_DAYS*24*3600*1000;

async function trashRestore(entry){
  if(!entry||!entry.storeKey||!entry.record) return false;
  const rec=entry.record;
  const put=await sbMutate(entry.storeKey,list=>list.some(x=>x.id===rec.id)?list.map(x=>x.id===rec.id?rec:x):[...list,rec],list=>list.some(x=>x.id===rec.id));
  if(!put.ok) return false;
  try{ localStorage.setItem(entry.storeKey,JSON.stringify(put.data)); }catch{}
  await sbMutate(TRASH_KEY,list=>list.filter(t=>t.id!==entry.id));
  await logAudit("استعادة من سلة المحذوفات",(entry.label||entry.storeKey));
  return true;
}

async function buildSnapshot(){
  const data={};
  for(const k of BACKUP_KEYS){
    const v=await sbGet(k);
    if(v!==undefined&&v!==null) data[k]=v;
    else { try{ const l=localStorage.getItem(k); if(l) data[k]=JSON.parse(l); }catch{} }
  }
  return data;
}
async function saveAutoBackup(reason){
  const data=await buildSnapshot();
  const size=JSON.stringify(data).length;
  if(size>4000000){ console.warn("backup too large, skipped"); return false; }
  const snap={id:newId(),at:Date.now(),by:actorName(),reason:reason||"تلقائي",size,data};
  const res=await sbMutate(BACKUP_KEY,list=>[snap,...list].slice(0,BACKUP_KEEP));
  return res.ok;
}
// One automatic backup per calendar day, taken by whoever opens the app first.
async function maybeDailyBackup(){
  try{
    const list=await sbGet(BACKUP_KEY);
    if(list===undefined) return;                        // offline
    const arr=Array.isArray(list)?list:[];
    if(arr.some(b=>localISO(new Date(b.at))===localISO())) return;
    await saveAutoBackup("نسخة يومية تلقائية");
  }catch(e){console.warn("daily backup failed",e);}
}
// Writes a whole snapshot back to the server and to this device.
async function restoreSnapshot(data,label){
  const keys=Object.keys(data||{}).filter(k=>k.indexOf("iapp_")===0&&!["iapp_session","iapp_unified_session",GUARD_KEY,BACKUP_KEY,TRASH_KEY,AUDIT_KEY].includes(k));
  if(!keys.length) return {ok:false,error:"الملف لا يحتوي على بيانات I App"};
  await saveAutoBackup("قبل الاستعادة");                 // safety copy of the current data
  let done=0;
  for(const k of keys){
    const v=data[k];
    if(v===undefined) continue;
    const ok=await sbSet(k,v);
    try{ localStorage.setItem(k,JSON.stringify(v)); }catch{}
    if(ok) done++;
  }
  await logAudit("استعادة نسخة احتياطية",(label||"")+" · "+done+" مجموعة بيانات");
  return {ok:true,count:done};
}

async function sbGet(key) {
  try {
    const sb = getSB();
    if (!sb) return undefined;
    const { data, error } = await sb
      .from("iapp_store")
      .select("value")
      .eq("key", key)
      .maybeSingle();
    if (error) { console.warn("sbGet error:", error.message); return undefined; }
    if (!data) return null;
    // Ensure we always return a plain JSON-safe value (avoid DataCloneError)
    const val = data.value;
    if (val === null || val === undefined) return null;
    if (typeof val === "string" || typeof val === "number" || typeof val === "boolean") return val;
    if (Array.isArray(val) || (typeof val === "object")) {
      try { return JSON.parse(JSON.stringify(val)); } catch{ return val; }
    }
    return val;
  } catch(e) { console.warn("sbGet exception:", e.message||e); return undefined; }
}

async function sbSet(key, value) {
  try {
    const sb = getSB();
    if (!sb) return false;
    const { error } = await sb
      .from("iapp_store")
      .upsert({ key, value }, { onConflict: "key" });
    if (error) { console.warn("sbSet error:", error.message); return false; }
    return true;
  } catch(e) { console.warn("sbSet exception:", e); return false; }
}

        .on('postgres_changes', { event: '*', schema: 'public', table: 'iapp_store', filter: `key=eq.${key}` }, payload => {
          const next = payload?.new?.value;
          if (next !== undefined && next !== null) {
            setData(next);
            try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
          }
        })
        .subscribe();
    } catch (e) { console.warn(`[${key}] realtime unavailable`, e?.message || e); }
    return () => { if (channel) { try { sb.removeChannel(channel); } catch {} } };
  }, [key]);

  const persist = useCallback(async val => {
    setData(val);
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    await sbSet(key, val);
  }, [key]);

  // Read-only refresh for polling; it does not write back to Supabase.
  const refresh = useCallback(async ()=>{
    const remote=await sbGet(key);
    if(remote!==undefined && remote!==null){
      setData(prev=>JSON.stringify(prev)===JSON.stringify(remote)?prev:remote);
      try { localStorage.setItem(key, JSON.stringify(remote)); } catch {}
      return remote;
    }
    return undefined;
  },[key]);

  return [data, persist, ready, refresh];
}

function genCode(patients) {
  const nums = patients.map(p => parseInt((p.patientCode||"P-0000").replace("P-",""))||0);
  const next = Math.max(0, ...nums) + 1;
  return "P-" + String(next).padStart(4, "0");
}

// ── Users & Login ───────────────────────────────────────────────
// Bootstrap account for a fresh install only. It is hashed on first run and
// the app forces a new password before anything else can be used.
const DEFAULT_USERS=[{id:1,username:"admin",password:DEFAULT_ADMIN_PW,name:"د. عبدالستار صقر",role:"admin",mustChange:true}];
function getUsers() {
  try { const u=localStorage.getItem("iapp_users"); if(u){ const list=JSON.parse(u); if(Array.isArray(list)&&list.length) return list; } } catch {}
  return DEFAULT_USERS.map(u=>({...u}));
}
// Accounts are shared by every device through Supabase (only salted password
// hashes are stored — never plain passwords). Local storage is a cache, so a
// new phone, a cleared browser or a reinstalled APK still has every account.
let _usersSynced=false; // true once this device has read the server copy
function saveUsers(list, opts) {
  try { localStorage.setItem("iapp_users", JSON.stringify(list)); } catch {}
  if(!(opts&&opts.localOnly)) pushUsers(list);
}
// A list holding only the untouched bootstrap admin must never replace real accounts.
const isBootstrapOnly=l=>Array.isArray(l)&&l.length===1&&l[0].id===1&&!!l[0].mustChange;
async function pushUsers(list){
  // Never let a device that has not read the server copy overwrite it
  // (e.g. a wiped phone that only has the bootstrap admin).
  if(!_usersSynced) return false;
  const clean=list.filter(u=>u&&u.pw&&u.pw.hash).map(({password,...u})=>u);
  if(!clean.length||isBootstrapOnly(clean)) return false;
  return sbSet("iapp_users", clean);
}
async function pullUsers(){
  const remote=await sbGet("iapp_users");
  if(remote===undefined) return false;                 // offline: keep local cache
  let local=null; try{ local=JSON.parse(localStorage.getItem("iapp_users")||"null"); }catch{}
  const localReal=Array.isArray(local)&&local.length>0&&!isBootstrapOnly(local)&&local.every(u=>(u.pw&&u.pw.hash)||typeof u.password==="string");
  if(Array.isArray(remote)&&remote.length&&remote.every(u=>u&&u.pw&&u.pw.hash)&&!(isBootstrapOnly(remote)&&localReal)){
    try{ localStorage.setItem("iapp_users", JSON.stringify(remote)); }catch{}
    _usersSynced=true; return true;
  }
  // Server has no accounts yet: this device becomes the source (hashed only).
  _usersSynced=true;
  if(localReal) await pushUsers(local); // plaintext legacy accounts are pushed after they are hashed
  return true;
}

// ── Global Search ──────────────────────────────────────────────
function GlobalSearch({patients, prescriptions, appointments, onNavigate, onClose}) {
  const [q, setQ] = useState("");

  // Always compute results (hooks must not be called conditionally)
  const trimmed = q.trim();
  const pRes = trimmed ? patients.filter(p=>(p.name||"").includes(trimmed)||(p.patientCode||"").includes(trimmed)||(p.phone||"").includes(trimmed)).slice(0,5) : [];
  const rRes = trimmed ? prescriptions.filter(r=>(r.patient||"").includes(trimmed)).slice(0,3) : [];
  const aRes = trimmed ? appointments.filter(a=>(a.patient||"").includes(trimmed)).slice(0,3) : [];
  const hasResults = pRes.length>0||rRes.length>0||aRes.length>0;

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:500,display:"flex",alignItems:"flex-start",justifyContent:"center",paddingTop:60}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.surface,borderRadius:20,padding:20,width:"90%",maxWidth:420,maxHeight:"85vh",overflowY:"auto",border:"1px solid "+C.border}}>
        {/* Search input */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <span style={{color:C.accent,fontSize:18}}>🔍</span>
          <input autoFocus value={q} onChange={e=>setQ(e.target.value)}
            placeholder="ابحث في المرضى والوصفات والمواعيد..."
            style={{flex:1,background:C.bg,border:"1px solid "+C.border,borderRadius:10,padding:"10px 12px",color:C.text,fontSize:14,outline:"none",direction:"rtl",fontFamily:"inherit"}}/>
          <span onClick={onClose} style={{color:C.muted,fontSize:22,cursor:"pointer",lineHeight:1}}>×</span>
        </div>

        {/* Empty state */}
        {!trimmed&&<div style={{color:C.muted,fontSize:12,textAlign:"center",padding:20}}>ابدأ الكتابة للبحث...</div>}

        {/* Results */}
        {trimmed&&!hasResults&&<div style={{color:C.muted,fontSize:12,textAlign:"center",padding:20}}>لا توجد نتائج لـ "{trimmed}"</div>}

        {pRes.length>0&&<>

          {pRes.map(p=>(
            <div key={p.id} onClick={()=>onNavigate("patients",p.id)}

                <div style={{color:C.text,fontWeight:600,fontSize:13}}>{p.name}</div>
                <div style={{color:C.muted,fontSize:10}}>{p.patientCode||""} · {p.phone||""}</div>
              </div>
              <div style={{color:C.accent,fontSize:14}}>←</div>
            </div>
          ))}
        </>}

        {rRes.length>0&&<>
          <div style={{color:C.muted,fontSize:10,fontWeight:700,margin:"10px 0 8px"}}>🔬 الوصفات</div>
          {rRes.map(r=>(
            <div key={r.id} onClick={()=>onNavigate("prescriptions")}
              style={{background:C.card,borderRadius:10,padding:"10px 12px",marginBottom:6,cursor:"pointer"}}>
              <div style={{color:C.text,fontSize:13}}>{r.patient||""}</div>
              <div style={{color:C.muted,fontSize:10}}>{r.date||""} · {r.eye||""}</div>
            </div>

        </>}

        {aRes.length>0&&<>

function VisitForm({initial,patientId,onSave,onClose,doctorNames=["د. عبدالستار","د. سلمى","د. ليلى"],prices=[]}) {
  const blank={date:localISO(),type:"فحص روتيني",doctor:"د. عبدالستار",clinic:CLINICS[0].v,complaint:"",result:"",cost:"350",paid:false,nextVisit:"",notes:""};
  const [f,setF]=useState(initial?{clinic:CLINICS[0].v,...initial}:blank);
  const [customComplaint,setCustomComplaint]=useState("");
  const s=k=>e=>setF(v=>({...v,[k]:e.target.value}));
  const TYPES=["فحص روتيني","متابعة","فحص شبكية","قياس نظر","استشارة","عملية","طوارئ"];
  const COMPLAINTS=["ضعف النظر","التهاب العين","تغيير النظارة","صعوبة في القراءة","صداع","ألم في العين","عين حمراء","إفرازات من العين","رؤية مزدوجة","وميض أو بقع سوداء","أخرى..."];

  const handleTypeChange = e => {
    const type = e.target.value;
    const matched = prices.find(p => (p.name||"") === type || type.includes(p.name||"") || (p.name||"").includes(type));
    setF(v => ({...v, type, cost: matched ? matched.price : v.cost}));
  };

  const handleComplaintSelect = e => {
    const val = e.target.value;
    if(val==="أخرى...") { setCustomComplaint(""); setF(v=>({...v,complaint:""})); }
    else { setF(v=>({...v,complaint:val})); setCustomComplaint(""); }
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Field label="تاريخ الزيارة"><input style={inp()} type="date" value={f.date} onChange={s("date")}/></Field>
        <Field label="الطبيب"><select style={inp()} value={f.doctor} onChange={s("doctor")}>{doctorNames.map(d=><option key={d}>{d}</option>)}</select></Field>
      </div>
      <Field label="العيادة"><select style={inp()} value={f.clinic||CLINICS[0].v} onChange={s("clinic")}>{CLINICS.map(c=><option key={c.v} value={c.v}>{c.l}</option>)}</select></Field>
      <Field label="نوع الزيارة">
        <select style={inp()} value={f.type} onChange={handleTypeChange}>
          {(prices.length>0 ? prices.map(p=>p.name) : TYPES).map(t=><option key={t}>{t}</option>)}

function PatientFile({patient,allExams,allRx,allVisits,onClose,onUpdatePatient,onSaveExam,onDelExam,onSaveVisit,onDelVisit,onSaveRx,onSaveRadiologyRequest,doctorNames=[],primaryDoctor,prices=[],clinic,customTests=[]}) {
  const [tab,setTab]=useState("info");
  // Timeline controls
  const [timelineSearch,setTimelineSearch]=useState("");
  const [timelineFilter,setTimelineFilter]=useState("All");
  const [modal,setModal]=useState(null);
  const [delTarget,setDelTarget]=useState(null);
  const patientRecords=allExams.filter(e=>e.patientId===patient.id);
  const requests=patientRecords.filter(e=>e.status==="requested" || (e.requestedTests&&e.requestedTests.length));
  const exams=patientRecords.filter(e=>!(e.status==="requested" || (e.requestedTests&&e.requestedTests.length)));
  const rxList=allRx.filter(r=>r.patientId===patient.id);
  const visits=allVisits.filter(v=>v.patientId===patient.id).sort((a,b)=>b.date.localeCompare(a.date));
  const totalSpent=visits.reduce((s,v)=>s+(v.paid?Number(v.cost||0):0),0);
  const TABS=[{id:"info",label:"Overview",icon:"👤"},{id:"timeline",label:"Timeline",icon:"🕘"},{id:"visits",label:"Visits",icon:"🗓"},{id:"exams",label:"Examination",icon:"🔍"},{id:"requests",label:"Investigation Orders",icon:"🩻"},{id:"treatment",label:"Treatment",icon:"💊"},{id:"rx",label:"Prescriptions",icon:"🔬"},{id:"images",label:"Medical Images",icon:"oct"},{id:"compare",label:"Comparison",icon:"📊"}];
  const [curPatient,setCurPatient]=useState(patient);
  const [viewImg,setViewImg]=useState(null);

  // ── Images via Cloudinary ────────────────────────────────────
  const CLD_CLOUD   = "daihhusnc";
  const CLD_PRESET  = "iapp_clinic";
  const metaKey     = "iapp_imgmeta_" + patient.id;

  const [images, setImages]           = useState([]);
  const [imgLoading, setImgLoading]   = useState(false);
  const [uploadProgress, setUploadProgress] = useState(null);
  const [imgError, setImgError]       = useState(null);
  const [aiAnalysis, setAiAnalysis]   = useState({}); // {imgId: {loading, result, error}}
  const [imageType,setImageType] = useState("OCT");
  const [imageEye,setImageEye] = useState("OU");
  const [imageFilter,setImageFilter] = useState("الكل");
  const [requestTests,setRequestTests] = useState({});
  const [requestNotes,setRequestNotes] = useState("");
  const [requestEye,setRequestEye] = useState("OU");
  const [requestSaved,setRequestSaved] = useState(false);
  const [imagingOrders,setImagingOrders]=useState([]);
  const [imagingStudies,setImagingStudies]=useState([]);

  useEffect(()=>{
    let active=true;
    (async()=>{
      try{const o=await sbGet("iapp_imaging_orders"); if(active)setImagingOrders(Array.isArray(o)?o.filter(x=>x.patientId===patient.id):[]);}catch{}
      try{const st=await sbGet("iapp_imaging_studies"); if(active)setImagingStudies(Array.isArray(st)?st.filter(x=>x.patientId===patient.id):[]);}catch{}
    })();
    return()=>{active=false;};
  },[patient.id,requestSaved]);

  // AI analysis is intentionally disabled in the browser build.
  // The production implementation should call a server-side/Edge Function so no API credential is exposed.
  const analyzeImage = async (img) => {
    if(!img?.src) return;
    setAiAnalysis(prev => ({...prev, [img.id]: {loading:false, result:null, error:"تحليل AI غير مفعّل في نسخة المتصفح الحالية. يجب ربطه عبر Backend / Supabase Edge Function بشكل آمن."}}));
  };

  // Cloudinary stores image files; Supabase stores searchable patient-image metadata.
  const persistMeta = async (imgs) => {
    const meta = imgs.map(i => ({id:i.id, public_id:i.public_id, name:i.name, date:i.date, time:i.time||"", src:i.src, notes:i.notes||"", type:i.type||"صورة طبية", eye:i.eye||"OU", examId:i.examId||null}));
    try { localStorage.setItem(metaKey, JSON.stringify(meta)); } catch{}
    await sbSet(metaKey, meta);
    return meta;
  };

  const mergeImageMeta = async (operation) => {
    const remote = await sbGet(metaKey);
    const base = Array.isArray(remote) ? remote : images;
    const next = operation(base);
    await persistMeta(next);
    setImages(next);
    return next;
  };

  useEffect(() => {
    let channel;
    (async () => {
      setImgLoading(true);
      try { const cached=localStorage.getItem(metaKey); if(cached) setImages(JSON.parse(cached)); } catch{}
      try {
        const remote=await sbGet(metaKey);
        if(Array.isArray(remote)){ setImages(remote); try{localStorage.setItem(metaKey,JSON.stringify(remote));}catch{} }
      } catch(e){ console.warn("img meta load:",e); }
      setImgLoading(false);
    })();
    try {
      const sb=getSB();
      if(sb) channel=sb.channel("iapp_imgmeta_"+patient.id).on("postgres_changes",{event:"*",schema:"public",table:"iapp_store",filter:`key=eq.${metaKey}`},payload=>{
        const next=payload?.new?.value;
        if(Array.isArray(next)){ setImages(next); try{localStorage.setItem(metaKey,JSON.stringify(next));}catch{} }
      }).subscribe();
    } catch(e){ console.warn("image realtime unavailable",e); }
    return ()=>{ if(channel){try{getSB().removeChannel(channel);}catch{}} };
  },[patient.id]);

  const uploadOneFile = function(file) {
    setUploadProgress({name:file.name,pct:10});
    var folder="iapp/patient_"+patient.id;
    var formData=new FormData();
    formData.append("file",file); formData.append("upload_preset",CLD_PRESET); formData.append("folder",folder);
    return fetch("https://api.cloudinary.com/v1_1/"+CLD_CLOUD+"/image/upload",{method:"POST",body:formData}).then(res=>{
      setUploadProgress({name:file.name,pct:80});
      return res.json().then(data=>{
        if(!res.ok){setImgError("فشل الرفع: "+((data&&data.error&&data.error.message)||res.status));return;}
        const newImg={id:data.public_id,public_id:data.public_id,name:file.name,date:localISO(),time:new Date().toTimeString().slice(0,5),src:data.secure_url,notes:"",type:imageType,eye:imageEye,examId:null};
        setUploadProgress({name:file.name,pct:100});
        return mergeImageMeta(base=>[newImg,...base.filter(x=>x.id!==newImg.id)]);
      });
    }).catch(err=>setImgError("خطأ في الرفع: "+err.message));
  };

  const handleImgUpload = function(e) {
    var files = Array.from(e.target.files).filter(function(f){ return f.type.startsWith("image/"); });
    e.target.value = "";
    if (!files.length) return;
    setImgError(null);
    // Upload sequentially using promise chain
    var chain = Promise.resolve();
    files.forEach(function(file) {

            {requests.length>0&&<span style={{background:C.gold+"22",color:C.gold,borderRadius:8,padding:"4px 9px",fontSize:10,fontWeight:700}}>{requests.length} طلب</span>}

          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:12,marginBottom:14}}>
            <div style={{display:"flex",gap:7,alignItems:"center",marginBottom:10}}>
              <span style={{color:C.muted,fontSize:11}}>العين الافتراضية</span>
              {[["OU","كلتا العينين"],["OD","اليمنى"],["OS","اليسرى"]].map(([v,l])=><button key={v} onClick={()=>setRequestEye(v)} style={{background:requestEye===v?C.accent+"22":"transparent",border:`1px solid ${requestEye===v?C.accent:C.border}`,borderRadius:8,padding:"5px 9px",color:requestEye===v?C.accent:C.muted,fontSize:10,fontWeight:700}}>{v}</button>)}

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>

                  <div style={{display:"flex",alignItems:"center",gap:7}}><span style={{width:18,height:18,borderRadius:5,border:`2px solid ${on?C.accent:C.border}`,background:on?C.accent:"transparent",color:C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900}}>{on?"✓":""}</span><span style={{color:C.text,fontWeight:700,fontSize:11}}>{t.name}</span></div>
                  <div style={{color:C.muted,fontSize:9,marginTop:3,paddingRight:25}}>{t.name_ar}</div>
                  {on&&<button onClick={e=>{e.stopPropagation();cycleRequestEye(t.id)}} style={{position:"absolute",left:7,bottom:7,background:C.teal+"22",border:`1px solid ${C.teal}44`,borderRadius:6,color:C.teal,fontSize:9,fontWeight:800,padding:"2px 6px"}}>{eye}</button>}
                </div>;
              })}
            </div>
            <textarea value={requestNotes} onChange={e=>setRequestNotes(e.target.value)} rows={3} placeholder="ملاحظات / سبب طلب الفحص / تعليمات خاصة..." style={{...inp(),resize:"none",marginTop:12,fontSize:11}}/>
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <Btn full onClick={savePatientRadiologyRequest}>🧪 Save Investigation Order</Btn>
              <Btn outline onClick={()=>{const html=getRadiologyHTML(requestTests,curPatient,requestNotes,primaryDoctor,allRequestTests,clinic);if(Object.keys(requestTests).length)printDoc(html);else alert("اختر الفحوصات أولاً")}}>🖨️ طباعة</Btn>
            </div>
            {requestSaved&&<div style={{marginTop:9,background:C.success+"11",border:`1px solid ${C.success}33`,borderRadius:9,padding:8,color:C.success,fontSize:11,fontWeight:700}}>✓ Investigation Order saved and linked to patient file</div>}
          </div>

          {requests.length>0&&<div>
            <div style={{color:C.muted,fontSize:11,fontWeight:700,marginBottom:8}}>الطلبات السابقة</div>
            {requests.slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))).map(r=><div key={r.id} style={{background:C.card,border:`1px solid ${C.gold}33`,borderRadius:12,padding:11,marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8}}><div style={{color:C.gold,fontWeight:800,fontSize:12}}>🧪 Investigation Order</div><span style={{color:C.muted,fontSize:10}}>{r.date} · {r.time||""}</span></div>
              <div style={{color:C.text,fontSize:11,lineHeight:1.8,marginTop:6}}>{(r.requestedTests||[]).map(t=><span key={t.id} style={{display:"inline-block",background:C.bg,border:`1px solid ${C.border}`,borderRadius:7,padding:"3px 7px",margin:"2px 3px"}}>{t.name} · {t.eye||"OU"}</span>)}</div>
              {r.notes&&<div style={{color:C.muted,fontSize:10,marginTop:5}}>📝 {r.notes}</div>}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}}><span style={{color:C.teal,fontSize:10}}>✓ محفوظ في الملف</span><button onClick={()=>printDoc(getRadiologyHTML(Object.fromEntries((r.requestedTests||[]).map(t=>[t.id,t.eye||"OU"])),curPatient,r.notes,primaryDoctor,allRequestTests,clinic))} style={{background:C.accent+"22",border:"none",borderRadius:7,padding:"5px 9px",color:C.accent,fontSize:10,fontWeight:700}}>🖨️ إعادة طباعة</button></div>
            </div>)}
          </div>}
          {requests.length===0&&<div style={{color:C.muted,textAlign:"center",padding:20,fontSize:11}}>No previous Investigation Orders for this patient</div>}
          {imagingOrders.length>0&&<div style={{marginTop:16}}><div style={{color:C.muted,fontSize:11,fontWeight:700,marginBottom:8}}>حالة تنفيذ الطلبات</div>{imagingOrders.slice().sort((a,b)=>String(b.date+b.time).localeCompare(String(a.date+a.time))).map(o=><div key={o.id} style={{background:C.card,border:`1px solid ${o.status==="reported"?C.success:C.border}`,borderRadius:12,padding:11,marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",gap:8}}><div style={{color:C.text,fontWeight:800,fontSize:11}}>🩻 {o.id}</div><Tag label={IMAGING_ORDER_STATUSES[o.status]||o.status} color={o.status==="reported"?C.success:o.status==="completed"?C.teal:o.status==="cancelled"?C.danger:C.gold}/></div><div style={{color:C.text,fontSize:10,lineHeight:1.7,marginTop:5}}>{(o.tests||[]).map(t=><span key={t.id} style={{display:"inline-block",margin:"2px 3px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:6,padding:"2px 6px"}}>{t.name} · {t.eye||"OU"}</span>)}</div><div style={{color:C.muted,fontSize:9,marginTop:4}}>{o.date} · {o.doctor||""}</div></div>)}</div>}
        </div>}

        {/* TREATMENT TAB */}
        {tab==="treatment"&&<div>
          <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:14}}>خطة العلاج</div>
          {exams.filter(e=>e.treatmentPlan).length===0&&<div style={{color:C.muted,textAlign:"center",padding:40,fontSize:13}}>أضف فحصاً يتضمن خطة علاج</div>}
          {exams.filter(e=>e.treatmentPlan).map(ex=>(
            <div key={ex.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:14,marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}>
                <span style={{color:C.accent,fontWeight:700,fontSize:13}}>{ex.date}</span>
                <span style={{color:C.muted,fontSize:11}}>{ex.doctor}</span>
              </div>
              <div style={{background:C.success+"11",border:`1px solid ${C.success}33`,borderRadius:12,padding:12,marginBottom:10}}>
                <SecHead icon="💊" label="خطة العلاج" color={C.success}/>
                <div style={{color:C.text,fontSize:13,lineHeight:1.8,whiteSpace:"pre-wrap"}}>{ex.treatmentPlan}</div>
              </div>
              {ex.followUp&&<div style={{background:C.teal+"11",border:`1px solid ${C.teal}33`,borderRadius:10,padding:10,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{color:C.muted,fontSize:12}}>موعد المتابعة</span>
                <span style={{color:C.teal,fontWeight:700,fontSize:13}}>📅 {ex.followUp}</span>
              </div>}
              {ex.anteriorSegment&&<div style={{display:"flex",flexDirection:"column",gap:6,marginTop:8}}>
                <div style={{background:C.bg,borderRadius:10,padding:10}}><div style={{color:C.muted,fontSize:10,marginBottom:3}}>القطعة الأمامية</div><div style={{color:C.text,fontSize:12}}>{ex.anteriorSegment}</div></div>
                {ex.posteriorSegment&&<div style={{background:C.bg,borderRadius:10,padding:10}}><div style={{color:C.muted,fontSize:10,marginBottom:3}}>القطعة الخلفية</div><div style={{color:C.text,fontSize:12}}>{ex.posteriorSegment}</div></div>}
              </div>}
              {ex.notes&&<div style={{background:C.border,borderRadius:10,padding:10,marginTop:8}}><div style={{color:C.muted,fontSize:10,marginBottom:3}}>ملاحظات</div><div style={{color:C.text,fontSize:12}}>{ex.notes}</div></div>}
            </div>
          ))}
        </div>}

        {/* RX TAB */}
        {tab==="rx"&&<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div style={{color:C.text,fontWeight:700,fontSize:14}}>الوصفات ({rxList.length})</div>
            <div onClick={()=>setModal("addRx")} style={{background:`linear-gradient(135deg,${C.accent},${C.teal})`,borderRadius:10,padding:"7px 14px",color:C.bg,fontSize:12,fontWeight:700,cursor:"pointer"}}>+ وصفة جديدة</div>
          </div>
          {rxList.length===0&&<div style={{color:C.muted,textAlign:"center",padding:40,fontSize:13}}>لا توجد وصفات لهذا المريض</div>}
          {rxList.map(rx=>(
            <div key={rx.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:14,marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <div style={{color:C.accent,fontWeight:700,fontSize:13}}>{rx.date} · {rx.eye}</div>
                <div style={{display:"flex",gap:6}}>
                  <div onClick={()=>setModal({editRx:rx})} style={{background:C.accent+"22",borderRadius:8,padding:"5px 10px",color:C.accent,fontSize:11,cursor:"pointer",fontWeight:600}}>✏ تعديل</div>
                  <div onClick={()=>{if(window.confirm("نقل هذه الوصفة إلى سلة المحذوفات؟")){trashPut("iapp_prescriptions",rx,"روشتة");logAudit("حذف روشتة",(rx.date||"")+" · "+(curPatient&&curPatient.name||""));const updated=(allRx||[]).filter(r=>r.id!==rx.id);if(onSaveRx)onSaveRx(updated);}}} style={{background:C.danger+"22",borderRadius:8,padding:"5px 10px",color:C.danger,fontSize:11,cursor:"pointer",fontWeight:600}}>🗑</div>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                {[["SPH يمنى",rx.sphR],["CYL يمنى",rx.cylR],["AXIS يمنى",rx.axisR],["SPH يسرى",rx.sphL],["CYL يسرى",rx.cylL],["AXIS يسرى",rx.axisL]].map(([k,v])=>(
                  <div key={k} style={{background:C.bg,borderRadius:8,padding:"6px 10px"}}><div style={{color:C.muted,fontSize:10}}>{k}</div><div style={{color:C.text,fontWeight:600,fontSize:13}}>{v||"-"}</div></div>
                ))}
              </div>
              {rx.add&&rx.add!=="0.00"&&<div style={{background:C.teal+"11",borderRadius:8,padding:"6px 10px",marginBottom:8}}><span style={{color:C.muted,fontSize:11}}>ADD: </span><span style={{color:C.teal,fontWeight:700}}>{rx.add}</span>{rx.ipd&&<><span style={{color:C.muted,fontSize:11,marginRight:12}}>IPD: </span><span style={{color:C.teal,fontWeight:700}}>{rx.ipd}</span></>}</div>}
              {rx.medicines&&<div style={{background:C.gold+"11",border:`1px solid ${C.gold}33`,borderRadius:10,padding:10,marginBottom:8}}><div style={{color:C.gold,fontSize:11,fontWeight:700,marginBottom:3}}>💊 الأدوية</div><div style={{color:C.text,fontSize:12,whiteSpace:"pre-line"}}>{rx.medicines}</div></div>}
              {rx.notes&&<div style={{color:C.muted,fontSize:11,marginBottom:8,fontStyle:"italic"}}>{rx.notes}</div>}
              <div onClick={()=>setModal({printRx:rx})} style={{background:C.purple+"22",borderRadius:8,padding:"7px 0",color:C.purple,fontSize:11,fontWeight:700,cursor:"pointer",textAlign:"center"}}>🖨️ طباعة الوصفة / كشف النظارة</div>
            </div>
          ))}
        </div>}

        {/* IMAGES TAB */}
        {tab==="images"&&<div>
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:10,marginBottom:12}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <Field label="نوع الصورة"><select style={inp()} value={imageType} onChange={e=>setImageType(e.target.value)}>
                {["OCT","OCTA","Fundus Photography","FFA","Optos UWF","Visual Field","Pentacam","B-Scan","UBM","Other"].map(x=><option key={x}>{x}</option>)}
              </select></Field>
              <Field label="العين"><select style={inp()} value={imageEye} onChange={e=>setImageEye(e.target.value)}>
                <option value="OU">OU — كلتا العينين</option><option value="OD">OD — اليمنى</option><option value="OS">OS — اليسرى</option>
              </select></Field>
            </div>
            <div style={{display:"flex",gap:6,overflowX:"auto",marginTop:6}}>
              {["الكل","OCT","OCTA","Fundus Photography","FFA","Optos UWF","Visual Field","Pentacam","B-Scan","UBM","Other"].map(x=><button key={x} onClick={()=>setImageFilter(x)} style={{whiteSpace:"nowrap",background:imageFilter===x?C.accent+"22":"transparent",border:`1px solid ${imageFilter===x?C.accent:C.border}`,borderRadius:8,padding:"5px 8px",color:imageFilter===x?C.accent:C.muted,fontSize:10,cursor:"pointer"}}>{x}</button>)}
            </div>
          </div>
          {/* Header */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <span style={{color:C.text,fontWeight:700,fontSize:14}}>الإشعاعات والصور ({images.length})</span>
            <label style={{background:uploadProgress?C.muted:`linear-gradient(135deg,${C.accent},${C.teal})`,borderRadius:10,padding:"7px 14px",color:C.bg,fontSize:12,fontWeight:700,cursor:uploadProgress?"not-allowed":"pointer",pointerEvents:uploadProgress?"none":"auto"}}>
              📎 رفع صورة
              <input type="file" accept="image/*" multiple onChange={handleImgUpload} style={{display:"none"}} disabled={!!uploadProgress}/>
            </label>
          </div>

          {/* Upload progress */}
          {uploadProgress&&(
            <div style={{background:C.card,border:`1px solid ${C.accent}44`,borderRadius:12,padding:"12px 14px",marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                <span style={{color:C.accent,fontSize:12,fontWeight:600}}>⬆ جاري الرفع...</span>
                <span style={{color:C.muted,fontSize:11}}>{uploadProgress.name.slice(0,25)}</span>
              </div>
              <div style={{background:C.border,borderRadius:99,height:6,overflow:"hidden"}}>
                <div style={{background:`linear-gradient(90deg,${C.accent},${C.teal})`,width:uploadProgress.pct+"%",height:"100%",borderRadius:99,transition:"width 0.3s"}}/>
              </div>
            </div>
          )}

          {/* Error */}
          {imgError&&(
            <div style={{background:C.danger+"11",border:`1px solid ${C.danger}44`,borderRadius:10,padding:"10px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{color:C.danger,fontSize:12}}>⚠ {imgError}</span>
              <span onClick={()=>setImgError(null)} style={{color:C.danger,cursor:"pointer",fontSize:18}}>×</span>
            </div>
          )}

          {/* Loading */}
          {imgLoading&&images.length===0&&(
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <div style={{fontSize:32,marginBottom:10}}>⏳</div>
              <div style={{color:C.muted,fontSize:13}}>جاري التحميل من السيرفر...</div>
            </div>
          )}

          {/* Empty state */}
          {!imgLoading&&images.length===0&&!uploadProgress&&(
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <img src={XRAY_ICON} style={{width:72,height:72,margin:"0 auto 12px",display:"block",opacity:0.7}}/>
              <div style={{color:C.muted,fontSize:13,marginBottom:6}}>لا توجد إشعاعات مرفوعة بعد</div>
              <div style={{color:C.border,fontSize:11}}>اضغط "رفع صورة" لإضافة إشعاعات أو صور الفحص</div>
            </div>
          )}

          {/* Images grid */}
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {images.filter(img=>imageFilter==="الكل"||img.type===imageFilter).map(img=>(
              <div key={img.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,overflow:"hidden"}}>
                {/* Thumbnail */}
                {img.src ? (
                  <div onClick={()=>setViewImg(img)} style={{cursor:"pointer",position:"relative"}}>
                    <img src={img.src} alt={img.name} style={{width:"100%",maxHeight:200,objectFit:"cover",display:"block"}}/>
                    <div style={{position:"absolute",top:8,left:8,background:"rgba(0,0,0,0.6)",borderRadius:8,padding:"3px 10px",color:"#fff",fontSize:10}}>🔍 عرض كامل</div>
                    <div style={{position:"absolute",top:8,right:8,background:C.accent+"cc",borderRadius:8,padding:"3px 10px",color:C.bg,fontSize:10,fontWeight:700}}>{img.date}</div>
                  </div>
                ) : (
                  <div style={{height:80,display:"flex",alignItems:"center",justifyContent:"center",background:C.border+"33"}}>
                    <span style={{color:C.muted,fontSize:11}}>🩻 {img.name}</span>
                  </div>
                )}
                {/* Info & notes */}
                <div style={{padding:"10px 12px"}}>
                  <div style={{color:C.text,fontSize:12,fontWeight:600,marginBottom:6,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{img.name}</div>
                  <textarea
                    value={img.notes||""}
                    onChange={e=>updateImgNotes(img.id,e.target.value)}
                    onBlur={e=>updateImgNotes(img.id,e.target.value)}
                    placeholder="ملاحظات (نوع الفحص، النتيجة...)"
                    rows={2}
                    style={{...inp(),resize:"none",fontSize:11,marginBottom:8}}
                  />
                  <div style={{display:"flex",gap:8}}>
                    {img.src&&<div onClick={()=>setViewImg(img)} style={{flex:1,background:C.teal+"22",borderRadius:8,padding:"7px 0",color:C.teal,fontSize:11,fontWeight:700,cursor:"pointer",textAlign:"center"}}>🔍 عرض</div>}
                    {img.src&&<div onClick={()=>analyzeImage(img)} style={{flex:1,background:C.purple+"22",borderRadius:8,padding:"7px 0",color:C.purple,fontSize:11,fontWeight:700,cursor:"pointer",textAlign:"center"}}>
                      {aiAnalysis[img.id]?.loading ? "⏳ جاري التحليل..." : "🤖 تحليل AI"}
                    </div>}
                    <div onClick={()=>{if(window.confirm("حذف الصورة من القائمة؟"))delImage(img.id);}} style={{flex:img.src?0:1,background:C.danger+"22",borderRadius:8,padding:"7px 12px",color:C.danger,fontSize:11,cursor:"pointer",textAlign:"center"}}>🗑 حذف</div>
                  </div>

                  {/* AI Analysis Result */}
                  {aiAnalysis[img.id]?.result&&(
                    <div style={{marginTop:10,background:`linear-gradient(135deg,${C.purple}15,${C.accent}10)`,border:`1px solid ${C.purple}44`,borderRadius:12,padding:12}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                        <div style={{width:22,height:22,borderRadius:6,background:`linear-gradient(135deg,${C.purple},${C.accent})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11}}>🤖</div>
                        <span style={{color:C.purple,fontWeight:700,fontSize:12}}>تحليل الذكاء الاصطناعي</span>
                        <span style={{marginRight:"auto",background:C.purple+"22",color:C.purple,borderRadius:6,padding:"1px 7px",fontSize:9,fontWeight:700}}>للمساعدة فقط</span>
                      </div>
                      <div style={{color:C.text,fontSize:12,lineHeight:1.7,whiteSpace:"pre-wrap"}}>{aiAnalysis[img.id].result}</div>
                      <div onClick={()=>setAiAnalysis(prev=>({...prev,[img.id]:null}))} style={{marginTop:8,color:C.muted,fontSize:10,cursor:"pointer",textAlign:"left"}}>✕ إغلاق التحليل</div>
                    </div>
                  )}
                  {aiAnalysis[img.id]?.error&&(
                    <div style={{marginTop:8,background:C.danger+"11",border:`1px solid ${C.danger}33`,borderRadius:10,padding:"8px 12px",color:C.danger,fontSize:11}}>{aiAnalysis[img.id].error}</div>
                  )}
                </div>
              </div>
            ))}
          </div>

          {images.length>0&&(
            <div style={{background:C.accent+"11",border:`1px solid ${C.accent}22`,borderRadius:10,padding:"10px 14px",marginTop:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{color:C.muted,fontSize:11}}>☁ محفوظة على Cloudinary</span>
              <span style={{color:C.accent,fontSize:11,fontWeight:700}}>{images.length} صورة</span>
            </div>
          )}
        </div>}
      </div>

      {/* Full-screen image viewer */}
      {viewImg&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.96)",zIndex:600,display:"flex",flexDirection:"column"}} onClick={()=>setViewImg(null)}>
          <div onClick={e=>e.stopPropagation()} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",background:"rgba(0,0,0,0.6)"}}>
            <div>
              <div style={{color:"#fff",fontWeight:700,fontSize:13}}>{viewImg.name}</div>
              <div style={{color:"#aaa",fontSize:11}}>{viewImg.date}</div>
            </div>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <a href={viewImg.src} download={viewImg.name} onClick={e=>e.stopPropagation()} style={{background:C.accent+"33",borderRadius:8,padding:"6px 12px",color:C.accent,fontSize:11,fontWeight:700,textDecoration:"none"}}>⬇ تحميل</a>
              <span onClick={()=>setViewImg(null)} style={{color:"#fff",fontSize:28,cursor:"pointer",lineHeight:1,padding:"0 4px"}}>×</span>
            </div>
          </div>
          <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:8,overflow:"auto"}} onClick={()=>setViewImg(null)}>
            <img src={viewImg.src} alt={viewImg.name} style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain",borderRadius:8}}/>
          </div>
          {viewImg.notes&&(
            <div style={{padding:"10px 16px",background:"rgba(0,0,0,0.7)",color:"#ccc",fontSize:12,textAlign:"right"}}>
              📝 {viewImg.notes}
            </div>
          )}
        </div>
      )}

      {/* Modals */}

function Patients({patients,setPatients,exams,setExams,prescriptions,setRx,visits,setVisits,doctorNames=[],primaryDoctor,prices=[],clinic,initOpenId,initNewName,onInitDone,session,customTests=[]}) {
  const [search,setSearch]=useState(initNewName||"");
  const [modal,setModal]=useState(null);
  const [openFile,setOpenFile]=useState(null);

  // الأحدث أولاً (بالـ id اللي هو timestamp)
  const sorted=[...patients].sort((a,b)=>(b.id||0)-(a.id||0));
  const filtered=sorted.filter(p=>(p.name||"").includes(search)||(p.condition||"").includes(search)||(p.patientCode||"").includes(search));
  const isNewToday = p => p.id && (Date.now()-p.id)<86400000;

  // Handle navigation from Dashboard
  useEffect(()=>{
    if(initOpenId){setOpenFile(initOpenId);if(onInitDone)onInitDone();}
    else if(initNewName){
      // البحث التلقائي بالاسم القادم من المواعيد
      setSearch(initNewName);
      if(onInitDone)onInitDone();
    }
  },[]);

  const updP=f=>setPatients(patients.map(p=>p.id===f.id?f:p));
  const addP=f=>{
    const newP={...f,id:Date.now(),patientCode:genCode(patients)};
    setPatients([newP,...patients]); // يضاف في الأول مباشرة
  };
  const delP=async id=>{
    const rec=patients.find(p=>p.id===id);
    await trashPut("iapp_patients",rec,"مريض: "+((rec&&rec.name)||id));
    setPatients(patients.filter(p=>p.id!==id));
    logAudit("حذف مريض",(rec&&(rec.patientCode+" · "+rec.name))||id);
  };
  const saveExam=f=>{const ex=exams.find(e=>e.id===f.id);setExams(ex?exams.map(e=>e.id===f.id?f:e):[...exams,f]);};
  const saveRadiologyRequest=async rec=>{
    const remote=await sbGet("iapp_exams");
    const base=Array.isArray(remote)?remote:exams;
    const next=base.some(e=>e.id===rec.id)?base.map(e=>e.id===rec.id?rec:e):[...base,rec];
    await setExams(next);
  };
  const delExam=async id=>{
    const rec=exams.find(e=>e.id===id);
    await trashPut("iapp_exams",rec,"فحص/طلب أشعة");
    setExams(exams.filter(e=>e.id!==id));
    logAudit("حذف فحص",(rec&&rec.date)||id);
  };
  const saveVisit=f=>{const ex=visits.find(v=>v.id===f.id);setVisits(ex?visits.map(v=>v.id===f.id?f:v):[...visits,f]);};
  const delVisit=async id=>{
    const rec=visits.find(v=>v.id===id);
    await trashPut("iapp_visits",rec,"زيارة");
    setVisits(visits.filter(v=>v.id!==id));
    logAudit("حذف زيارة",(rec&&(rec.date+" · "+(rec.patient||"")))||id);
  };

  if(openFile){
    const p=patients.find(p=>p.id===openFile);
    if(!p){setOpenFile(null);return null;}
    return <PatientFile patient={p} allExams={exams} allRx={prescriptions} allVisits={visits} onClose={()=>setOpenFile(null)} onUpdatePatient={f=>{updP(f);}} onSaveExam={saveExam} onDelExam={delExam} onSaveVisit={saveVisit} onDelVisit={delVisit} onSaveRx={updated=>{if(setRx)setRx(updated);}} onSaveRadiologyRequest={saveRadiologyRequest} doctorNames={doctorNames} primaryDoctor={primaryDoctor} prices={prices} clinic={clinic} customTests={customTests}/>;
  }

  return (
    <div style={{padding:"16px 16px 90px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span style={{color:C.text,fontWeight:700,fontSize:16}}>المرضى ({patients.length})</span>
        <Btn small onClick={()=>setModal("add")}>+ مريض جديد</Btn>
      </div>
      <div style={{background:C.card,border:`1px solid ${search?C.accent:C.border}`,borderRadius:12,padding:"10px 14px",marginBottom:16,display:"flex",alignItems:"center",gap:8,transition:"border 0.2s"}}>
        <span style={{color:C.accent}}>🔍</span>
        <input autoFocus={!!initNewName} value={search} onChange={e=>setSearch(e.target.value)} placeholder="ابحث بالاسم أو التشخيص أو رقم الملف..." style={{background:"none",border:"none",outline:"none",color:C.text,fontSize:13,flex:1,direction:"rtl",fontFamily:"inherit"}}/>
        {search&&<span onClick={()=>setSearch("")} style={{color:C.muted,cursor:"pointer",fontSize:18,lineHeight:1}}>×</span>}
      </div>
      {search&&filtered.length===0&&(
        <div style={{background:C.gold+"11",border:`1px solid ${C.gold}33`,borderRadius:14,padding:"14px 16px",marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:20}}>👤</span>
          <div style={{flex:1}}>
            <div style={{color:C.gold,fontWeight:700,fontSize:13}}>"{search}" غير موجود في قاعدة البيانات</div>
            <div style={{color:C.muted,fontSize:11,marginTop:2}}>هل تريد إضافته كمريض جديد؟</div>
          </div>
          <Btn small color={C.gold} onClick={()=>setModal({addNew:search})}>+ إضافة</Btn>
        </div>
      )}
      {filtered.map(p=>(
        <div key={p.id} style={{background:C.card,border:`1px solid ${isNewToday(p)?C.teal+"66":C.border}`,borderRadius:16,padding:14,marginBottom:10,position:"relative"}}>
          {isNewToday(p)&&<span style={{position:"absolute",top:10,left:10,background:C.teal,color:C.bg,borderRadius:6,padding:"1px 7px",fontSize:9,fontWeight:800}}>جديد</span>}
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
            <div style={{width:44,height:44,borderRadius:"50%",background:`linear-gradient(135deg,${C.accent}33,${C.teal}33)`,border:`2px solid ${isNewToday(p)?C.teal:C.accent}44`,display:"flex",alignItems:"center",justifyContent:"center",color:C.accent,fontWeight:800,fontSize:16}}>{(p.name||"?")[0]}</div>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{color:C.text,fontWeight:700,fontSize:14}}>{p.name}</div>
                <span style={{background:C.accent+"22",color:C.accent,borderRadius:6,padding:"1px 7px",fontSize:10,fontWeight:700,letterSpacing:1}}>{p.patientCode||"—"}</span>
              </div>
              <div style={{color:C.muted,fontSize:11}}>{p.age} سنة · {p.condition||"—"}</div>
            </div>
            <Tag label={p.status} color={SC[p.status]||C.muted}/>
          </div>
          <div style={{display:"flex",gap:6}}>
            <div onClick={()=>setOpenFile(p.id)} style={{background:C.teal+"22",borderRadius:8,padding:"7px 0",color:C.teal,fontSize:11,fontWeight:700,cursor:"pointer",flex:1,textAlign:"center"}}>📂 الملف الكامل</div>
            <div onClick={()=>setModal({edit:p})} style={{background:C.accent+"22",borderRadius:8,padding:"7px 12px",color:C.accent,fontSize:11,cursor:"pointer"}}>✏</div>
            {session&&session.role==="admin"&&<div onClick={()=>setModal({del:p.id})} style={{background:C.danger+"22",borderRadius:8,padding:"7px 10px",color:C.danger,fontSize:11,cursor:"pointer"}}>🗑</div>}
          </div>
        </div>
      ))}
      {filtered.length===0&&<div style={{color:C.muted,textAlign:"center",padding:30,fontSize:13}}>لا توجد نتائج</div>}
      {(modal==="add"||(modal&&modal.addNew))&&<Modal title="مريض جديد" onClose={()=>setModal(null)}><PatientForm initial={(modal&&modal.addNew)?{name:modal.addNew}:null} onSave={f=>{addP(f);setModal(null);if(onInitDone)onInitDone();}} onClose={()=>setModal(null)}/></Modal>}
      {(modal&&modal.edit)&&<Modal title="تعديل بيانات المريض" onClose={()=>setModal(null)}><PatientForm initial={modal.edit} onSave={f=>{updP(f);setModal(null);}} onClose={()=>setModal(null)}/></Modal>}
      {(modal&&modal.del)&&<Confirm msg="حذف هذا المريض نهائياً؟" onOk={()=>{delP(modal.del);setModal(null);}} onNo={()=>setModal(null)}/>}
    </div>
  );
}

// ── Print Functions ───────────────────────────────────────────
// Waits (max ~3s) for web fonts used by the print page (e.g. the prescription's
// Arabic font) so the first printed page never falls back to a system font.
function whenPrintReady(doc, cb) {
  let done = false;
  const go = () => { if (!done) { done = true; cb(); } };
  const started = Date.now();
  const poll = () => {
    if (done) return;
    try {
      const links = [...doc.querySelectorAll('link[rel="stylesheet"]')];
      const cssReady = links.every(l => l.sheet);
      if (cssReady || Date.now() - started > 2000) {
        const fams = (doc.body && doc.body.dataset.fonts || "").split(",").filter(Boolean);
        Promise.all(fams.map(f => doc.fonts.load("16px '" + f + "'").catch(()=>{})).concat(fams.map(f => doc.fonts.load("700 16px '" + f + "'").catch(()=>{}))))
          .then(() => doc.fonts.ready).then(() => setTimeout(go, 120)).catch(go);
        return;
      }
    } catch (e) { go(); return; }
    setTimeout(poll, 120);
  };
  setTimeout(poll, 50);
  setTimeout(go, 3500); // never block printing
}

function printDoc(html) {
  // Try popup window first (works on desktop browsers)
  let win = null;
  try { win = window.open("", "_blank"); } catch (e) { win = null; }

  if (win && win.document) {
    win.document.open();
    win.document.write(html);
    win.document.close();
    win.focus();
    whenPrintReady(win.document, () => { try { win.print(); } catch(e){ printViaIframe(html); } });
    return;
  }

  // Fallback for in-app WebView (Median.co / Android) where window.open is blocked
  printViaIframe(html);
}

function printViaIframe(html) {
  const old = document.getElementById("__print_iframe__");
  if (old) old.remove();

  const iframe = document.createElement("iframe");
  iframe.id = "__print_iframe__";
  iframe.setAttribute("aria-hidden", "true");
  Object.assign(iframe.style, {position:"fixed", right:"0", bottom:"0", width:"0", height:"0", border:"0", visibility:"hidden"});
  document.body.appendChild(iframe);

  let printed = false; // single guard: onload + safety net used to open the dialog twice
  const triggerPrint = () => {
    if (printed) return;
    printed = true;
    try { const fw = iframe.contentWindow; fw.focus(); fw.print(); }
    catch (e) { alert("تعذر فتح نافذة الطباعة على هذا الجهاز"); }
    setTimeout(() => { try { iframe.remove(); } catch(e){} }, 60000);
  };

  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(html);
  doc.close();
  whenPrintReady(doc, triggerPrint);
}

const DEFAULT_DRUGS = [
  "Vigamox ED","Optipred ED","Tobradex ED","Tobradex EO",
  "Dexaflox ED","Cyanaro ED","Solofresh ED",
  "Timolol 0.5% ED","Tobramycin ED","Prednisolone ED","Moxifloxacin ED",
  "Dorzolamide ED","Latanoprost ED","Ketorolac ED","Cyclopentolate ED",
  "Tropicamide ED","Atropine ED","Tetracycline EO","Vitamins A&E cap",
];
// Load custom drugs from localStorage (merged with defaults)
function loadDrugs() {
  try {
    const custom = JSON.parse(localStorage.getItem("iapp_custom_drugs")||"[]");
    const all = [...DEFAULT_DRUGS];
    custom.forEach(d=>{ if(!all.includes(d)) all.push(d); });
    return all;
  } catch { return [...DEFAULT_DRUGS]; }
}
function saveDrug(name) {
  try {
    const custom = JSON.parse(localStorage.getItem("iapp_custom_drugs")||"[]");
    if(!custom.includes(name) && !DEFAULT_DRUGS.includes(name)) {
      custom.push(name);
      localStorage.setItem("iapp_custom_drugs", JSON.stringify(custom));
    }
  } catch {}
}
function deleteDrug(name) {
  try {
    const custom = JSON.parse(localStorage.getItem("iapp_custom_drugs")||"[]");
    localStorage.setItem("iapp_custom_drugs", JSON.stringify(custom.filter(d=>d!==name)));
  } catch {}
}

const DOSE_OPTIONS = [
  "مرة يومياً","مرتين يومياً","3 مرات يومياً","4 مرات يومياً",
  "كل 4 ساعات","كل 6 ساعات","عند اللزوم","قبل النوم",
];

// Generate SPH options: +20.00 → -20.00 step 0.25 (integer steps to avoid float precision)
const SPH_OPTIONS = (()=>{
  const opts=[];
  for(let i=80; i>=-80; i--) {
    const v = i/4;
    opts.push((v>=0?"+":"")+v.toFixed(2));
  }
  return opts;
})();

// Generate CYL options: 0.00 → -6.00 step 0.25 (integer steps)
const CYL_OPTIONS = (()=>{
  const opts=[];
  for(let i=0; i<=24; i++) {
    const v = -(i/4);
    opts.push(v===0?"0.00":v.toFixed(2));
  }
  return opts;
})();

// Generate AXIS options: 0 → 180
const AXIS_OPTIONS = Array.from({length:181},(_,i)=>String(i));

function MedicinesStep({medicines, onChange}) {
  const parse = () => {
    if(!medicines) return [];
    return medicines.split("\n").filter(Boolean).map(line=>{
      const dash = line.indexOf(" - ");
      if(dash>-1) return {name:line.slice(0,dash).trim(), dose:line.slice(dash+3).trim()};
      return {name:line.trim(), dose:""};
    });
  };
  const [meds, setMeds]         = useState(parse);
  const [drugList, setDrugList] = useState(loadDrugs);
  const [showSugg, setShowSugg] = useState(null);
  const [newDrug, setNewDrug]   = useState("");
  const [addingNew, setAddingNew] = useState(false);

  const save = list => { setMeds(list); onChange(list.map(m=>m.name+(m.dose?" - "+m.dose:"")).join("\n")); };
  const addMed   = ()         => save([...meds, {name:"",dose:""}]);
  const update   = (i,k,v)   => { const n=[...meds]; n[i]={...n[i],[k]:v}; save(n); };
  const remove   = i          => save(meds.filter((_,idx)=>idx!==i));

  const handleAddNewDrug = () => {
    const name = newDrug.trim();
    if(!name) return;
    saveDrug(name);
    const updated = loadDrugs();
    setDrugList(updated);
    setNewDrug("");
    setAddingNew(false);
  };

  const handleDeleteDrug = (drugName) => {
    if(DEFAULT_DRUGS.includes(drugName)) { alert("لا يمكن حذف الأدوية الأصلية"); return; }
    if(!window.confirm("حذف " + drugName + " من القائمة؟")) return;
    deleteDrug(drugName);
    setDrugList(loadDrugs());
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <span style={{color:C.text,fontWeight:700,fontSize:13}}>💊 الأدوية الموصوفة</span>
        <div style={{display:"flex",gap:6}}>
          <Btn small color={C.teal} onClick={()=>setAddingNew(v=>!v)}>+ صنف جديد</Btn>
          <Btn small onClick={addMed}>+ إضافة</Btn>
        </div>
      </div>

      {/* Add new drug to list */}
      {addingNew&&(
        <div style={{background:C.teal+"11",border:"1px solid "+C.teal+"44",borderRadius:12,padding:12,display:"flex",gap:8,alignItems:"center"}}>
          <input autoFocus value={newDrug} onChange={e=>setNewDrug(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&handleAddNewDrug()}
            placeholder="اسم الدواء الجديد..."
            style={{...inp(),flex:1,fontSize:12}}/>
          <Btn small color={C.teal} onClick={handleAddNewDrug}>حفظ</Btn>
          <span onClick={()=>setAddingNew(false)} style={{color:C.muted,fontSize:20,cursor:"pointer"}}>×</span>
        </div>
      )}

      {meds.length===0&&<div style={{color:C.muted,fontSize:12,textAlign:"center",padding:20,background:C.card,borderRadius:10}}>اضغط "+ إضافة" لإضافة الأدوية</div>}
      {meds.map((m,i)=>(
        <div key={i} style={{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:12}}>
          <div style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
            <div style={{width:24,height:24,borderRadius:6,background:C.gold,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:C.bg,flexShrink:0}}>{i+1}</div>
            <div style={{flex:1}}>
              {/* Drug dropdown */}
              <select style={{...inp(),fontSize:12}} value={m.name}
                onChange={e=>update(i,"name",e.target.value)}>
                <option value="">-- اختر دواء --</option>
                {drugList.map(d=>(
                  <option key={d} value={d}>{d}</option>
                ))}
              </select>
            </div>
            <div onClick={()=>remove(i)} style={{color:C.danger,fontSize:20,cursor:"pointer",flexShrink:0,paddingRight:4}}>×</div>
          </div>
          {/* Dose options */}
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {DOSE_OPTIONS.map(d=>(
              <div key={d} onClick={()=>update(i,"dose",d)} style={{background:m.dose===d?C.teal+"22":C.bg,border:"1px solid "+(m.dose===d?C.teal:C.border),borderRadius:8,padding:"4px 10px",fontSize:10,color:m.dose===d?C.teal:C.muted,cursor:"pointer",fontWeight:m.dose===d?700:400}}>
                {d}
              </div>
            ))}
          </div>
          {m.dose&&<div style={{color:C.muted,fontSize:11,marginTop:6}}>📋 {m.name} - {m.dose}</div>}
        </div>
      ))}
    </div>
  );
}

function RxForm({initial,patients,onSave,onClose,doctorNames=["د. عبدالستار","د. سلمى","د. ليلى"]}) {
  // Auto-fill patient when coming from patient file (only 1 patient passed)
  const autoPatient = patients&&patients.length===1 ? patients[0] : null;
  const blank={
    patient: (autoPatient&&autoPatient.name)||"",
    patientId: (autoPatient&&autoPatient.id)||null,
    eye:"كلتا العينين",sphR:"",cylR:"",axisR:"",sphL:"",cylL:"",axisL:"",add:"",medicines:"",notes:"",
    date:localISO()
  };
  const [f,setF]=useState(initial?{...initial}:blank);
  // Skip patient-selection step if auto-filled
  const [step,setStep]=useState(autoPatient&&!initial?1:0);
  const [errors,setErrors]=useState({});
  const s=k=>e=>setF(v=>({...v,[k]:e.target.value}));

  const needR = f.eye==="العين اليمنى"||f.eye==="كلتا العينين";
  const needL = f.eye==="العين اليسرى"||f.eye==="كلتا العينين";

  const validate=()=>{
    const e={};
    if(needR && f.cylR && !f.axisR) e.axisR="مطلوب عند وجود CYL";
    if(needL && f.cylL && !f.axisL) e.axisL="مطلوب عند وجود CYL";
    setErrors(e);
    return Object.keys(e).length===0;
  };

  const handleNext=()=>{
    if(step===0 && !f.patient) return;
    if(step===1&&!validate()) return;
    setStep(p=>p+1);
  };

  const handleSave=()=>{
    if(!validate()) { setStep(1); return; }
    onSave(f);
  };

  return (
    <div>
      {autoPatient&&<div style={{background:C.accent+"22",border:"1px solid "+C.accent+"44",borderRadius:10,padding:"8px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:16}}>👤</span>
        <span style={{color:C.accent,fontWeight:700,fontSize:13}}>{autoPatient.name}</span>
        <span style={{color:C.muted,fontSize:11,marginRight:"auto"}}>{autoPatient.patientCode||""}</span>
      </div>}
      <div style={{display:"flex",marginBottom:18,background:C.card,borderRadius:12,padding:4}}>
        {(autoPatient?["قياسات النظر","الأدوية"]:["المريض","قياسات النظر","الأدوية"]).map((st,i)=>{
          const realStep=autoPatient?i+1:i;
          return <div key={i} onClick={()=>setStep(realStep)} style={{flex:1,textAlign:"center",padding:"8px 4px",background:step===realStep?"linear-gradient(135deg,"+C.accent+","+C.teal+")":"transparent",borderRadius:9,cursor:"pointer",color:step===realStep?C.bg:C.muted,fontSize:11,fontWeight:700}}>{st}</div>;
        })}
      </div>
      {step===0&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Field label="المريض"><select style={inp()} value={f.patientId||""} onChange={e=>{const p=patients.find(p=>p.id===Number(e.target.value));setF(v=>({...v,patientId:Number(e.target.value),patient:(p&&p.name)||""}));}}><option value="">اختر مريض</option>{patients.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></Field>
        {patients.length===0&&<div style={{color:C.gold,fontSize:12,textAlign:"center",padding:"8px",background:C.gold+"11",borderRadius:8}}>⚠️ لا يوجد مرضى — أضف مريضاً أولاً من شاشة المرضى</div>}
        <Field label="تاريخ الوصفة"><input style={inp()} type="date" value={f.date} onChange={s("date")}/></Field>
        <Field label="العين المعالجة"><div style={{display:"flex",gap:8}}>{["العين اليمنى","العين اليسرى","كلتا العينين"].map(opt=><div key={opt} onClick={()=>setF(v=>({...v,eye:opt}))} style={{flex:1,textAlign:"center",padding:"9px 4px",background:f.eye===opt?C.accent+"22":C.card,border:`1px solid ${f.eye===opt?C.accent:C.border}`,borderRadius:10,cursor:"pointer",color:f.eye===opt?C.accent:C.muted,fontSize:10,fontWeight:600}}>{opt}</div>)}</div></Field>
        <Field label="ملاحظات"><textarea style={{...inp(),resize:"none"}} rows={2} value={f.notes} onChange={s("notes")} placeholder="ملاحظات..."/></Field>
      </div>}
      {step===1&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        {[["اليمنى","R",needR],["اليسرى","L",needL]].map(([lbl,side,needed])=>(
          <div key={side} style={{background:C.card,border:`1px solid ${needed?C.border:C.border+"55"}`,borderRadius:14,padding:14,opacity:needed?1:0.45}}>
            <div style={{color:C.accent,fontWeight:700,fontSize:13,marginBottom:12}}>👁 العين {lbl} {!needed&&<span style={{color:C.muted,fontSize:10,fontWeight:400}}>(غير مختارة)</span>}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
              {/* SPH dropdown */}
              <div>
                <label style={{color:C.muted,fontSize:11,display:"block",marginBottom:5}}>SPH</label>
                <select disabled={!needed} style={{...inp({textAlign:"center",padding:"8px 4px",fontSize:13})}} value={f["sph"+side]||"+0.00"}
                  onChange={e=>{setF(v=>({...v,["sph"+side]:e.target.value}));}}>
                  {SPH_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
                </select>
              </div>
              {/* CYL dropdown */}
              <div>
                <label style={{color:C.muted,fontSize:11,display:"block",marginBottom:5}}>CYL</label>
                <select disabled={!needed} style={{...inp({textAlign:"center",padding:"8px 4px",fontSize:13})}} value={f["cyl"+side]||"0.00"}
                  onChange={e=>{
                    const cylVal=e.target.value;
                    setF(v=>({...v,["cyl"+side]:cylVal}));
                    // Clear axis error when CYL is 0
                    if(cylVal==="0.00") setErrors(v=>({...v,["axis"+side]:undefined}));
                  }}>
                  {CYL_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
                </select>
              </div>
              {/* AXIS dropdown */}
              <div>
                <label style={{color:errors["axis"+side]?C.danger:C.muted,fontSize:11,display:"block",marginBottom:5,fontWeight:"700"}}>
                  AXIS {f["cyl"+side]&&f["cyl"+side]!=="0.00"&&<span style={{color:C.danger}}>*</span>}
                </label>
                <select disabled={!needed} style={{...inp({textAlign:"center",padding:"8px 4px",fontSize:13,border:`1px solid ${errors["axis"+side]?C.danger:C.border}`,background:errors["axis"+side]?C.danger+"11":C.bg})}} value={f["axis"+side]||"0"}
                  onChange={e=>{setF(v=>({...v,["axis"+side]:e.target.value}));setErrors(v=>({...v,["axis"+side]:undefined}));}}>
                  {AXIS_OPTIONS.map(o=><option key={o} value={o}>{o}°</option>)}
                </select>
                {errors["axis"+side]&&<div style={{color:C.danger,fontSize:9,marginTop:3}}>⚠ مطلوب مع CYL</div>}
              </div>
            </div>
          </div>
        ))}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Field label="ADD (الإضافة)">
            <select style={inp({textAlign:"center"})} value={f.add||"0.00"} onChange={s("add")}>
              {["0.00","0.25","0.50","0.75","1.00","1.25","1.50","1.75","2.00","2.25","2.50","2.75","3.00","3.25","3.50"].map(o=><option key={o} value={o}>+{o}</option>)}
            </select>
          </Field>
          <Field label="I.P.D (mm)">
            <select style={{...inp(),textAlign:"center"}} value={f.ipd||"62"} onChange={s("ipd")}>
              {Array.from({length:Math.round((75-50)/0.5)+1},(_,i)=>(50+i*0.5).toFixed(1)).map(v=><option key={v} value={v}>{v}</option>)}
            </select>
          </Field>
        </div>
        {(errors.axisR||errors.axisL)&&(
          <div style={{background:C.danger+"11",border:`1px solid ${C.danger}44`,borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:16}}>⚠️</span>
            <span style={{color:C.danger,fontSize:12,fontWeight:600}}>عند إدخال CYL يجب إدخال AXIS للعين {errors.axisR&&errors.axisL?"كلتيهما":errors.axisR?"اليمنى":"اليسرى"}</span>
          </div>
        )}
      </div>}
      {step===2&&<MedicinesStep medicines={f.medicines} onChange={val=>setF(v=>({...v,medicines:val}))}/>}
      <div style={{display:"flex",gap:10,marginTop:20}}>
        {step>0&&<Btn outline onClick={()=>setStep(p=>p-1)}>السابق</Btn>}
        {step<2?<Btn full onClick={handleNext}>التالي →</Btn>:<><Btn outline full onClick={onClose}>إلغاء</Btn><Btn full onClick={handleSave}>✓ حفظ</Btn></>}
      </div>
    </div>
  );
}

  // Group selected tests by category
  const grouped = {};
  Object.keys(selected).forEach(id=>{
    const t = allTests.find(x=>x.id===id);
    if(!t) return;
    if(!grouped[t.cat]) grouped[t.cat]=[];
    grouped[t.cat].push({...t, eye: selected[id]});
  });
  const p = patient||{};
  const totalCount = Object.keys(selected).length;
  return `<!DOCTYPE html><html dir="rtl" lang="ar">

  .pinfo span{font-weight:700;color:#111;margin-right:4px;}

  .tests-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .test-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1.5px solid #d0eaff;border-radius:8px;background:#f8fbff;}
  .checkbox{width:18px;height:18px;border:2px solid #00C2FF;border-radius:4px;background:#00C2FF;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .check{color:#fff;font-size:12px;font-weight:800;}

<body>
<div class="page"><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:80px;font-weight:900;color:#00C2FF;opacity:0.05;pointer-events:none;z-index:0;letter-spacing:8px;font-family:Georgia,serif;white-space:nowrap;">I App</div>
  <div class="header">

  </div>
  ${Object.entries(grouped).map(([cat,tests])=>`
