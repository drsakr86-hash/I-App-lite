        <span style={{color:C.danger,fontWeight:600,fontSize:13}}>إعادة تعيين البيانات الأولية</span>
      </div>}

      {/* Clinic edit modal */}
      {editClinic&&<Modal title="تعديل بيانات العيادة" onClose={()=>setEditClinic(false)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Field label="عنوان العيادة"><input style={inp()} value={clinicForm.address||""} onChange={e=>setClinicForm(f=>({...f,address:e.target.value}))} placeholder="مثال: القاهرة - مصر الجديدة - شارع..."/></Field>
          <Field label="رقم التواصل / الهاتف"><input style={inp()} value={clinicForm.phone||""} onChange={e=>setClinicForm(f=>({...f,phone:e.target.value}))} placeholder="مثال: 01234567890"/></Field>
          <Field label="شعار العيادة (يظهر في الروشتة والعلامة المائية)">
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              {clinicForm.logo&&<img src={clinicForm.logo} alt="" style={{width:52,height:52,borderRadius:"50%",objectFit:"cover",background:"#fff"}}/>}
              <label style={{flex:1,textAlign:"center",background:C.accent+"22",color:C.accent,border:`1px dashed ${C.accent}66`,borderRadius:10,padding:"10px 8px",fontSize:12,cursor:"pointer"}}>
                {clinicForm.logo?"تغيير الشعار":"رفع صورة الشعار"}
                <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{
                  const file=e.target.files&&e.target.files[0]; if(!file) return;
                  const img=new Image(); const url=URL.createObjectURL(file);
                  img.onload=()=>{ // shrink to ≤500px so it stays small in the synced settings
                    const k=Math.min(1,500/Math.max(img.width,img.height));
                    const cv=document.createElement("canvas"); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
                    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
                    setClinicForm(f=>({...f,logo:cv.toDataURL("image/png")}));
                  };
                  img.onerror=()=>{URL.revokeObjectURL(url);alert("تعذر قراءة الصورة");};
                  img.src=url; e.target.value="";
                }}/>
              </label>
              {clinicForm.logo&&<span onClick={()=>setClinicForm(f=>({...f,logo:""}))} style={{color:C.danger,fontSize:11,cursor:"pointer"}}>حذف</span>}
            </div>
          </Field>
          <div style={{display:"flex",gap:10,marginTop:8}}>
            <Btn outline full onClick={()=>setEditClinic(false)}>إلغاء</Btn>
            <Btn full onClick={()=>{setClinic({...clinic,...clinicForm});setEditClinic(false);}}>✓ حفظ</Btn>
          </div>
        </div>
      </Modal>}

      {/* Doctor modals */}
      {modal==="add"&&<Modal title="إضافة طبيب جديد" onClose={()=>setModal(null)}><DoctorForm onSave={f=>{addDoc(f);setModal(null);}} onClose={()=>setModal(null)}/></Modal>}
      {(modal&&modal.edit)&&<Modal title="تعديل بيانات الطبيب" onClose={()=>setModal(null)}><DoctorForm initial={modal.edit} onSave={f=>{editDoc(f);setModal(null);}} onClose={()=>setModal(null)}/></Modal>}
      {delDoc&&<Confirm msg="حذف هذا الطبيب من القائمة؟" onOk={()=>{delDocFn(delDoc);setDelDoc(null);}} onNo={()=>setDelDoc(null)}/>}

      {/* Price modals */}
      {priceModal==="add"&&<Modal title="إضافة خدمة جديدة" onClose={()=>setPriceModal(null)}><PriceForm onSave={f=>{addPrice(f);setPriceModal(null);}} onClose={()=>setPriceModal(null)}/></Modal>}
      {(priceModal&&priceModal.edit)&&<Modal title="تعديل سعر الخدمة" onClose={()=>setPriceModal(null)}><PriceForm initial={priceModal.edit} onSave={f=>{editPrice(f);setPriceModal(null);}} onClose={()=>setPriceModal(null)}/></Modal>}
      {(priceModal&&priceModal.del)&&<Confirm msg="حذف هذه الخدمة من قائمة الأسعار؟" onOk={()=>{delPrice(priceModal.del);setPriceModal(null);}} onNo={()=>setPriceModal(null)}/>}

      {/* User account modals */}
      {userModal==="add"&&<Modal title="إضافة مستخدم جديد" onClose={()=>setUserModal(null)}><UserForm error={userErr} onSave={addUser} onClose={()=>setUserModal(null)}/></Modal>}
      {(userModal&&userModal.edit)&&<Modal title="تعديل بيانات المستخدم" onClose={()=>setUserModal(null)}><UserForm initial={userModal.edit} error={userErr} onSave={editUser} onClose={()=>setUserModal(null)}/></Modal>}
      {delUser&&<Confirm msg="حذف هذا المستخدم؟ لن يستطيع تسجيل الدخول بعد الحذف." onOk={()=>{delUserFn(delUser);setDelUser(null);}} onNo={()=>setDelUser(null)}/>}

      {/* Change password modal */}
      {pwModal&&<Modal title="🔒 تغيير كلمة المرور" onClose={()=>{setPwModal(false);setPwForm({old:"",new1:"",new2:""});setPwMsg(null);}}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Field label="كلمة المرور الحالية"><input style={{...inp(),direction:"ltr",textAlign:"center"}} type="password" value={pwForm.old} onChange={e=>setPwForm(f=>({...f,old:e.target.value}))}/></Field>
          <Field label="كلمة المرور الجديدة"><input style={{...inp(),direction:"ltr",textAlign:"center"}} type="password" value={pwForm.new1} onChange={e=>setPwForm(f=>({...f,new1:e.target.value}))}/></Field>
          <Field label="تأكيد كلمة المرور الجديدة"><input style={{...inp(),direction:"ltr",textAlign:"center"}} type="password" value={pwForm.new2} onChange={e=>setPwForm(f=>({...f,new2:e.target.value}))}/></Field>
          {pwMsg&&<div style={{background:pwMsg.err?C.danger+"22":C.success+"22",border:`1px solid ${pwMsg.err?C.danger:C.success}44`,borderRadius:10,padding:"10px 14px",color:pwMsg.err?C.danger:C.success,fontSize:13,textAlign:"center"}}>{pwMsg.err||pwMsg.ok}</div>}
          <div style={{display:"flex",gap:10,marginTop:4}}>
            <Btn outline full onClick={()=>{setPwModal(false);setPwForm({old:"",new1:"",new2:""});setPwMsg(null);}}>إلغاء</Btn>
            <Btn full color={C.purple} onClick={handleChangePassword}>✓ تغيير كلمة المرور</Btn>
          </div>
        </div>
      </Modal>}

      {confirm&&<Confirm msg="سيتم حذف جميع البيانات. هل أنت متأكد؟" onOk={async()=>{await saveAutoBackup("قبل حذف كل البيانات");await logAudit("حذف كل البيانات","");onReset();setConfirm(false);}} onNo={()=>setConfirm(false)}/>}
    </div>
  );
}


// ── Imaging Center 2.0 ────────────────────────────────────────
const IMAGING_TYPES=[
  {id:"oct",name:"OCT",icon:"🧬",hint:"Macular / RNFL / ONH"},
  {id:"octa",name:"OCT Angio",icon:"🩸",hint:"OCTA / WF-OCTA"},
  {id:"ffa",name:"FFA",icon:"💉",hint:"Fluorescein angiography"},
  {id:"fundus",name:"Fundus Photography",icon:"📷",hint:"Color / Red-free / UWF"},
  {id:"pentacam",name:"Pentacam",icon:"🔵",hint:"Corneal tomography"},
  {id:"erg",name:"ERG",icon:"📈",hint:"Electroretinography"},
  {id:"vf",name:"Visual Field",icon:"◉",hint:"Perimetry"},
  {id:"optos",name:"Optos",icon:"🌐",hint:"Ultra-widefield"},
  {id:"other",name:"Other",icon:"📄",hint:"Other imaging / test"},
];
const IMAGING_EYES=[{v:"OU",l:"OU — كلتا العينين"},{v:"OD",l:"OD — اليمنى"},{v:"OS",l:"OS — اليسرى"}];
const IMAGING_REPORT_TEMPLATES={
  oct:`Vitreomacular Interface:\nFoveal Contour:\nCentral Foveal Thickness OD:\nCentral Foveal Thickness OS:\nRetinal Layers:\nChoroid:\nImpression:`,
  octa:`Scan / Area:\nSuperficial Plexus:\nDeep Plexus:\nFAZ:\nNon-perfusion / Capillary Dropout:\nNeovascularization:\nImpression:`,
  ffa:`Arm-Retina Circulation:\nArterial Filling:\nVenous Emptying:\nCapillary Dropout:\nFAZ:\nLeakage / Staining / Blockage:\nImpression:`,
  fundus:`OD:\nOS:\nDisc:\nMacula:\nVessels:\nPeripheral Retina:\nImpression:`,
  pentacam:`Anterior Corneal Surface:\nPosterior Elevation:\nKeratometry:\nPachymetry:\nAstigmatism:\nImpression:`,
  erg:`Protocol:\nOD Response:\nOS Response:\nAmplitude:\nImplicit Time:\nImpression:`,
  vf:`Test Strategy:\nReliability Indices:\nMD / PSD:\nCentral Field:\nOD:\nOS:\nImpression:`,
  optos:`OD:\nOS:\nMacula:\nDisc:\nVessels:\nPeripheral Retina / 360°:\nImpression:`,
  other:`Findings:\nImpression:`
};

const IMAGING_ORDER_STATUSES={requested:"مطلوب",scheduled:"مجدول",in_progress:"جارٍ التنفيذ",completed:"تم التنفيذ",reported:"تم التقرير",cancelled:"ملغى"};
const localDateStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const localTimeStr=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const imagingTypeName=id=>(IMAGING_TYPES.find(x=>x.id===id)||{}).name||id||"";

function ImagingCenter({patients,primary,clinic}){
  const [selectedPatient,setSelectedPatient]=useState(null);
  const [patientSearch,setPatientSearch]=useState("");
  const [type,setType]=useState("oct");
  const [eye,setEye]=useState("OU");
  const [notes,setNotes]=useState("");
  const [report,setReport]=useState(IMAGING_REPORT_TEMPLATES.oct);
  const [files,setFiles]=useState([]);
  const [studies,setStudies]=useState([]);
  const [loading,setLoading]=useState(false);
  const [uploading,setUploading]=useState(false);
  const [progress,setProgress]=useState(null);
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [view,setView]=useState(null);
  const [orders,setOrders]=useState([]);
  const [selectedOrder,setSelectedOrder]=useState(null);
  const [selectedOrderTest,setSelectedOrderTest]=useState(null);

  const loadStudies=useCallback(async()=>{
    setLoading(true);
    const remote=await sbGet("iapp_imaging_studies");
    const legacy=await sbGet("iapp_imaging");
    const list=Array.isArray(remote)?remote:(Array.isArray(legacy)?legacy:[]);
    setStudies(list);
    const ord=await sbGet("iapp_imaging_orders");
    setOrders(Array.isArray(ord)?ord:[]);
    setLoading(false);
  },[]);
  const advanceOrder=async(order,nextStatus)=>{
    const remote=await sbGet("iapp_imaging_orders");
    const base=Array.isArray(remote)?remote:orders;
    const next=base.map(o=>o.id===order.id?{...o,status:nextStatus,lastUpdatedAt:new Date().toISOString()}:o);
    await sbSet("iapp_imaging_orders",next); setOrders(next);
    if(selectedOrder?.id===order.id)setSelectedOrder({...order,status:nextStatus});
  };
  useEffect(()=>{
    loadStudies();
    const sb=getSB(); let ch=null;
    try{ch=sb.channel("iapp_imaging_center").on("postgres_changes",{event:"*",schema:"public",table:"iapp_store",filter:"key=eq.iapp_imaging"},p=>{if(Array.isArray(p?.new?.value))setStudies(p.new.value);}).subscribe();}catch{}
    return()=>{if(ch){try{sb.removeChannel(ch);}catch{}}};
  },[loadStudies]);
  useEffect(()=>{setReport(IMAGING_REPORT_TEMPLATES[type]||"");},[type]);

  const patientResults=patients.filter(p=>{
    const q=patientSearch.trim().toLowerCase(); if(!q) return true;
    return String(p.name||"").toLowerCase().includes(q)||String(p.patientCode||"").toLowerCase().includes(q)||String(p.phone||"").includes(q);
  }).slice(0,8);

  const uploadFile=async(file,studyId)=>{
    const form=new FormData(); form.append("file",file); form.append("upload_preset","iapp_clinic"); form.append("folder","iapp/patient_"+(selectedPatient?.id||"unassigned")+"/imaging");
    setProgress({name:file.name,pct:20});
    const resource=file.type==="application/pdf"?"raw/upload":file.type.startsWith("video/")?"video/upload":"image/upload";
    const res=await fetch("https://api.cloudinary.com/v1_1/daihhusnc/"+resource,{method:"POST",body:form});
    const data=await res.json();
    if(!res.ok) throw new Error(data?.error?.message||"Cloudinary upload failed");
    setProgress({name:file.name,pct:100});
    return {id:data.public_id||studyId+"-"+Date.now(),public_id:data.public_id||"",name:file.name,src:data.secure_url||"",resource_type:data.resource_type||"image"};
  };

  const saveStudy=async()=>{
    if(!selectedPatient){alert("اختر المريض أولاً");return;}
    if(!files.length && !report.trim() && !notes.trim()){alert("أضف صورة/ملف أو تقريراً أو ملاحظات");return;}
    setUploading(true); setProgress(null);
    try{
      const id="IMG-"+Date.now();
      const uploaded=[];
      for(const f of files) uploaded.push(await uploadFile(f,id));
      const now={date:localDateStr(),time:localTimeStr()};
      const chosenTest=selectedOrder?.tests?.find(t=>t.id===selectedOrderTest) || selectedOrder?.tests?.[0] || null;
      const finalType=chosenTest?(IMAGING_TYPES.find(x=>x.name===chosenTest.name||x.id===chosenTest.id)?.id||type):type;
      const finalEye=chosenTest?.eye||eye;
      const rec={id,patientId:selectedPatient.id,patient:selectedPatient.name,patientCode:selectedPatient.patientCode||"",date:now.date,time:now.time,doctor:(primary&&primary.name)||"",type:finalType,typeName:imagingTypeName(finalType),eye:finalEye,files:uploaded,notes:notes.trim(),report:report.trim(),status:report.trim()?"reported":"completed",orderId:selectedOrder?.id||null,orderTestId:chosenTest?.id||null,createdAt:new Date().toISOString()};

      const remoteStudies=await sbGet("iapp_imaging_studies");
      const studyBase=Array.isArray(remoteStudies)?remoteStudies:[];
      await sbSet("iapp_imaging_studies",[rec,...studyBase]);
      // Keep the old key temporarily for backward compatibility.
      const old=await sbGet("iapp_imaging");
      await sbSet("iapp_imaging",[rec,...(Array.isArray(old)?old:[])]);

      // Make the result visible in the patient's image timeline.
      const metaKey="iapp_imgmeta_"+selectedPatient.id;
      const oldMeta=await sbGet(metaKey);
      const metaBase=Array.isArray(oldMeta)?oldMeta:[];
      const newMeta=uploaded.map(f=>({id:f.id,public_id:f.public_id,name:f.name,date:now.date,time:now.time,src:f.src,notes:notes.trim(),type:imagingTypeName(finalType),eye:finalEye,examId:id}));
      await sbSet(metaKey,[...newMeta,...metaBase]);

      // Also create a clinical exam record linked to the imaging study.
      const remoteExams=await sbGet("iapp_exams");
      const examBase=Array.isArray(remoteExams)?remoteExams:[];
      const examRec={id:"EX-"+id,patientId:selectedPatient.id,date:now.date,time:now.time,doctor:(primary&&primary.name)||"",testType:imagingTypeName(finalType),eye:finalEye,report:report.trim(),notes:notes.trim(),status:"completed",imagingStudyId:id,imagingOrderId:selectedOrder?.id||null,files:uploaded};
      await sbSet("iapp_exams",[examRec,...examBase]);

      if(selectedOrder){
        const remoteOrders=await sbGet("iapp_imaging_orders");
        const orderBase=Array.isArray(remoteOrders)?remoteOrders:orders;
        const nextOrders=orderBase.map(o=>o.id===selectedOrder.id?{...o,status:report.trim()?"reported":"completed",completedAt:new Date().toISOString(),completedStudyId:id}:o);
        await sbSet("iapp_imaging_orders",nextOrders);
        setOrders(nextOrders);
      }
      setStudies(prev=>[rec,...prev]);
      setSelectedOrder(null); setSelectedOrderTest(null); setFiles([]); setNotes(""); setReport(IMAGING_REPORT_TEMPLATES[type]||""); setProgress(null);
      alert("✓ تم تنفيذ الفحص وربطه بطلب الأشعة وملف المريض");
    }catch(e){alert("فشل حفظ الفحص: "+e.message);}
    finally{setUploading(false);}
  };

  const deleteStudy=async(id)=>{
    if(!confirm("حذف سجل الفحص من التطبيق؟ سيتم الاحتفاظ بالملفات على Cloudinary حتى يتم حذفها من الخادم بشكل آمن."))return;
    const remote=await sbGet("iapp_imaging_studies"); const base=Array.isArray(remote)?remote:studies;
    const target=base.find(x=>x.id===id);
    const next=base.filter(x=>x.id!==id);
    await trashPut("iapp_imaging_studies",target,"فحص صور");
    logAudit("حذف فحص صور",(target&&((target.patient||"")+" · "+(target.type||"")))||id);
    await sbSet("iapp_imaging_studies",next);
    const old=await sbGet("iapp_imaging"); if(Array.isArray(old)) await sbSet("iapp_imaging",old.filter(x=>x.id!==id));
    if(target?.orderId){const ord=await sbGet("iapp_imaging_orders");if(Array.isArray(ord))await sbSet("iapp_imaging_orders",ord.map(o=>o.id===target.orderId?{...o,status:"cancelled",cancelledAt:new Date().toISOString()}:o));}
    setStudies(next); setView(null); loadStudies();
  };

  const filtered=studies.filter(x=>(filter==="all"||x.type===filter)&&(!search||String(x.patient||"").includes(search)||String(x.patientCode||"").includes(search))).sort((a,b)=>String(b.date+b.time).localeCompare(String(a.date+a.time)));

  return <div style={{padding:"16px 16px 90px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <div><div style={{color:C.text,fontWeight:800,fontSize:16}}>🖼️ Imaging Center</div><div style={{color:C.muted,fontSize:11,marginTop:3}}>OCT · OCTA · FFA · Fundus · Pentacam · ERG · VF · Optos</div></div>
      <span style={{background:C.accent+"22",color:C.accent,borderRadius:9,padding:"5px 8px",fontSize:10,fontWeight:700}}>{studies.length} سجل</span>
    </div>

    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:14,marginBottom:14}}>
      <SecHead icon="👤" label="اختيار المريض"/>
      {selectedPatient?<div style={{display:"flex",alignItems:"center",gap:8}}><div style={{flex:1,background:C.accent+"11",border:`1px solid ${C.accent}55`,borderRadius:10,padding:"9px 12px"}}><div style={{color:C.text,fontWeight:700,fontSize:13}}>{selectedPatient.name}</div><div style={{color:C.muted,fontSize:10}}>{selectedPatient.patientCode} · {selectedPatient.phone}</div></div><button onClick={()=>setSelectedPatient(null)} style={{background:C.danger+"22",border:"none",borderRadius:8,color:C.danger,fontSize:18,padding:"6px 10px"}}>×</button></div>
      :<div style={{position:"relative"}}><input value={patientSearch} onChange={e=>setPatientSearch(e.target.value)} placeholder="ابحث بالاسم أو رقم الملف..." style={inp()}/>{patientSearch&&<div style={{position:"absolute",zIndex:20,left:0,right:0,top:48,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,maxHeight:220,overflowY:"auto"}}>{patientResults.map(p=><div key={p.id} onClick={()=>{setSelectedPatient(p);setPatientSearch("");}} style={{padding:"10px 12px",borderBottom:`1px solid ${C.border}33`,cursor:"pointer"}}><div style={{color:C.text,fontSize:12,fontWeight:700}}>{p.name}</div><div style={{color:C.muted,fontSize:10}}>{p.patientCode||"—"} · {p.phone||""}</div></div>)}</div>}</div>}
    </div>

    {selectedPatient&&orders.filter(o=>o.patientId===selectedPatient.id&&!['reported','cancelled'].includes(o.status)).length>0&&<div style={{background:C.card,border:`1px solid ${C.gold}44`,borderRadius:16,padding:14,marginBottom:14}}><SecHead icon="🩻" label="طلبات معلقة لهذا المريض"/><div style={{display:"flex",flexDirection:"column",gap:7}}>{orders.filter(o=>o.patientId===selectedPatient.id&&!['reported','cancelled'].includes(o.status)).map(o=><div key={o.id} style={{border:`1px solid ${selectedOrder?.id===o.id?C.accent:C.border}`,background:selectedOrder?.id===o.id?C.accent+"12":C.bg,borderRadius:10,padding:9}}><div onClick={()=>{setSelectedOrder(o);setSelectedOrderTest(o.tests?.[0]?.id||null);const first=o.tests?.[0];if(first){const t=IMAGING_TYPES.find(x=>x.name===first.name||x.id===first.id);if(t)setType(t.id);setEye(first.eye||"OU");}setNotes(o.notes||"");}} style={{cursor:"pointer"}}><div style={{display:"flex",justifyContent:"space-between"}}><span style={{color:C.text,fontSize:11,fontWeight:700}}>{o.id}</span><Tag label={IMAGING_ORDER_STATUSES[o.status]||o.status} color={o.status==="requested"?C.gold:C.teal}/></div><div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:5}}>{(o.tests||[]).map(t=><button key={t.id} onClick={e=>{e.stopPropagation();setSelectedOrder(o);setSelectedOrderTest(t.id);const tt=IMAGING_TYPES.find(x=>x.name===t.name||x.id===t.id);if(tt)setType(tt.id);setEye(t.eye||"OU");setNotes(o.notes||"");}} style={{background:selectedOrderTest===t.id&&selectedOrder?.id===o.id?C.accent+"22":C.bg,border:`1px solid ${selectedOrderTest===t.id&&selectedOrder?.id===o.id?C.accent:C.border}`,borderRadius:6,color:C.muted,fontSize:9,padding:"3px 6px"}}>{t.name} · {t.eye||"OU"}</button>)}</div></div><div style={{display:"flex",gap:5,marginTop:7}}>{o.status==="requested"&&<button onClick={()=>advanceOrder(o,"scheduled")} style={{flex:1,background:C.gold+"18",border:`1px solid ${C.gold}44`,borderRadius:7,color:C.gold,fontSize:9,padding:5}}>📅 جدولة</button>}{o.status==="scheduled"&&<button onClick={()=>advanceOrder(o,"in_progress")} style={{flex:1,background:C.teal+"18",border:`1px solid ${C.teal}44`,borderRadius:7,color:C.teal,fontSize:9,padding:5}}>▶ بدء التنفيذ</button>}{o.status==="in_progress"&&<span style={{flex:1,textAlign:"center",color:C.teal,fontSize:9,padding:5}}>جارٍ التنفيذ — احفظ النتيجة بعد الانتهاء</span>}</div></div>)}</div></div>}

    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:14,marginBottom:14}}>
      <SecHead icon="🔬" label="نوع الفحص"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{IMAGING_TYPES.map(t=><div key={t.id} onClick={()=>setType(t.id)} style={{border:`1px solid ${type===t.id?C.accent:C.border}`,background:type===t.id?C.accent+"15":C.bg,borderRadius:10,padding:"9px 10px",cursor:"pointer"}}><div style={{display:"flex",alignItems:"center",gap:7}}><span>{t.icon}</span><span style={{color:type===t.id?C.accent:C.text,fontWeight:700,fontSize:12}}>{t.name}</span></div><div style={{color:C.muted,fontSize:9,marginTop:3}}>{t.hint}</div></div>)}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:12}}><Field label="العين"><select style={inp()} value={eye} onChange={e=>setEye(e.target.value)}>{IMAGING_EYES.map(x=><option key={x.v} value={x.v}>{x.l}</option>)}</select></Field><Field label="التاريخ"><input style={inp()} type="date" value={localDateStr()} readOnly/></Field></div>
    </div>

    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:14,marginBottom:14}}>
      <SecHead icon="☁️" label="رفع الصور / الملفات"/>
      <label style={{display:"block",border:`1px dashed ${C.accent}66`,borderRadius:12,padding:18,textAlign:"center",cursor:"pointer",background:C.accent+"08"}}><input type="file" accept="image/*,.pdf" multiple style={{display:"none"}} onChange={e=>{setFiles(Array.from(e.target.files||[]));e.target.value=""}}/><div style={{fontSize:25}}>📤</div><div style={{color:C.accent,fontWeight:700,fontSize:12}}>اختيار صور / ملفات الفحص</div><div style={{color:C.muted,fontSize:10,marginTop:3}}>يمكن اختيار أكثر من ملف</div></label>
      {files.length>0&&<div style={{marginTop:10}}>{files.map((f,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.bg,borderRadius:8,padding:"7px 9px",marginBottom:5}}><span style={{color:C.text,fontSize:10,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</span><span style={{color:C.muted,fontSize:9}}>{Math.round(f.size/1024)} KB</span></div>)}</div>}
      {progress&&<div style={{marginTop:8,color:C.accent,fontSize:10}}>⏫ {progress.name} · {progress.pct}%</div>}
    </div>

    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:14,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><SecHead icon="📝" label="التقرير"/><button onClick={()=>setReport(IMAGING_REPORT_TEMPLATES[type]||"")} style={{background:C.purple+"22",border:`1px solid ${C.purple}33`,borderRadius:8,color:C.purple,fontSize:10,padding:"5px 8px"}}>↻ قالب</button></div>
      <textarea value={report} onChange={e=>setReport(e.target.value)} rows={9} style={{...inp(),resize:"vertical",direction:"ltr",textAlign:"left",lineHeight:1.7}}/>
      <Field label="ملاحظات إضافية"><textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={3} style={{...inp(),resize:"none"}} placeholder="ملاحظات الطبيب أو الفني..."/></Field>
      <Btn full onClick={saveStudy}>{uploading?"⏳ جاري الرفع والحفظ...":"💾 حفظ الفحص والتقرير"}</Btn>
    </div>

    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><SecHead icon="🗂️" label="السجل"/><button onClick={loadStudies} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:8,color:C.muted,padding:"5px 8px"}}>🔄</button></div>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="بحث في السجل..." style={{...inp(),marginBottom:8}}/>
      <div style={{display:"flex",gap:5,overflowX:"auto",marginBottom:10}}>{[{id:"all",l:"الكل"},...IMAGING_TYPES.map(t=>({id:t.id,l:t.name}))].map(x=><button key={x.id} onClick={()=>setFilter(x.id)} style={{background:filter===x.id?C.accent+"22":"transparent",border:`1px solid ${filter===x.id?C.accent:C.border}`,borderRadius:8,color:filter===x.id?C.accent:C.muted,padding:"5px 8px",fontSize:9,whiteSpace:"nowrap"}}>{x.l}</button>)}</div>
      {loading?<div style={{padding:25,textAlign:"center",color:C.muted}}>⏳ جاري التحميل...</div>:filtered.length===0?<div style={{padding:25,textAlign:"center",color:C.muted}}>No investigations saved</div>:filtered.slice(0,30).map(x=><div key={x.id} onClick={()=>setView(x)} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:11,padding:10,marginBottom:7,cursor:"pointer"}}><div style={{display:"flex",justifyContent:"space-between",gap:8}}><div><span style={{color:C.text,fontWeight:700,fontSize:12}}>{x.patient}</span><span style={{color:C.muted,fontSize:9}}> · {x.patientCode}</span></div><Tag label={x.status==="reported"?"تم التقرير":"بدون تقرير"} color={x.status==="reported"?C.success:C.gold}/></div><div style={{color:C.accent,fontSize:10,marginTop:4}}>{x.typeName} · {x.eye} · {x.date} {x.time}</div><div style={{color:C.muted,fontSize:9,marginTop:3}}>{x.files?.length||0} ملف · {x.doctor||""}</div></div>)}
    </div>

    {view&&<Modal title={"📄 "+view.typeName+" — "+view.patient} onClose={()=>setView(null)}><div style={{display:"flex",flexDirection:"column",gap:10}}><div style={{background:C.bg,borderRadius:10,padding:10,color:C.muted,fontSize:11}}>{view.date} {view.time} · {view.eye} · {view.doctor}</div>{view.files?.map((f,i)=><div key={i} style={{border:`1px solid ${C.border}`,borderRadius:10,padding:8}}>{f.src&&f.resource_type!=="raw"&&f.resource_type!=="video"?<img src={f.src} style={{width:"100%",maxHeight:260,objectFit:"contain",background:"#000",borderRadius:8}}/>:<a href={f.src} target="_blank" rel="noreferrer" style={{display:"block",padding:18,textAlign:"center",background:C.bg,borderRadius:8,color:C.accent,fontWeight:700,fontSize:11}}>📄 فتح الملف</a>}<div style={{color:C.text,fontSize:10,marginTop:5}}>{f.name}</div></div>)}{view.report&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:10}}><div style={{color:C.gold,fontWeight:700,fontSize:11,marginBottom:6}}>التقرير</div><div style={{color:C.text,fontSize:11,lineHeight:1.8,whiteSpace:"pre-wrap",direction:"ltr",textAlign:"left"}}>{view.report}</div></div>}{view.notes&&<div style={{color:C.muted,fontSize:11,whiteSpace:"pre-wrap"}}>📝 {view.notes}</div>}<div style={{display:"flex",gap:8}}><Btn outline full onClick={()=>printDoc(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>${view.typeName}</title><style>body{font-family:Arial;padding:20px}img{max-width:100%;max-height:500px}pre{white-space:pre-wrap;line-height:1.7}</style></head><body><h2>${view.typeName}</h2><p>${view.patient} · ${view.patientCode||""} · ${view.date}</p>${(view.files||[]).map(f=>f.src&&f.resource_type!=="raw"?`<img src="${f.src}"/>`:(f.src?`<p><a href="${f.src}">فتح الملف: ${f.name||"file"}</a></p>`:"")).join("")}<h3>Report</h3><pre>${view.report||""}</pre><p>${view.notes||""}</p></body></html>`)}>🖨️ طباعة</Btn><Btn danger full onClick={()=>deleteStudy(view.id)}>🗑 حذف السجل</Btn></div></div></Modal>}
  </div>;
}

// ── Main App ──────────────────────────────────────────────────
function App() {
  const [session,setSession]=useState(()=>{
    try { const p=localStorage.getItem("iapp_session"); if(p) return JSON.parse(p); } catch {}
    try { return JSON.parse(sessionStorage.getItem("iapp_session")); } catch { return null; }
  });
  const [users,setUsersState]=useState(()=>getUsers());
  const setUsers = list => { saveUsers(list); setUsersState(list); };
  const [tab,setTab]=useState("dashboard");
  const [patOpenId,setPatOpenId]=useState(null);
  const [patNewName,setPatNewName]=useState("");
  const [showAlerts,setShowAlerts]=useState(false);
  const [showSearch,setShowSearch]=useState(false);
  const [alertsShown,setAlertsShown]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const [toast,setToast]=useState(null);
  const showToast = msg => { setToast(msg); };
  useEffect(()=>{
    const openSettings=()=>setTab("settings");
    window.addEventListener("iapp-open-settings",openSettings);
    return()=>window.removeEventListener("iapp-open-settings",openSettings);
  },[]);
  const [patients,setRawP,pR]=useDB("iapp_patients",SEED.patients);
  const [appointments,setRawA,aR,refreshAppointments]=useDB("iapp_appointments",SEED.appointments);
  const [prescriptions,setRawRx,rR]=useDB("iapp_prescriptions",SEED.prescriptions);
  const [exams,setRawE,eR]=useDB("iapp_exams",SEED.exams);
  const [visits,setRawV,vR]=useDB("iapp_visits",SEED.visits);
  const [doctors,setRawD,dR]=useDB("iapp_doctors",SEED.doctors);
  const [prices,setRawPr,prR]=useDB("iapp_prices",SEED.prices);
  const [customTests,setRawCT,ctR]=useDB("iapp_custom_tests",SEED.customTests);
  const [clinic,setRawCl,clR]=useDB("iapp_clinic",SEED.clinic);
  const [expenses,setRawEx,exR]=useDB("iapp_expenses",SEED.expenses);
  const [recurringExpenses,setRawRE,reR]=useDB("iapp_recurring_expenses",SEED.recurringExpenses);

  // Appointment sync: Realtime when available + 5-second read-only polling fallback.
  useEffect(()=>{
    if(!session) return;
    refreshAppointments();
    const iv=setInterval(refreshAppointments,5000);
    return()=>clearInterval(iv);
  },[session,refreshAppointments]);

  const withSync = fn => async v => { setSyncing(true); await fn(v); setTimeout(()=>setSyncing(false), 1200); showToast("تم الحفظ والمزامنة"); };
  const setPatients=withSync(setRawP);
  const setAppointments=withSync(setRawA);
  // Merge against the latest shared copy before changing one appointment.
  const updateSharedAppointment=async apt=>{
    const remote=await sbGet("iapp_appointments");
    const base=Array.isArray(remote)?remote:appointments;
    const next=base.some(a=>a.id===apt.id)?base.map(a=>a.id===apt.id?apt:a):[...base,apt];
    await setAppointments(next);
  };
  const setRx=withSync(setRawRx);
  const setExams=withSync(setRawE);
  const setVisits=withSync(setRawV);
  const setDoctors=withSync(setRawD);
  const setPrices=withSync(setRawPr);
  const setCustomTests=withSync(setRawCT);
  const setClinic=withSync(setRawCl);
  const setExpenses=withSync(setRawEx);
  const setRecurringExpenses=withSync(setRawRE);

  const primary = doctors.find(d=>d.isPrimary) || doctors[0] || {name:"د. عبدالستار صقر",short:"د. عبدالستار",initial:"ع"};
  const doctorNames = doctors.map(d=>d.short);

  const reset=()=>{
    setRawP(SEED.patients);setRawA(SEED.appointments);setRawRx(SEED.prescriptions);
    setRawE(SEED.exams);setRawV(SEED.visits);setRawD(SEED.doctors);setRawPr(SEED.prices);setRawCT(SEED.customTests);setRawCl(SEED.clinic);setRawEx(SEED.expenses);setRawRE(SEED.recurringExpenses);
  };

  // Show alerts on first load
  useEffect(()=>{
    if(!alertsShown && session){ setAlertsShown(true); setTimeout(()=>setShowAlerts(true),800); }
  },[session]);

  const handleLogin = (u,remember) => { const s={id:u.id,username:u.username,name:u.name,role:u.role}; if(remember){ try{localStorage.setItem("iapp_session",JSON.stringify(s));}catch{} } else { try{sessionStorage.setItem("iapp_session",JSON.stringify(s));}catch{} } setSession(s); };
  const handleLogout = () => { try{localStorage.removeItem("iapp_session");}catch{} try{sessionStorage.removeItem("iapp_session");}catch{} setSession(null); setTab("dashboard"); try{ if(window.__iappUnifiedLogout) window.__iappUnifiedLogout(); }catch{} };
  if(!session) return <LoginScreen onLogin={handleLogin}/>;

  // if a non-admin somehow lands on the accounting tab, bounce to dashboard
  const effectiveTab = (tab==="accounting" && session.role!=="admin") ? "dashboard" : tab;

  if(!pR||!aR||!rR||!eR||!vR||!dR||!prR||!ctR||!clR||!exR||!reR) return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",direction:"rtl",fontFamily:"'Segoe UI','Tahoma',Arial,sans-serif"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:16}}>👁</div>
        <div style={{color:C.accent,fontSize:16,fontWeight:700}}>I App</div>
        <div style={{color:C.muted,fontSize:13,marginTop:8}}>جاري التحميل...</div>
      </div>
    </div>
  );

  const screens={
    dashboard:<Dashboard patients={patients} appointments={appointments} visits={visits} primary={primary} clinic={clinic} onDailyReport={()=>{const html=getDailyReportHTML(localISO(),patients,visits,appointments,primary,clinic);printDoc(html);}} onPatientClick={((name,p)=>{if(p&&p.id){setPatOpenId(p.id);}else{setPatNewName(name);}setTab("patients");})}/>,
    patients:<Patients patients={patients} setPatients={setPatients} initOpenId={patOpenId} initNewName={patNewName} onInitDone={()=>{setPatOpenId(null);setPatNewName("");}} exams={exams} setExams={setExams} prescriptions={prescriptions} setRx={setRx} visits={visits} setVisits={setVisits} doctorNames={doctorNames} primaryDoctor={primary} prices={prices} clinic={clinic} session={session} customTests={customTests}/>,
    appointments:<Appointments appointments={appointments} setAppointments={setAppointments} doctorNames={doctorNames} patients={patients} session={session} onPatientClick={((name,p)=>{if(p&&p.id){setPatOpenId(p.id);}else{setPatNewName(name);}setTab("patients");})}/>,
    waiting:<WaitingRoom apts={appointments} today={localISO()} onUpdateApt={updateSharedAppointment} onCollect={()=>{}} doctorNames={doctorNames}/>,
    prescriptions:<Prescriptions prescriptions={prescriptions} setRx={setRx} patients={patients} doctorNames={doctorNames} primaryDoctor={primary} clinic={clinic}/>,
    radiology:<Radiology patients={patients} customTests={customTests} setCustomTests={setCustomTests} setExams={setExams} primary={primary} clinic={clinic}/>,
    imaging:<ImagingCenter patients={patients} primary={primary} clinic={clinic}/>,
    accounting:<Accounting visits={visits} expenses={expenses} setExpenses={setExpenses} recurringExpenses={recurringExpenses} setRecurringExpenses={setRecurringExpenses} doctors={doctors} clinic={clinic}/>,
    settings:<Settings patients={patients} appointments={appointments} prescriptions={prescriptions} exams={exams} visits={visits} doctors={doctors} setDoctors={setDoctors} prices={prices} setPrices={setPrices} clinic={clinic} setClinic={setClinic} onReset={reset} users={users} setUsers={setUsers} session={session} onLogout={handleLogout}/>,
  };

  return (
    <div style={{minHeight:"100vh",background:"#000",display:"flex",justifyContent:"center",alignItems:"flex-start"}}>
      <div style={{width:"100%",maxWidth:480,minHeight:"100vh",background:C.bg,direction:"rtl",fontFamily:"'Segoe UI','Tahoma',Arial,sans-serif",position:"relative",overflowX:"hidden"}}>
        <TopBar primary={primary} onSearch={()=>setShowSearch(true)} syncing={syncing} session={session} onLogout={handleLogout}/>
        <div style={{overflowY:"auto",maxHeight:"calc(100vh - 128px)",animation:"slideUp 0.25s ease"}}>{screens[effectiveTab]}</div>
        <BottomNav active={effectiveTab} setActive={setTab} role={session.role}/>
        {showAlerts&&<FollowUpAlerts visits={visits} patients={patients} onClose={()=>setShowAlerts(false)}/>}
        {showSearch&&<GlobalSearch patients={patients} prescriptions={prescriptions} appointments={appointments} onNavigate={(t,id)=>{if(t==="patients"&&id){setPatOpenId(id);}setTab(t);setShowSearch(false);}} onClose={()=>setShowSearch(false)}/>}
        {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
      </div>
    </div>
  );
}



const PATIENT_CLINICS=[
  {id:"damnhour",name:"عيادة دمنهور",address:"برج المنتزه بجوار حديقة الجمهورية",phone:"0453333313",icon:"🏥",days:[0,1,3,4,6],dayNames:["الأحد","الاثنين","الأربعاء","الخميس","السبت"],sessions:[{slots:["20:00","20:30","21:00","21:30","22:00"]}]},
  {id:"rahmania",name:"عيادة الرحمانية",address:"ش أحمد محمود بجوار فرع we",phone:"01111480137",icon:"🏨",days:[6,1,3],dayNames:["السبت","الاثنين","الأربعاء"],sessions:[{slots:["16:00","16:30","17:00","17:30","18:00"]}]},
  {id:"center",name:"مركز دمنهور للعيون",address:"دمنهور",phone:"0453333313",icon:"👁",schedule:{0:{slots:["13:00","13:30","14:00","14:30","15:00","15:30"]},1:{slots:["13:00","13:30","14:00","14:30","15:00","15:30"]},2:{slots:["15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30"]},4:{slots:["09:00","09:30","10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30"]}},dayNames:["الأحد","الاثنين","الثلاثاء","الخميس"]}
];
// Maps this portal's full clinic display names to the short codes used by the doctor & secretary apps
const CLINIC_CODE={"عيادة دمنهور":"دمنهور","عيادة الرحمانية":"الرحمانية","مركز دمنهور للعيون":"مركز دمنهور للعيون"};
const SHORT_TO_NAME={"دمنهور":"عيادة دمنهور","الرحمانية":"عيادة الرحمانية","مركز دمنهور للعيون":"مركز دمنهور للعيون"};
const clinicDisplay=v=>SHORT_TO_NAME[v]||v||"";

function getAvailableDates(c){
  const dates=[];const now=new Date();
  for(let i=1;i<=30;i++){const d=new Date(now);d.setDate(now.getDate()+i);const dow=d.getDay();
    const ok=c.days?c.days.includes(dow):c.schedule&&c.schedule[dow]!==undefined;
    if(ok)dates.push({date:localISO(d),dayName:["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][dow],dayOfWeek:dow});}
  return dates;
}
function getSlots(c,dow){if(c.sessions)return c.sessions[0].slots;if(c.schedule)return c.schedule[dow]?.slots||[];return[];}

function BookingForm({patient,bookForm,setBookForm,booking,onBook,slotsVersion}){
  const [step,setStep]=useState(patient.isGuest?1:2);
  const [selClinic,setSelClinic]=useState(null);
  const [availDates,setAvailDates]=useState([]);
  const [selDate,setSelDate]=useState(null);
  const [taken,setTaken]=useState({});
  const [slotsLoading,setSlotsLoading]=useState(false);
  // Load current bookings for the chosen clinic/day so full slots are disabled.
  useEffect(()=>{
    if(!selClinic||!selDate)return;
    let alive=true;setSlotsLoading(true);
    (async()=>{
      const a=await sbGet("iapp_appointments");
      if(!alive)return;
      const code=CLINIC_CODE[selClinic.name]||selClinic.name;const m={};
      if(Array.isArray(a))a.filter(x=>isActiveApt(x)&&x.date===selDate.date&&x.clinic===code).forEach(x=>{m[x.time]=(m[x.time]||0)+1;});
      setTaken(m);setSlotsLoading(false);
    })();
    return()=>{alive=false;};
  },[selClinic,selDate,slotsVersion]);
  // If the chosen slot was lost to someone else, go back to the time step.
  useEffect(()=>{ if(step>=5&&!bookForm.time)setStep(4); },[bookForm.time]);
  const s=k=>e=>setBookForm(v=>({...v,[k]:e.target.value}));
  const selClinicFn=c=>{setSelClinic(c);setBookForm(v=>({...v,clinic:c.name,date:"",time:""}));setAvailDates(getAvailableDates(c));setSelDate(null);setStep(3);};
  const selDateFn=d=>{setSelDate(d);setBookForm(v=>({...v,date:d.date,time:""}));setStep(4);};
  const selTimeFn=t=>{setBookForm(v=>({...v,time:t}));setStep(5);};

  const steps=patient.isGuest?["بياناتك","العيادة","التاريخ","الوقت","تأكيد"]:["العيادة","التاريخ","الوقت","تأكيد"];
  const currentStep=patient.isGuest?step-1:step-2;

  return(
    <div>
      {/* Progress bar */}
      <div style={{display:"flex",gap:4,marginBottom:18,alignItems:"center"}}>
        {steps.map((l,i)=>(
          <React.Fragment key={i}>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <div style={{width:24,height:24,borderRadius:"50%",background:i<currentStep?C.success:i===currentStep?C.accent:C.border,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:i<=currentStep?C.bg:C.muted,transition:"all 0.3s"}}>
                {i<currentStep?"✓":i+1}
              </div>
              <div style={{color:i===currentStep?C.accent:C.muted,fontSize:8,whiteSpace:"nowrap"}}>{l}</div>
            </div>
            {i<steps.length-1&&<div style={{flex:1,height:2,background:i<currentStep?C.success:C.border,borderRadius:1,marginBottom:14,transition:"all 0.3s"}}/>}
          </React.Fragment>
        ))}
      </div>

      {/* STEP 1: Guest data */}
      {patient.isGuest&&step===1&&(
        <div style={{background:C.surface,borderRadius:16,padding:16,border:"1px solid "+C.border,marginBottom:14}}>
          <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:14}}>👤 بياناتك أولاً</div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div><label style={{color:C.muted,fontSize:11,display:"block",marginBottom:5}}>الاسم الكامل</label>
              <input style={inp()} value={bookForm.newName||""} onChange={e=>setBookForm(v=>({...v,newName:e.target.value}))} placeholder="اكتب اسمك كاملاً"/></div>
            <div><label style={{color:C.muted,fontSize:11,display:"block",marginBottom:5}}>رقم الهاتف</label>
              <input style={inp()} value={bookForm.newPhone||""} onChange={e=>setBookForm(v=>({...v,newPhone:e.target.value}))} placeholder="01xxxxxxxxx" type="tel" inputMode="tel"/></div>
          </div>
          <button onClick={()=>{
            if(!bookForm.newName?.trim()){alert("اكتب اسمك الكامل");return;}
            if(!bookForm.newPhone?.trim()||bookForm.newPhone.length<10){alert("اكتب رقم هاتف صحيح (10 أرقام على الأقل)");return;}
            setStep(2);
          }} style={{width:"100%",marginTop:14,background:`linear-gradient(135deg,${C.accent},${C.teal})`,border:"none",borderRadius:12,padding:13,color:C.bg,fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 4px 16px "+C.accent+"44"}}>
            التالي ← اختيار العيادة
          </button>
        </div>
      )}

      {/* Guest data summary when past step 1 */}
      {patient.isGuest&&step>1&&(
        <div style={{background:C.card,border:"1px solid "+C.success+"44",borderRadius:12,padding:"10px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{color:C.text,fontSize:12,fontWeight:600}}>👤 {bookForm.newName}</div><div style={{color:C.muted,fontSize:11}}>📞 {bookForm.newPhone}</div></div>
          <span onClick={()=>setStep(1)} style={{color:C.accent,fontSize:11,cursor:"pointer",background:C.accent+"22",padding:"3px 10px",borderRadius:8}}>تغيير</span>
        </div>
      )}

      {/* STEP 2: Clinic */}
      {step>=2&&(
        <div style={{marginBottom:14}}>
          <div style={{color:C.muted,fontSize:12,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{color:step===2?C.accent:C.muted,fontWeight:step===2?700:400}}>🏥 اختر مكان الكشف</span>
            {step>2&&<span onClick={()=>{setStep(2);setSelDate(null);setBookForm(v=>({...v,date:"",time:""}));}} style={{color:C.accent,cursor:"pointer",fontSize:11,background:C.accent+"22",padding:"3px 10px",borderRadius:8}}>تغيير</span>}
          </div>
          {step===2?(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {PATIENT_CLINICS.map(c=>(
                <div key={c.id} onClick={()=>selClinicFn(c)} style={{background:C.card,border:"1px solid "+C.border,borderRadius:16,padding:16,cursor:"pointer"}}>
                  <div style={{display:"flex",alignItems:"center",gap:12}}>
                    <div style={{width:48,height:48,borderRadius:14,background:C.accent+"22",border:"1px solid "+C.accent+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>{c.icon}</div>
                    <div style={{flex:1}}>
                      <div style={{color:C.text,fontWeight:700,fontSize:14}}>{c.name}</div>
                      <div style={{color:C.muted,fontSize:11,marginTop:2}}>📍 {c.address}</div>
                      <div style={{color:C.accent,fontSize:11,marginTop:2}}>📅 {c.dayNames?.join(" · ")}</div>
                      <a href={"tel:"+c.phone} onClick={e=>e.stopPropagation()} style={{color:C.teal,fontSize:11,textDecoration:"none",display:"block",marginTop:2}}>📞 {c.phone}</a>
                    </div>
                    <div style={{width:32,height:32,borderRadius:10,background:C.accent+"22",display:"flex",alignItems:"center",justifyContent:"center",color:C.accent,fontSize:18,flexShrink:0}}>←</div>
                  </div>
                </div>
              ))}
            </div>
          ):(
            <div style={{background:C.card,border:"1px solid "+C.success+"44",borderRadius:14,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:22}}>{selClinic?.icon}</span>
              <div><div style={{color:C.text,fontWeight:700,fontSize:13}}>{selClinic?.name}</div><div style={{color:C.muted,fontSize:11}}>📍 {selClinic?.address}</div></div>
              <span style={{marginRight:"auto",color:C.success,fontSize:16}}>✓</span>
            </div>
          )}
        </div>
      )}

      {/* STEP 3: Date */}
      {step>=3&&(
        <div style={{marginBottom:14}}>
          <div style={{color:C.muted,fontSize:12,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{color:step===3?C.accent:C.muted,fontWeight:step===3?700:400}}>📅 اختر التاريخ</span>
            {step>3&&<span onClick={()=>{setStep(3);setBookForm(v=>({...v,time:""}));}} style={{color:C.accent,cursor:"pointer",fontSize:11,background:C.accent+"22",padding:"3px 10px",borderRadius:8}}>تغيير</span>}
          </div>
          {step===3?(
            <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:8}}>
              {availDates.slice(0,14).map(d=>(
                <div key={d.date} onClick={()=>selDateFn(d)} style={{flexShrink:0,background:C.card,border:"1px solid "+C.border,borderRadius:14,padding:"12px 14px",cursor:"pointer",textAlign:"center",minWidth:76}}>
                  <div style={{color:C.accent,fontSize:10,marginBottom:4}}>{d.dayName}</div>
                  <div style={{color:C.text,fontWeight:700,fontSize:13}}>{d.date.slice(5)}</div>
                </div>
              ))}
            </div>
          ):(
            <div style={{background:C.card,border:"1px solid "+C.success+"44",borderRadius:14,padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{color:C.text,fontWeight:700,fontSize:13}}>📅 {selDate?.dayName} · {bookForm.date}</div>
              <span style={{color:C.success,fontSize:16}}>✓</span>
            </div>
          )}
        </div>
      )}

      {/* STEP 4: Time */}
      {step>=4&&(
        <div style={{marginBottom:14}}>
          <div style={{color:C.muted,fontSize:12,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{color:step===4?C.accent:C.muted,fontWeight:step===4?700:400}}>⏰ اختر الوقت</span>
            {step>4&&<span onClick={()=>setStep(4)} style={{color:C.accent,cursor:"pointer",fontSize:11,background:C.accent+"22",padding:"3px 10px",borderRadius:8}}>تغيير</span>}
          </div>
          {step===4?(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
              {slotsLoading&&<div style={{gridColumn:"1 / -1",color:C.muted,fontSize:11,textAlign:"center"}}>⏳ جاري تحميل المواعيد المتاحة...</div>}
              {getSlots(selClinic,selDate?.dayOfWeek).map(t=>{
                const full=(taken[t]||0)>=SLOT_CAPACITY;
                return <div key={t} onClick={()=>!full&&!slotsLoading&&selTimeFn(t)} style={{background:full?C.bg:C.card,border:"1px solid "+C.border,borderRadius:12,padding:"12px 8px",textAlign:"center",cursor:full?"not-allowed":"pointer",color:full?C.muted:C.text,fontWeight:700,fontSize:14,opacity:full?0.45:1}}>{t}{full&&<div style={{fontSize:9,fontWeight:600,marginTop:2}}>محجوز</div>}</div>;
              })}
            </div>
          ):(
            <div style={{background:C.card,border:"1px solid "+C.success+"44",borderRadius:14,padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{color:C.text,fontWeight:700,fontSize:13}}>⏰ {bookForm.time}</div>
              <span style={{color:C.success,fontSize:16}}>✓</span>
            </div>
          )}
        </div>
      )}

      {/* STEP 5: Type + confirm */}
      {step>=5&&(
        <div style={{background:C.surface,borderRadius:16,padding:16,border:"1px solid "+C.border,marginBottom:14}}>
          <div style={{marginBottom:12}}>
            <label style={{color:C.muted,fontSize:11,display:"block",marginBottom:6}}>🔬 نوع الكشف</label>
            <select style={inp()} value={bookForm.type} onChange={s("type")}>
              {["فحص روتيني","متابعة","استشارة","قياس نظر","فحص شبكية"].map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
          <div style={{marginBottom:14}}>
            <label style={{color:C.muted,fontSize:11,display:"block",marginBottom:6}}>📝 ملاحظات (اختياري)</label>
            <textarea style={{...inp(),minHeight:55,resize:"none"}} value={bookForm.notes||""} onChange={s("notes")} placeholder="أي أعراض أو ملاحظات للطبيب..."/>
          </div>
          <div style={{background:C.bg,borderRadius:12,padding:12,marginBottom:14,border:"1px solid "+C.border}}>
            <div style={{color:C.muted,fontSize:11,fontWeight:700,marginBottom:8}}>📋 ملخص الحجز</div>
            {[["🏥",bookForm.clinic],["📅",bookForm.date],["⏰",bookForm.time],["🔬",bookForm.type],
              ...(patient.isGuest?[["👤",bookForm.newName],["📞",bookForm.newPhone]]:[])
            ].filter(([,v])=>v).map(([icon,val])=>(
              <div key={icon} style={{display:"flex",gap:10,marginBottom:5,alignItems:"center"}}>
                <span style={{fontSize:14}}>{icon}</span><span style={{color:C.text,fontSize:12}}>{val}</span>
              </div>
            ))}
          </div>
          <button onClick={onBook} disabled={booking}
            style={{width:"100%",background:booking?"#1a2840":`linear-gradient(135deg,${C.accent},${C.teal})`,border:"none",borderRadius:14,padding:14,color:C.bg,fontWeight:800,fontSize:15,cursor:"pointer",fontFamily:"inherit",opacity:booking?0.7:1,boxShadow:booking?"none":"0 4px 20px "+C.accent+"44"}}>
            {booking?"⏳ جاري الإرسال...":"📅 تأكيد الحجز"}
          </button>
        </div>
      )}
    </div>
  );
}

// ── Rating Component ──────────────────────────────────────────
function RatingPrompt({visit,patient,onDone}){
  const [rating,setRating]=useState(0);
  const [comment,setComment]=useState("");
  const [sent,setSent]=useState(false);

  const submit=async()=>{
    const ratings=await sbGet("iapp_ratings")||[];
    ratings.push({id:Date.now(),patientId:patient.id,patient:patient.name,visitId:visit.id,rating,comment,date:localISO()});
    await sbSet("iapp_ratings",ratings);
    setSent(true);setTimeout(onDone,1800);
  };

  if(sent)return(
    <div style={{textAlign:"center",padding:"30px 20px"}}>
      <div style={{fontSize:48,marginBottom:12}}>🌟</div>
      <div style={{color:C.success,fontWeight:800,fontSize:18}}>شكراً على تقييمك!</div>
    </div>
  );

  return(
    <div>
      <div style={{textAlign:"center",marginBottom:20}}>
        <div style={{color:C.text,fontWeight:700,fontSize:15,marginBottom:6}}>كيف كانت تجربتك؟</div>
        <div style={{color:C.muted,fontSize:12}}>زيارة {visit.date}</div>
      </div>
      <div style={{display:"flex",justifyContent:"center",gap:12,marginBottom:20}}>
        {[1,2,3,4,5].map(n=>(
          <div key={n} onClick={()=>setRating(n)} style={{fontSize:36,cursor:"pointer",opacity:n<=rating?1:0.3,transition:"all 0.15s",transform:n<=rating?"scale(1.1)":"scale(1)"}}>⭐</div>
        ))}
      </div>
      <textarea style={{...inp(),minHeight:70,resize:"none",marginBottom:14}} value={comment} onChange={e=>setComment(e.target.value)} placeholder="أي ملاحظات أو اقتراحات؟ (اختياري)"/>
      <div style={{display:"flex",gap:10}}>
        <button onClick={onDone} style={{flex:1,background:"transparent",border:"1px solid "+C.border,borderRadius:10,padding:10,color:C.muted,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>لاحقاً</button>
        <button onClick={submit} disabled={!rating} style={{flex:2,background:rating?`linear-gradient(135deg,${C.gold},${C.accent})`:"transparent",border:"1px solid "+(rating?C.gold:C.border),borderRadius:10,padding:10,color:rating?C.bg:C.muted,fontWeight:700,fontSize:13,cursor:rating?"pointer":"default",fontFamily:"inherit"}}>إرسال التقييم ✓</button>
      </div>
    </div>
  );
}

// ── Patient App ───────────────────────────────────────────────
function PatientApp({patient,onLogout}){
  const [tab,setTab]=useState(patient.isGuest?"book":"home");
  const [appointments,setAppointments]=useState([]);
  const [prescriptions,setPrescriptions]=useState([]);
  const [exams,setExams]=useState([]);
  const [visits,setVisits]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(null);
  const [toast,setToast]=useState(null);
  const [bookForm,setBookForm]=useState({clinic:"",date:"",time:"",type:"فحص روتيني",notes:"",isNew:patient.isGuest,newName:"",newPhone:""});
  const [booking,setBooking]=useState(false);
  const [bookDone,setBookDone]=useState(false);
  const [ratingTarget,setRatingTarget]=useState(null);
  const [slotsVersion,setSlotsVersion]=useState(0);
  const bookingLock=useRef(false);
  const today=localISO();
  // An appointment belongs to this patient by file id; legacy rows without an id
  // must match BOTH name and phone (name alone could expose another patient).
  const isMyApt=x=>{
    if(patient.isGuest||patient.id==null) return false;
    if(x.patientId!=null) return x.patientId===patient.id;
    return normArabic(x.patient)===normArabic(patient.name)&&!!patient.phone&&normPhone(x.phone)===normPhone(patient.phone);
  };

  useEffect(()=>{
    (async()=>{
      const [a,rx,ex,v]=await Promise.all([sbGet("iapp_appointments"),sbGet("iapp_prescriptions"),sbGet("iapp_exams"),sbGet("iapp_visits")]);
      if(a)setAppointments(a.filter(isMyApt));
      if(rx)setPrescriptions(rx.filter(x=>x.patientId===patient.id));
      if(ex)setExams(ex.filter(x=>x.patientId===patient.id));
      if(v){
        const pv=v.filter(x=>x.patientId===patient.id);
        setVisits(pv);
        // Check for unrated recent visits
        const unrated=pv.find(x=>{
          const d=new Date(x.date);const diff=(Date.now()-d.getTime())/(1000*3600*24);
          return diff<=3&&!x.rated;
        });
        if(unrated&&!patient.isGuest)setTimeout(()=>setRatingTarget(unrated),1500);
      }
      setLoading(false);
    })();
    // Auto-refresh every 20s to catch confirmation updates
    const iv=setInterval(async()=>{
      const a=await sbGet("iapp_appointments");
      if(a)setAppointments(a.filter(isMyApt));
    },20000);
    return()=>clearInterval(iv);
  },[]);

  const upcomingApts=appointments.filter(a=>a.date>=today&&isActiveApt(a)).sort((a,b)=>a.date.localeCompare(b.date));
  const pastApts=appointments.filter(a=>a.date<today).sort((a,b)=>b.date.localeCompare(a.date));

  const doBook=async()=>{
    if(!bookForm.clinic){alert("اختر المكان");return;}
    if(!bookForm.date){alert("اختر التاريخ");return;}
    if(!bookForm.time){alert("اختر الوقت");return;}
    if(patient.isGuest&&!bookForm.newName?.trim()){alert("اكتب اسمك");return;}
    if(patient.isGuest&&!bookForm.newPhone?.trim()){alert("اكتب رقم هاتفك");return;}
    if(bookingLock.current)return;           // blocks double-tap / double submit
    bookingLock.current=true;setBooking(true);
    const newApt={id:newId(),patientId:patient.isGuest?null:patient.id,patient:patient.isGuest?bookForm.newName:patient.name,phone:patient.isGuest?bookForm.newPhone:(patient.phone||""),date:bookForm.date,time:bookForm.time,type:bookForm.type,notes:bookForm.notes||"",doctor:"د. عبدالستار",clinic:CLINIC_CODE[bookForm.clinic]||bookForm.clinic,confirmed:false,fromPatient:true};
    const phoneKey=normPhone(newApt.phone);
    try{
      const res=await sbMutate("iapp_appointments",list=>{
        const live=list.filter(isActiveApt);
        const inSlot=live.filter(a=>a.date===newApt.date&&a.time===newApt.time&&(a.clinic||"")===newApt.clinic).length;
        if(inSlot>=SLOT_CAPACITY)return {abort:"taken"};
        const dup=live.some(a=>a.date===newApt.date&&(patient.isGuest?(!!phoneKey&&normPhone(a.phone)===phoneKey):a.patientId===patient.id));
        if(dup)return {abort:"duplicate"};
        return [...list,newApt];
      },list=>list.some(a=>a.id===newApt.id));
      if(res.ok){
        setBookDone(true);
        if(!patient.isGuest)setAppointments(prev=>[...prev,newApt]);
      }else if(res.error==="taken"){
        alert("⚠ هذا الموعد تم حجزه للتو من مريض آخر — اختر وقتاً آخر من فضلك");
        setBookForm(v=>({...v,time:""}));setSlotsVersion(x=>x+1);
      }else if(res.error==="duplicate"){
        alert("لديك حجز بالفعل في نفس اليوم. راجع «مواعيدي» أو اتصل بالعيادة لتعديله.");
      }else{
        alert("❌ تعذر إرسال الحجز — تأكد من الاتصال بالإنترنت ثم حاول مرة أخرى");
      }
    }finally{
      bookingLock.current=false;setBooking(false);
    }
  };

  const markVisitRated=async(visitId)=>{
    await sbMutate("iapp_visits",v=>v.map(x=>x.id===visitId?{...x,rated:true}:x));
    setRatingTarget(null);
  };

  const TABS=patient.isGuest?[{id:"book",label:"احجز",icon:"➕"}]:[
    {id:"home",label:"الرئيسية",icon:"🏠"},
    {id:"book",label:"احجز",icon:"➕"},
    {id:"apts",label:"مواعيدي",icon:"📅"},
    {id:"rx",label:"روشتاتي",icon:"💊"},
    {id:"exams",label:"My Investigations",icon:"🔬"},
  ];

  const nextApt=upcomingApts[0];
  // Check if next appointment is within 24h
  const isAptSoon=nextApt&&(()=>{const h=(new Date(nextApt.date+"T"+(nextApt.time||"00:00"))-new Date())/(1000*3600);return h>=0&&h<24;})();

  return(
    <div style={{height:"100%",background:C.bg,direction:"rtl",display:"flex",flexDirection:"column"}}>
      {/* Header */}
      <div style={{background:`linear-gradient(135deg,${C.surface},#0D1929)`,borderBottom:"1px solid "+C.border,padding:"0 16px",display:"flex",alignItems:"center",justifyContent:"space-between",height:60,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:38,height:38,borderRadius:"50%",background:`linear-gradient(135deg,${C.accent},${C.teal})`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,color:C.bg,fontSize:15}}>
            {patient.isGuest?"🆕":patient.name?.charAt(0)}
          </div>
          <div>
            <div style={{color:C.text,fontWeight:700,fontSize:13}}>{patient.isGuest?"مريض جديد":patient.name}</div>
            <div style={{color:C.muted,fontSize:10}}>{patient.isGuest?"احجز موعدك الأول":patient.patientCode}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {isAptSoon&&<span style={{background:C.gold+"22",color:C.gold,borderRadius:8,padding:"3px 8px",fontSize:10,fontWeight:700,animation:"pulse 2s infinite"}}>⏰ موعد قريب</span>}
          <button onClick={onLogout} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:8,padding:"6px 12px",color:C.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>خروج</button>
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,overflowY:"auto",padding:"16px 16px 0"}}>
        {loading&&<div style={{color:C.muted,textAlign:"center",padding:40,fontSize:13}}>⏳ جاري التحميل...</div>}

        {/* HOME */}
        {!loading&&tab==="home"&&<div style={{animation:"slideUp 0.25s ease"}}>
          <div style={{color:C.text,fontWeight:800,fontSize:18,marginBottom:2}}>أهلاً {patient.name?.split(" ")[0]} 👋</div>
          <div style={{color:C.muted,fontSize:12,marginBottom:20}}>عيادة د. عبدالستار صقر</div>

          {/* Next appointment banner */}
          {nextApt&&(
            <div style={{background:isAptSoon?`linear-gradient(135deg,${C.gold}22,${C.accent}11)`:`linear-gradient(135deg,${C.accent}22,${C.teal}11)`,border:"1px solid "+(isAptSoon?C.gold:C.accent)+"44",borderRadius:16,padding:16,marginBottom:16,animation:isAptSoon?"pulse 2.5s infinite":"none"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{color:isAptSoon?C.gold:C.accent,fontWeight:700,fontSize:12,marginBottom:6}}>
                    {isAptSoon?"⏰ موعدك قريب جداً!":"📅 موعدك القادم"}
                  </div>
                  <div style={{color:C.text,fontWeight:800,fontSize:16}}>{nextApt.date}</div>
                  <div style={{color:C.muted,fontSize:13,marginTop:4}}>{nextApt.time} · {nextApt.type}</div>
                  <div style={{color:C.muted,fontSize:12,marginTop:2}}>🏥 {clinicDisplay(nextApt.clinic)||nextApt.doctor}</div>
                </div>
                <div style={{textAlign:"center"}}>
                  {nextApt.confirmed
                    ?<div style={{background:C.success+"22",border:"1px solid "+C.success+"44",borderRadius:10,padding:"6px 12px",color:C.success,fontSize:12,fontWeight:700}}>✓ مؤكد</div>
                    :<div style={{background:C.gold+"22",border:"1px solid "+C.gold+"44",borderRadius:10,padding:"6px 12px",color:C.gold,fontSize:11,fontWeight:700}}>⏳ بانتظار التأكيد</div>
                  }
                </div>
              </div>
            </div>
          )}

          {/* Stats */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {[{icon:"📅",label:"مواعيد قادمة",val:upcomingApts.length,color:C.accent,action:()=>setTab("apts")},
              {icon:"💊",label:"روشتات",val:prescriptions.length,color:C.teal,action:()=>setTab("rx")},
              {icon:"🔬",label:"فحوصات",val:exams.length,color:C.gold,action:()=>setTab("exams")},
              {icon:"🗓",label:"زيارات سابقة",val:pastApts.length,color:C.muted,action:()=>setTab("apts")}
            ].map((s,i)=>(
              <div key={i} onClick={s.action} style={{background:C.card,borderRadius:14,padding:"14px",border:"1px solid "+C.border,cursor:"pointer"}}>
                <div style={{fontSize:22,marginBottom:6}}>{s.icon}</div>
                <div style={{color:s.color,fontSize:22,fontWeight:800}}>{s.val}</div>
                <div style={{color:C.muted,fontSize:11}}>{s.label}</div>
              </div>
            ))}
          </div>

          {/* Quick book */}
          <div onClick={()=>setTab("book")} style={{background:`linear-gradient(135deg,${C.accent}22,${C.teal}11)`,border:"1px solid "+C.accent+"44",borderRadius:16,padding:16,marginBottom:16,cursor:"pointer",display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:46,height:46,borderRadius:14,background:`linear-gradient(135deg,${C.accent},${C.teal})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>➕</div>
            <div>
              <div style={{color:C.text,fontWeight:700,fontSize:14}}>احجز موعد جديد</div>
              <div style={{color:C.muted,fontSize:12,marginTop:2}}>اختر المكان والوقت المناسب لك</div>
            </div>
            <div style={{color:C.accent,fontSize:18,marginRight:"auto"}}>←</div>
          </div>

          {/* Clinic contacts */}
          <div style={{background:C.card,borderRadius:14,padding:14,border:"1px solid "+C.border,marginBottom:16}}>
            <div style={{color:C.text,fontWeight:700,fontSize:13,marginBottom:12}}>📞 تواصل معنا</div>
            {PATIENT_CLINICS.map(c=>(
              <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,paddingBottom:10,borderBottom:"1px solid "+C.border+"66"}}>
                <div>
                  <div style={{color:C.text,fontSize:12,fontWeight:600}}>{c.icon} {c.name}</div>
                  <div style={{color:C.muted,fontSize:11}}>📍 {c.address}</div>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <a href={"tel:"+c.phone} style={{background:C.teal+"22",border:"1px solid "+C.teal+"33",borderRadius:8,padding:"5px 10px",color:C.teal,fontSize:12,textDecoration:"none"}}>📞</a>
                  <a href={"https://wa.me/2"+c.phone.replace(/^0/,"")} target="_blank" style={{background:"#25D36622",border:"1px solid #25D36633",borderRadius:8,padding:"5px 10px",color:"#25D366",fontSize:12,textDecoration:"none"}}>💬</a>
                </div>
              </div>
            ))}
          </div>
        </div>}

        {/* BOOKING */}
        {!loading&&tab==="book"&&<div style={{animation:"slideUp 0.25s ease"}}>
          <div style={{color:C.text,fontWeight:700,fontSize:16,marginBottom:4}}>➕ احجز موعد</div>
          <div style={{color:C.muted,fontSize:12,marginBottom:16}}>اختر المكان والوقت المناسب</div>
          {bookDone?(
            <div style={{background:C.success+"22",border:"1px solid "+C.success,borderRadius:16,padding:"30px 20px",textAlign:"center",animation:"slideUp 0.3s ease"}}>
              <div style={{fontSize:52,marginBottom:12}}>✅</div>
              <div style={{color:C.success,fontWeight:800,fontSize:18,marginBottom:8}}>تم إرسال طلب الحجز!</div>
              <div style={{background:C.bg,borderRadius:12,padding:14,marginBottom:16,textAlign:"right"}}>
                {[["📍",bookForm.clinic],["📅",bookForm.date],["⏰",bookForm.time],["🔬",bookForm.type]].map(([icon,val])=>(
                  <div key={icon} style={{display:"flex",gap:8,marginBottom:6}}><span>{icon}</span><span style={{color:C.text,fontSize:13}}>{val}</span></div>
                ))}
              </div>
              <div style={{color:C.muted,fontSize:12,marginBottom:20}}>سيتم التواصل معك لتأكيد الموعد</div>
              <button onClick={()=>{setBookDone(false);setBookForm({clinic:"",date:"",time:"",type:"فحص روتيني",notes:"",isNew:patient.isGuest,newName:"",newPhone:""}); }}
                style={{background:`linear-gradient(135deg,${C.accent},${C.teal})`,border:"none",borderRadius:10,padding:"10px 24px",color:C.bg,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
                حجز موعد آخر
              </button>
            </div>
          ):<BookingForm patient={patient} bookForm={bookForm} setBookForm={setBookForm} booking={booking} onBook={doBook} slotsVersion={slotsVersion}/>}
        </div>}

        {/* APPOINTMENTS */}
        {!loading&&tab==="apts"&&<div style={{animation:"slideUp 0.25s ease"}}>
          <div style={{color:C.text,fontWeight:700,fontSize:16,marginBottom:16}}>📅 مواعيدي</div>
          {upcomingApts.length>0&&<>
            <div style={{color:C.accent,fontSize:12,fontWeight:700,marginBottom:10}}>القادمة</div>
            {upcomingApts.map(a=>(
              <div key={a.id} style={{background:C.card,border:"1px solid "+(a.confirmed?C.success:C.accent)+"44",borderRadius:16,padding:"14px",marginBottom:10,borderRight:"3px solid "+(a.confirmed?C.success:C.accent)}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                  <div>
                    <div style={{color:C.text,fontWeight:700,fontSize:14}}>{a.date}</div>
                    <div style={{color:C.muted,fontSize:12,marginTop:2}}>{a.type}</div>
                    {a.clinic&&<div style={{color:C.teal,fontSize:11,marginTop:2}}>🏥 {clinicDisplay(a.clinic)}</div>}
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{color:C.accent,fontSize:18,fontWeight:800}}>{a.time}</div>
                    {a.confirmed
                      ?<div style={{color:C.success,fontSize:10,fontWeight:700}}>✓ مؤكد</div>
                      :<div style={{color:C.gold,fontSize:10}}>⏳ بانتظار التأكيد</div>
                    }
                  </div>
                </div>
                {a.notes&&<div style={{color:C.muted,fontSize:11}}>📝 {a.notes}</div>}
              </div>
            ))}
          </>}
          {pastApts.length>0&&<>
            <div style={{color:C.muted,fontSize:12,fontWeight:700,marginTop:16,marginBottom:10}}>السابقة</div>
            {pastApts.map(a=>(
              <div key={a.id} style={{background:C.card,border:"1px solid "+C.border,borderRadius:14,padding:"12px 14px",marginBottom:8,opacity:0.75}}>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <div><div style={{color:C.text,fontSize:13}}>{a.date}</div><div style={{color:C.muted,fontSize:11}}>{a.type}</div></div>
                  <div style={{color:C.muted,fontSize:14,fontWeight:700}}>{a.time}</div>
                </div>
              </div>
            ))}
          </>}
          {appointments.length===0&&<div style={{color:C.muted,textAlign:"center",padding:40}}>لا توجد مواعيد</div>}
        </div>}

        {/* PRESCRIPTIONS */}
        {!loading&&tab==="rx"&&<div style={{animation:"slideUp 0.25s ease"}}>
          <div style={{color:C.text,fontWeight:700,fontSize:16,marginBottom:16}}>💊 روشتاتي ({prescriptions.length})</div>
          {prescriptions.length===0&&<div style={{color:C.muted,textAlign:"center",padding:40}}>لا توجد روشتات بعد</div>}
          {prescriptions.map(rx=>(
            <div key={rx.id} style={{background:C.card,border:"1px solid "+C.border,borderRadius:16,padding:16,marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div style={{color:C.accent,fontWeight:700,fontSize:14}}>{rx.date}</div>
                <div style={{color:C.muted,fontSize:11,background:C.bg,padding:"4px 10px",borderRadius:8}}>{rx.eye}</div>
              </div>
              <div style={{background:C.bg,borderRadius:10,padding:10,marginBottom:12,border:"1px solid "+C.border}}>
                <div style={{color:C.text,fontSize:11,fontWeight:700,marginBottom:8}}>👓 كشف النظارة</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,fontSize:10,textAlign:"center"}}>
                  <div style={{color:C.muted}}>العين</div><div style={{color:C.muted}}>SPH</div><div style={{color:C.muted}}>CYL</div><div style={{color:C.muted}}>AX</div>
                  <div style={{color:C.text,fontWeight:700}}>يمنى</div><div style={{color:C.text}}>{rx.sphR||"-"}</div><div style={{color:C.text}}>{rx.cylR||"-"}</div><div style={{color:C.text}}>{rx.axisR||"-"}</div>
                  <div style={{color:C.text,fontWeight:700}}>يسرى</div><div style={{color:C.text}}>{rx.sphL||"-"}</div><div style={{color:C.text}}>{rx.cylL||"-"}</div><div style={{color:C.text}}>{rx.axisL||"-"}</div>
                </div>
                {rx.add&&<div style={{color:C.gold,fontSize:11,marginTop:8}}>ADD: {rx.add}</div>}
              </div>
              {rx.medicines&&<div style={{background:C.teal+"11",borderRadius:10,padding:10,border:"1px solid "+C.teal+"33"}}>
                <div style={{color:C.teal,fontSize:11,fontWeight:700,marginBottom:6}}>💊 الأدوية</div>
                {rx.medicines.split("\n").filter(Boolean).map((m,i)=><div key={i} style={{color:C.text,fontSize:12,marginBottom:4}}>• {m}</div>)}
              </div>}
              {rx.notes&&<div style={{color:C.muted,fontSize:11,marginTop:10}}>📝 {rx.notes}</div>}
            </div>
          ))}
        </div>}

        {/* EXAMS */}
        {!loading&&tab==="exams"&&<div style={{animation:"slideUp 0.25s ease"}}>
          <div style={{color:C.text,fontWeight:700,fontSize:16,marginBottom:16}}>🔬 نتائج My Investigations ({exams.length})</div>
          {exams.length===0&&<div style={{color:C.muted,textAlign:"center",padding:40}}>No investigations yet</div>}
          {exams.map(ex=>(
            <div key={ex.id} style={{background:C.card,border:"1px solid "+C.border,borderRadius:16,padding:16,marginBottom:14}}>
              <div style={{color:C.accent,fontWeight:700,fontSize:14,marginBottom:12}}>{ex.date} · {ex.doctor}</div>
              {ex.chiefComplaint&&<div style={{marginBottom:10}}><div style={{color:C.muted,fontSize:11,marginBottom:4}}>الشكوى</div><div style={{color:C.text,fontSize:13}}>{ex.chiefComplaint}</div></div>}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                {[["حدة الإبصار يمنى",ex.visualAcuityR],["حدة الإبصار يسرى",ex.visualAcuityL],["ضغط العين يمنى",ex.iopR],["ضغط العين يسرى",ex.iopL]].filter(([,v])=>v).map(([l,v])=>(
                  <div key={l} style={{background:C.bg,borderRadius:8,padding:"8px"}}>
                    <div style={{color:C.muted,fontSize:10}}>{l}</div>
                    <div style={{color:C.text,fontWeight:700,fontSize:13}}>{v}</div>
                  </div>
                ))}
              </div>
              {ex.diagnosis&&<div style={{background:C.accent+"11",borderRadius:10,padding:10,border:"1px solid "+C.accent+"33",marginBottom:8}}>
                <div style={{color:C.accent,fontSize:11,fontWeight:700,marginBottom:4}}>التشخيص</div>
                <div style={{color:C.text,fontSize:13}}>{ex.diagnosis}</div>
              </div>}
              {ex.treatmentPlan&&<div style={{marginTop:8}}><div style={{color:C.muted,fontSize:11,marginBottom:4}}>خطة العلاج</div><div style={{color:C.text,fontSize:12}}>{ex.treatmentPlan}</div></div>}
              {ex.followUp&&<div style={{color:C.gold,fontSize:11,marginTop:8}}>📅 موعد المتابعة: {ex.followUp}</div>}
            </div>
          ))}
        </div>}
        <div style={{height:80}}/>
      </div>

      {/* Bottom Nav */}
      <div style={{background:C.surface,borderTop:"1px solid "+C.border,display:"flex",justifyContent:"space-around",padding:"8px 0 20px",flexShrink:0}}>
        {TABS.map(t=>(
          <div key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",padding:"4px 12px",borderRadius:10,background:tab===t.id?C.accent+"22":"transparent"}}>
            <div style={{fontSize:20,filter:tab===t.id?"drop-shadow(0 0 6px "+C.accent+")":"none",transform:tab===t.id?"scale(1.15)":"scale(1)",transition:"all 0.2s"}}>{t.icon}</div>
            <div style={{color:tab===t.id?C.accent:C.muted,fontSize:9,fontWeight:tab===t.id?700:400}}>{t.label}</div>
          </div>
        ))}
      </div>

      {/* Rating Modal */}
      {ratingTarget&&<Modal title="⭐ قيّم زيارتك" onClose={()=>setRatingTarget(null)}>
        <RatingPrompt visit={ratingTarget} patient={patient} onDone={()=>markVisitRated(ratingTarget.id)}/>
      </Modal>}

      {toast&&<Toast msg={toast.msg} color={toast.color} onDone={()=>setToast(null)}/>}
    </div>
  );
}

const CLINICS_LIST=["دمنهور","الرحمانية","مركز دمنهور للعيون"];
const CLINIC_LABELS={"دمنهور":"عيادة دمنهور","الرحمانية":"عيادة الرحمانية","مركز دمنهور للعيون":"مركز دمنهور للعيون"};

function SecretaryAptForm({initial,patients,appointments=[],prices=[],onSave,onClose}){
  const blank={patient:"",patientId:null,phone:"",time:"09:00",date:localISO(),type:"فحص روتيني",doctor:"د. عبدالستار",clinic:"دمنهور",cost:"",paid:false,notes:""};
  const [mode,setMode]=useState(initial?.patientId?"existing":"new");
  const [f,setF]=useState(initial?{...blank,...initial}:blank);
  const [costTouched,setCostTouched]=useState(!!(initial&&initial.cost));
  const [err,setErr]=useState("");
  const s=k=>e=>setF(v=>({...v,[k]:e.target.value}));
  const matchPrice=t=>prices.find(p=>p.name===t||p.name.includes(t)||t.includes(p.name));
  const setType=e=>{
    const t=e.target.value;
    const m=matchPrice(t);
    setF(v=>({...v,type:t,cost:(!costTouched&&m)?m.price:v.cost}));
  };
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <div onClick={()=>{setMode("new");setF(v=>({...v,patient:"",patientId:null,phone:""}));}}
          style={{padding:"10px",borderRadius:10,border:"2px solid "+(mode==="new"?C.accent:C.border),background:mode==="new"?C.accent+"22":C.card,textAlign:"center",cursor:"pointer",color:mode==="new"?C.accent:C.muted,fontSize:12,fontWeight:700}}>
          👤 مريض جديد
        </div>
        <div onClick={()=>{setMode("existing");setF(v=>({...v,patient:"",patientId:null}));}}
          style={{padding:"10px",borderRadius:10,border:"2px solid "+(mode==="existing"?C.teal:C.border),background:mode==="existing"?C.teal+"22":C.card,textAlign:"center",cursor:"pointer",color:mode==="existing"?C.teal:C.muted,fontSize:12,fontWeight:700}}>
          📋 مريض مسجل
        </div>
      </div>
      {mode==="new"?(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div><label style={{color:C.muted,fontSize:11,display:"block",marginBottom:4}}>اسم المريض</label><input style={inp()} value={f.patient} onChange={s("patient")} placeholder="اسم المريض الجديد"/></div>
          <div><label style={{color:C.muted,fontSize:11,display:"block",marginBottom:4}}>الهاتف</label><input style={inp()} value={f.phone||""} onChange={s("phone")} placeholder="01xxxxxxxxx" type="tel"/></div>
        </div>
      ):(
        <div>
          <label style={{color:C.muted,fontSize:11,display:"block",marginBottom:4}}>اختر مريض مسجل</label>
          <select style={inp()} value={f.patientId||""} onChange={e=>{const p=patients.find(p=>p.id===Number(e.target.value));if(p)setF(v=>({...v,patientId:p.id,patient:p.name,phone:p.phone||""}));}}>
            <option value="">— اختر مريض —</option>
            {patients.map(p=><option key={p.id} value={p.id}>{p.name} - {p.patientCode}</option>)}
          </select>
        </div>
      )}

// ── Waiting Room ──────────────────────────────────────────────
// ── Instant patient call to every queue screen ─────────────────────
// Supabase Realtime "broadcast": every open queue screen receives the call in
// well under a second and announces it at the same moment (the saved
// appointment change remains as a fallback if a screen misses the message).
let _callCh=null,_callReady=null;
function callChannel(){
  const sb=getSB(); if(!sb) return null;
  if(!_callCh){
    _callCh=sb.channel("iapp_queue_calls",{config:{broadcast:{self:false}}});
    _callReady=new Promise(res=>{try{_callCh.subscribe(st=>{if(st==="SUBSCRIBED")res(true);});}catch(e){res(false);}});
  }
  return _callCh;
}
async function broadcastCall(a,repeat){
  const ch=callChannel(); if(!ch) return;
  await Promise.race([_callReady,new Promise(r=>setTimeout(r,2500))]);
  try{ await ch.send({type:"broadcast",event:"call",payload:{id:a.id,calledAt:a.calledAt||"",repeat:repeat||"",patient:a.patient||"",clinic:a.clinic||"",doctor:a.doctor||""}}); }catch(e){}
}

  const recallPatient=a=>broadcastCall(a,Date.now());
  const priorityKey="iapp_priority_doctor_"+today;
  const [priorityDoctor,setPriorityDoctor]=useState(()=>{try{return localStorage.getItem(priorityKey)||"";}catch{return "";}});
  const [clock,setClock]=useState(Date.now());
  useEffect(()=>{const t=setInterval(()=>setClock(Date.now()),60000);return()=>clearInterval(t);},[]);
  const bookedToday=[...new Set(apts.filter(a=>a.date===today&&a.doctor).map(a=>a.doctor))];
  const priorityOptions=doctorNames.filter(d=>bookedToday.includes(d));

  const avgDurationMin=durations.length?Math.round(durations.reduce((s,d)=>s+d,0)/durations.length/60000):15;
