# Edge Function settings. The webhook is called by Meta (no Supabase JWT) and the worker by pg_cron: both authenticate themselves
# (HMAC signature / shared secret). whatsapp-send keeps JWT verification and also re-checks the staff role.
[functions.whatsapp-webhook]
verify_jwt = false
[functions.whatsapp-worker]
verify_jwt = false
[functions.whatsapp-send]
verify_jwt = true
# AI scribe: JWT verified here and the admin role re-checked inside the function. Secrets: GEMINI_API_KEY (paid tier), optional GEMINI_MODEL.
[functions.ai-scribe]
verify_jwt = true
# Messenger + Instagram webhook: called by Meta, authenticated by the HMAC signature (same app secret as WhatsApp).
[functions.messenger-webhook]
verify_jwt = false
